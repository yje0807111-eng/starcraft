<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스프라이트 라이브러리</title>
<!--
  유닛·건물 스프라이트 뷰어 + 완성도 현황판.
  ⚠ 서버가 필요 없다 — 이 파일을 브라우저로 그냥 열면 된다.
     색인을 JSON+fetch 로 두면 file:// 에서 CORS 에 막힌다. 그래서 manifest.js(전역 대입)다.
  색인 갱신: node scripts/sprite-manifest.mjs
  폴더 규칙: SPRITES.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0e1013; --panel:#161a20; --panel-2:#1d222a;
    --line:#2a313b; --line-hi:#3c4653;
    --bone:#e6e2d8; --muted:#8a929d; --dim:#5b636e;
    --jade:#4f9270; --amber:#d19a3f; --amber-dim:#7a5a24;
    --race:#8a929d;                       /* 선택된 종족 색 — JS가 갈아 끼운다 */
    --r:3px;
    --font-d:'Rajdhani',system-ui,sans-serif;
    --font-b:'IBM Plex Sans',system-ui,sans-serif;
    --font-m:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--bone); font-family:var(--font-b); font-size:14px;
    line-height:1.55; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px; margin:0 auto; padding:22px 20px 60px}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:12px}
  h1{font-family:var(--font-d); font-weight:700; font-size:27px; letter-spacing:.02em; margin:0}
  h1 span{color:var(--muted); font-weight:500; font-size:20px}
  .tot{font-family:var(--font-m); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;
    display:flex; gap:16px; align-items:center}
  .tot b{color:var(--bone); font-weight:500}

  /* 종족 띠 */
  .races{display:flex; gap:6px; margin:14px 0 18px; flex-wrap:wrap}
  .rtab{font-family:var(--font-d); font-weight:600; font-size:14px; letter-spacing:.02em;
    background:var(--panel); color:var(--muted); border:1px solid var(--line); border-bottom-width:2px;
    border-radius:var(--r); padding:6px 15px 5px; cursor:pointer; display:flex; align-items:baseline; gap:8px}
  .rtab:hover{background:var(--panel-2); color:var(--bone)}
  .rtab:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .rtab.sel{color:var(--bone); background:var(--panel-2); border-bottom-color:var(--rc)}
  .rtab i{font-style:normal; font-family:var(--font-m); font-size:10.5px; color:var(--dim)}
  .rtab.sel i{color:var(--rc)}

  .cols{display:grid; grid-template-columns:262px minmax(0,1fr); gap:18px; align-items:start}
  @media (max-width:940px){ .cols{grid-template-columns:minmax(0,1fr)} }

  /* 목록 */
  .list{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .search{width:100%; background:var(--ground); color:var(--bone); border:0;
    border-bottom:1px solid var(--line); padding:9px 11px; font-family:var(--font-b); font-size:13px}
  .search::placeholder{color:var(--dim)}
  .search:focus{outline:none; box-shadow:inset 0 -2px 0 var(--amber)}
  .lsec{font-family:var(--font-d); font-weight:600; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--dim); padding:9px 11px 4px}
  .scroll{max-height:560px; overflow-y:auto}
  .item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
    border:0; border-left:2px solid transparent; color:var(--muted); cursor:pointer;
    padding:5px 11px; font-family:var(--font-b); font-size:13px}
  .item:hover{background:var(--panel-2); color:var(--bone)}
  .item.sel{background:var(--panel-2); color:var(--bone); border-left-color:var(--race)}
  .item:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .item .id{font-family:var(--font-m); font-size:10px; color:var(--dim); margin-left:auto}
  .item.sel .id{color:var(--muted)}
  .pips{display:flex; gap:2px; flex:0 0 auto}
  .pip{width:5px; height:11px; border-radius:1px; background:var(--line)}
  .pip.on{background:var(--jade)}

  /* 무대 */
  .viewer{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px}
  .vhead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px}
  .vhead h2{font-family:var(--font-d); font-weight:700; font-size:21px; margin:0; letter-spacing:.02em}
  .vhead .id{font-family:var(--font-m); font-size:11.5px; color:var(--muted)}
  .vhead .tag{font-family:var(--font-d); font-weight:600; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--race); border:1px solid var(--race); border-radius:2px;
    padding:0 6px; opacity:.85}

  .acts{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap}
  .act{font-family:var(--font-d); font-weight:600; font-size:13px; background:var(--ground);
    color:var(--dim); border:1px solid var(--line); border-radius:var(--r); padding:4px 12px; cursor:pointer}
  .act.has{color:var(--bone); border-color:var(--line-hi)}
  .act.has:hover{background:var(--panel-2)}
  .act.sel{border-color:var(--amber); color:var(--amber)}
  .act:disabled{cursor:not-allowed}
  .act:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .act em{font-style:normal; font-family:var(--font-m); font-size:9.5px; margin-left:5px; opacity:.7}

  .vbody{display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:16px; align-items:start}
  @media (max-width:820px){ .vbody{grid-template-columns:minmax(0,1fr)} }

  .stage{background:#0a0c0f; border:1px solid var(--line); border-radius:var(--r);
    position:relative; overflow:hidden; aspect-ratio:1/1}
  .stage.bg-light{background:#ddd8cc}
  .stage.bg-check{background-color:#2a2f36;
    background-image:linear-gradient(45deg,#1b1f25 25%,transparent 25%,transparent 75%,#1b1f25 75%),
                     linear-gradient(45deg,#1b1f25 25%,transparent 25%,transparent 75%,#1b1f25 75%);
    background-size:24px 24px; background-position:0 0,12px 12px}
  .stage img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0}
  .stage img.on{opacity:1}
  .stage .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; color:var(--dim); font-family:var(--font-d); font-size:15px}
  .stage .empty code{font-family:var(--font-m); font-size:11px; color:var(--muted)}
  .guides{position:absolute; inset:0; pointer-events:none; opacity:0}
  .guides.on{opacity:1}
  .guides i{position:absolute; background:var(--amber); opacity:.42}
  .guides .v{left:50%; top:0; bottom:0; width:1px}
  .guides .h{left:0; right:0; bottom:16%; height:1px}

  .compass{display:grid; grid-template-columns:repeat(3,1fr); gap:5px}
  .cell{position:relative; background:var(--ground); border:1px solid var(--line);
    border-radius:var(--r); aspect-ratio:1/1; cursor:pointer; padding:0}
  .cell:hover{border-color:var(--line-hi)}
  .cell.sel{border-color:var(--amber)}
  .cell.void{cursor:default; opacity:.35}
  .cell:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .cell img{position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px);
    object-fit:contain; opacity:0}
  .cell img.on{opacity:1}
  .cell .n{position:absolute; top:2px; left:4px; font-family:var(--font-m); font-size:9.5px;
    color:var(--dim); z-index:2}
  .cell.sel .n{color:var(--amber)}
  .cell .lbl{position:absolute; bottom:2px; left:0; right:0; text-align:center;
    font-family:var(--font-d); font-weight:600; font-size:11px; color:var(--dim); z-index:2}
  .cell.sel .lbl{color:var(--bone)}
  .hub{display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px dashed var(--line); border-radius:var(--r); aspect-ratio:1/1;
    font-family:var(--font-m); font-size:9.5px; color:var(--dim); gap:2px}
  .hub b{font-family:var(--font-d); font-size:22px; font-weight:700; color:var(--amber); line-height:1}

  .ctrl{display:flex; flex-direction:column; gap:10px; margin-top:11px}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .cap{font-family:var(--font-d); font-weight:600; font-size:11.5px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--dim); min-width:44px}
  button.btn{font-family:var(--font-d); font-weight:600; font-size:12.5px; background:var(--panel-2);
    color:var(--bone); border:1px solid var(--line-hi); border-radius:var(--r); padding:5px 11px; cursor:pointer}
  button.btn:hover{background:#252c35; border-color:var(--amber-dim)}
  button.btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  button.btn.pri{background:var(--amber-dim); border-color:var(--amber); color:#f4e6cd; min-width:68px}
  button.btn.on{border-color:var(--amber); color:var(--amber)}
  input[type=range]{flex:1; min-width:100px; accent-color:var(--amber); height:20px}
  .val{font-family:var(--font-m); font-size:11.5px; min-width:48px; text-align:right;
    font-variant-numeric:tabular-nums; color:var(--muted)}

  /* 현황판 */
  .board{margin-top:20px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r); padding:14px; overflow-x:auto}
  .board h2{font-family:var(--font-d); font-weight:600; font-size:12px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--amber); margin:0 0 10px}
  table{border-collapse:collapse; font-size:12.5px; min-width:420px}
  th,td{text-align:left; padding:2px 9px 2px 0; white-space:nowrap}
  thead th{font-family:var(--font-d); font-weight:600; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); padding-bottom:5px}
  tbody td:first-child{color:var(--muted)}
  tbody tr:hover td:first-child{color:var(--bone)}
  .box{display:inline-block; width:15px; height:15px; border-radius:2px; border:1px solid var(--line);
    background:var(--ground); vertical-align:-3px}
  .box.on{background:var(--jade); border-color:var(--jade)}
  .box.part{background:linear-gradient(135deg,var(--jade) 50%,var(--ground) 50%); border-color:var(--jade)}
  .pct{font-family:var(--font-m); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}

  .miss{margin-top:22px; border-top:1px solid var(--line); padding-top:14px; color:var(--muted); font-size:13px}
  .miss code{font-family:var(--font-m); font-size:11.5px; color:var(--bone); background:var(--ground);
    border:1px solid var(--line); border-radius:2px; padding:1px 5px}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>스프라이트 라이브러리 <span id="gen"></span></h1>
    <div class="tot" id="tot"></div>
  </header>

  <div class="races" id="races"></div>

  <div class="cols">
    <div class="list">
      <input class="search" id="search" type="search" placeholder="이름 또는 id 검색" aria-label="검색">
      <div class="scroll" id="listbody"></div>
    </div>

    <div class="viewer">
      <div class="vhead">
        <h2 id="vname">—</h2>
        <span class="id" id="vid"></span>
        <span class="tag" id="vtag"></span>
      </div>
      <div class="acts" id="acts"></div>
      <div class="vbody">
        <div>
          <div class="stage" id="stage"><div class="guides" id="guides"><i class="v"></i><i class="h"></i></div></div>
          <div class="ctrl">
            <div class="row">
              <span class="cap">재생</span>
              <button class="btn pri" id="play">일시정지</button>
              <button class="btn" id="prev">◀</button>
              <button class="btn" id="next">▶</button>
              <span class="val" id="fnum">— / —</span>
            </div>
            <div class="row">
              <span class="cap">속도</span>
              <input type="range" id="fps" min="1" max="24" step="1" value="10" aria-label="초당 프레임">
              <span class="val" id="fpsval">10 fps</span>
            </div>
            <div class="row">
              <span class="cap">배경</span>
              <button class="btn on" data-bg="">어둠</button>
              <button class="btn" data-bg="bg-light">밝음</button>
              <button class="btn" data-bg="bg-check">격자</button>
              <button class="btn" id="guidebtn">기준선</button>
            </div>
          </div>
        </div>
        <div id="side"></div>
      </div>
    </div>
  </div>

  <div class="board">
    <h2 id="boardtitle">완성도</h2>
    <table id="boardtable"></table>
  </div>

  <div class="miss">
    색인은 <code>node scripts/sprite-manifest.mjs</code> 로 다시 만듭니다.
    폴더 규칙은 <code>SPRITES.md</code> 가 단일 소스입니다.
  </div>
</div>

<script src="../assets/sprites/manifest.js"></script>
<script>
(function(){
'use strict';
const M = (typeof SPRITE_MANIFEST !== 'undefined') ? SPRITE_MANIFEST : null;
if (!M) { document.body.innerHTML = '<p style="padding:40px;font-family:monospace">' +
  'assets/sprites/manifest.js 가 없습니다 — node scripts/sprite-manifest.mjs 를 먼저 실행하세요.</p>'; return; }

const ACT_KO = { move:'이동', attack:'공격', cast:'스킬', idle:'대기',
                 build:'건설 중', produce:'생산 중', upgrade:'업그레이드', wreck:'파괴 중' };
// 격자 자리 = 실제 진행 방향(엔진 face = 번호 × 45°, face 0 = 카메라 쪽)
const GRID = [ {d:5,l:'좌상'},{d:4,l:'멀어짐'},{d:3,l:'우상'},
               {d:6,l:'왼쪽'},{d:null},        {d:2,l:'오른쪽'},
               {d:7,l:'좌하'},{d:0,l:'카메라'},{d:1,l:'우하'} ];
const DIR_KO = {0:'카메라 쪽',1:'우하',2:'오른쪽',3:'우상',4:'멀어짐',5:'좌상',6:'왼쪽',7:'좌하'};

let race = M.order[0], entId = null, action = null, dir = 0, frame = 0, playing = true, fps = 10;
const $ = id => document.getElementById(id);

function ent(r, id){ const R = M.races[r]; return (R.units[id] || R.buildings[id] || null); }
function actList(e){ return e.kind === 'unit' ? M.unitActions
  : (e.kind === 'def' ? M.bldgActions.concat([M.defAction]) : M.bldgActions); }
function isDirAction(e, a){ return e.kind === 'unit' ? true : (e.kind === 'def' && a === M.defAction); }
function srcOf(r, id, a, d, i, ext){
  const seg = (d === null ? a : a + '_' + d);
  return '../assets/sprites/' + r + '/' + id + '/' + seg + '/f' + String(i).padStart(2,'0') + '.' + ext;
}
function doneOf(e){ const l = actList(e); let n = 0; for (const a of l) if (e.actions[a]) n++; return [n, l.length]; }

// ── 종족 띠 ────────────────────────────────────────────────────────
function paintRaces(){
  const host = $('races'); host.innerHTML = '';
  let gd = 0, gt = 0, gf = 0;
  for (const k of M.order){
    const R = M.races[k]; if (!R) continue;
    let d = 0, t = 0;
    for (const grp of [R.units, R.buildings]) for (const id in grp){
      const [a,b] = doneOf(grp[id]); d += a; t += b;
      for (const ac in grp[id].actions){ const s = grp[id].actions[ac]; if (s) gf += s.frames * Math.max(1, s.dirs); }
    }
    gd += d; gt += t;
    const b = document.createElement('button');
    b.className = 'rtab' + (k === race ? ' sel' : ''); b.type = 'button';
    b.style.setProperty('--rc', R.col);
    b.innerHTML = R.name + ' <i>' + d + '/' + t + '</i>';
    b.addEventListener('click', () => { race = k; entId = null; paintAll(); });
    host.appendChild(b);
  }
  $('gen').textContent = M.generated;
  $('tot').innerHTML = '<div>액션 <b>' + gd + '</b> / ' + gt + '</div><div>프레임 <b>' + gf + '</b>장</div>';
  document.documentElement.style.setProperty('--race', M.races[race].col);
}

// ── 목록 ──────────────────────────────────────────────────────────
function paintList(){
  const R = M.races[race], q = $('search').value.trim().toLowerCase();
  const host = $('listbody'); host.innerHTML = '';
  const add = (title, grp) => {
    const ids = Object.keys(grp).filter(id => !q || id.toLowerCase().indexOf(q) >= 0 || grp[id].name.toLowerCase().indexOf(q) >= 0);
    if (!ids.length) return;
    const h = document.createElement('div'); h.className = 'lsec';
    h.textContent = title + ' ' + ids.length; host.appendChild(h);
    for (const id of ids){
      const e = grp[id], [d, t] = doneOf(e);
      const b = document.createElement('button');
      b.className = 'item' + (id === entId ? ' sel' : ''); b.type = 'button';
      const pips = actList(e).map(a => '<span class="pip' + (e.actions[a] ? ' on' : '') + '"></span>').join('');
      b.innerHTML = '<span class="pips">' + pips + '</span>' + e.name + '<span class="id">' + id + '</span>';
      b.title = e.name + ' (' + id + ') — ' + d + '/' + t;
      b.addEventListener('click', () => { select(id); });
      host.appendChild(b);
    }
  };
  add('유닛', R.units); add('건물', R.buildings);
}

// ── 무대 ──────────────────────────────────────────────────────────
let stageImgs = [], cellImgs = {};
function select(id){
  entId = id; const e = ent(race, id); if (!e) return;
  const l = actList(e);
  action = l.find(a => e.actions[a]) || l[0];
  dir = 0; frame = 0;
  paintList(); paintViewer();
}
function paintViewer(){
  const e = entId ? ent(race, entId) : null;
  $('vname').textContent = e ? e.name : '왼쪽에서 고르세요';
  $('vid').textContent = e ? entId : '';
  $('vtag').textContent = e ? (e.kind === 'unit' ? '유닛' : e.kind === 'def' ? '방어 건물' : '건물') : '';
  const acts = $('acts'); acts.innerHTML = '';
  if (!e){ $('stage').querySelectorAll('img').forEach(n => n.remove()); $('side').innerHTML = ''; return; }
  for (const a of actList(e)){
    const s = e.actions[a];
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'act' + (s ? ' has' : '') + (a === action ? ' sel' : '');
    b.disabled = !s;
    b.innerHTML = (ACT_KO[a] || a) + (s ? '<em>' + (s.dirs ? s.dirs + '×' : '') + s.frames + '</em>' : '<em>—</em>');
    b.addEventListener('click', () => { action = a; dir = 0; frame = 0; paintViewer(); });
    acts.appendChild(b);
  }
  buildStage(); buildSide(); paintFrames();
}
function buildStage(){
  const st = $('stage');
  st.querySelectorAll('img,.empty').forEach(n => n.remove());
  stageImgs = [];
  const e = ent(race, entId), s = e && e.actions[action];
  if (!s){
    const seg = action + (isDirAction(e, action) ? '_0' : '');
    const em = document.createElement('div'); em.className = 'empty';
    em.innerHTML = '<div>아직 없음</div><code>assets/sprites/' + race + '/' + entId + '/' + seg + '/</code>';
    st.appendChild(em); return;
  }
  const d = isDirAction(e, action) ? dir : null;
  for (let i = 0; i < s.frames; i++){
    const im = new Image(); im.src = srcOf(race, entId, action, d, i, s.ext);
    im.alt = e.name + ' ' + (ACT_KO[action] || action) + ' 프레임 ' + i;
    st.insertBefore(im, st.firstChild); stageImgs.push(im);
  }
}
function buildSide(){
  const host = $('side'); host.innerHTML = ''; cellImgs = {};
  const e = ent(race, entId), s = e && e.actions[action];
  if (!e || !isDirAction(e, action)){
    if (s) host.innerHTML = '<div class="hub" style="aspect-ratio:auto;padding:22px 14px;border-style:solid">' +
      '<b>' + s.frames + '</b><span>프레임 · 방향 없음</span></div>';
    return;
  }
  const c = document.createElement('div'); c.className = 'compass';
  for (const g of GRID){
    if (g.d === null){
      const hub = document.createElement('div'); hub.className = 'hub';
      hub.innerHTML = '<b id="hubn">' + dir + '</b><span>face ' + (dir*45) + '°</span>';
      c.appendChild(hub); continue;
    }
    const b = document.createElement('button'); b.type = 'button';
    const have = !!s;
    b.className = 'cell' + (g.d === dir ? ' sel' : '') + (have ? '' : ' void');
    b.setAttribute('aria-label', DIR_KO[g.d]);
    b.innerHTML = '<span class="n">' + g.d + '</span><span class="lbl">' + g.l + '</span>';
    if (have){
      cellImgs[g.d] = [];
      for (let i = 0; i < s.frames; i++){
        const im = new Image(); im.src = srcOf(race, entId, action, g.d, i, s.ext); im.alt = '';
        b.appendChild(im); cellImgs[g.d].push(im);
      }
      b.addEventListener('click', () => { dir = g.d; buildStage(); buildSide(); paintFrames(); });
    }
    c.appendChild(b);
  }
  host.appendChild(c);
}
function paintFrames(){
  const n = stageImgs.length;
  if (n) frame = frame % n;
  stageImgs.forEach((im, i) => im.classList.toggle('on', i === frame));
  for (const d in cellImgs) cellImgs[d].forEach((im, i) => im.classList.toggle('on', i === frame));
  $('fnum').textContent = n ? (String(frame).padStart(2,'0') + ' / ' + String(n-1).padStart(2,'0')) : '— / —';
}

// ── 현황판 ────────────────────────────────────────────────────────
function paintBoard(){
  const R = M.races[race];
  $('boardtitle').textContent = R.name + ' 완성도';
  const cols = [];
  for (const a of M.unitActions) cols.push(a);
  for (const a of M.bldgActions) if (cols.indexOf(a) < 0) cols.push(a);
  let h = '<thead><tr><th>대상</th>' + cols.map(a => '<th>' + (ACT_KO[a] || a) + '</th>').join('') + '<th></th></tr></thead><tbody>';
  const rows = (grp) => {
    for (const id in grp){
      const e = grp[id], l = actList(e), [d, t] = doneOf(e);
      h += '<tr><td>' + e.name + '</td>';
      for (const a of cols){
        if (l.indexOf(a) < 0){ h += '<td></td>'; continue; }
        const s = e.actions[a];
        const cls = !s ? '' : (isDirAction(e, a) && s.dirs < M.dirs ? ' part' : ' on');
        const tip = !s ? '없음' : (s.dirs ? s.dirs + '방향 × ' + s.frames + '장' : s.frames + '장');
        h += '<td><span class="box' + cls + '" title="' + (ACT_KO[a]||a) + ' — ' + tip + '"></span></td>';
      }
      h += '<td class="pct">' + d + '/' + t + '</td></tr>';
    }
  };
  rows(R.units); rows(R.buildings);
  $('boardtable').innerHTML = h + '</tbody>';
}

function paintAll(){ paintRaces(); paintList(); paintViewer(); paintBoard(); }

// ── 재생 ──────────────────────────────────────────────────────────
let last = 0, acc = 0;
function loop(t){
  if (playing && stageImgs.length > 1){
    if (last){ acc += t - last; const step = 1000/fps;
      while (acc >= step){ acc -= step; frame = (frame + 1) % stageImgs.length; paintFrames(); } }
    last = t;
  } else last = 0;
  requestAnimationFrame(loop);
}
function setPlay(v){ playing = v; $('play').textContent = v ? '일시정지' : '재생'; if (!v) acc = 0; }
$('play').addEventListener('click', () => setPlay(!playing));
$('prev').addEventListener('click', () => { setPlay(false); if (stageImgs.length){ frame = (frame - 1 + stageImgs.length) % stageImgs.length; paintFrames(); } });
$('next').addEventListener('click', () => { setPlay(false); if (stageImgs.length){ frame = (frame + 1) % stageImgs.length; paintFrames(); } });
$('fps').addEventListener('input', e => { fps = +e.target.value; $('fpsval').textContent = fps + ' fps'; });
$('search').addEventListener('input', paintList);
document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-bg]').forEach(o => o.classList.remove('on'));
  b.classList.add('on');
  $('stage').className = 'stage' + (b.dataset.bg ? ' ' + b.dataset.bg : '');
}));
$('guidebtn').addEventListener('click', () => {
  const on = $('guides').classList.toggle('on'); $('guidebtn').classList.toggle('on', on);
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' '){ e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight'){ setPlay(false); if (stageImgs.length){ frame = (frame+1)%stageImgs.length; paintFrames(); } }
  else if (e.key === 'ArrowLeft'){ setPlay(false); if (stageImgs.length){ frame = (frame-1+stageImgs.length)%stageImgs.length; paintFrames(); } }
  else if (e.key >= '1' && e.key <= '8'){ const d = +e.key - 1; if (cellImgs[d]){ dir = d; buildStage(); buildSide(); paintFrames(); } }
});

// 첫 화면은 프레임이 있는 첫 대상을 연다 — 종족까지 건너뛴다.
// (기본 종족에 아직 아무것도 없으면 빈 화면으로 시작해 도구가 고장 난 것처럼 보인다)
(function(){
  for (const k of M.order){ const R = M.races[k];
    for (const grp of [R.units, R.buildings]) for (const id in grp)
      if (doneOf(grp[id])[0] > 0){ race = k; paintRaces(); select(id); return; } }
  paintAll();
})();
paintBoard();
requestAnimationFrame(loop);
})();
</script>
</body>
