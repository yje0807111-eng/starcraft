<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>환생 트리 별 — 테두리 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'IBM Plex Sans KR',sans-serif;--font-num:'Rajdhani',sans-serif;--gold:#ffd24a}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:22px;justify-content:center;align-items:flex-start}
.cell{width:400px}
.cap{margin:0 0 5px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:#8d97a6;font-size:11px;line-height:1.65;min-height:62px}
.pane{position:relative;width:400px;height:300px;
  background:radial-gradient(120% 120% at 50% 30%,#1a2029 0%,#0d1015 62%,#07090c 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}
.lab{text-anchor:middle;font-size:9px;fill:#6d7683}
.sm{text-anchor:middle;font-size:8px;fill:#5c6674}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
/* 왼쪽 셋 = 크게(확대했을 때) · 오른쪽 줄 = 실제 크기(24px 부근) */
const BIG = [
  { x: 76, y:104, r:44, col:'#ffd24a', ic:'mine',   own:1 },
  { x:196, y:104, r:44, col:'#4aa8ff', ic:'endure', own:1 },
  { x:316, y:104, r:44, col:'#ff3b3b', ic:'bossHp', own:1 },
];
const SMALL = [
  { x: 96, y:224, r:15, col:'#ffd24a', ic:'gather', own:1 },
  { x:140, y:224, r:15, col:'#ffd24a', ic:'gas',    own:1 },
  { x:184, y:224, r:15, col:'#4aa8ff', ic:'atk',    own:1 },
  { x:228, y:224, r:15, col:'#4aa8ff', ic:'hp',     own:0 },
  { x:272, y:224, r:15, col:'#ff3b3b', ic:'foeHp',  own:1 },
  { x:316, y:224, r:15, col:'#ff3b3b', ic:'foeN',   own:0 },
];
const ICO = '../../assets/icons/tree/';
function hexPts(x, y, r){ const q = [];
  for(let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 90);
    q.push((x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1)); }
  return q.join(' '); }
function img(s){ const w = s.r * 1.46;
  return '<image href="' + ICO + s.ic + '.webp" x="' + (s.x - w / 2).toFixed(1) + '" y="' +
    (s.y - w / 2).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + w.toFixed(1) +
    '" opacity="' + (s.own ? 1 : .55) + '"/>'; }
function gid(o, s, i){ return 'g' + o.id + '_' + i; }

/* ── 테두리 그리는 법 여덟 가지 ─────────────────────────────────────── */
function edge(s, o, i){
  const w = s.own ? (o.w != null ? o.w : 2) : (o.wOff != null ? o.wOff : 1.1);
  const col = s.own ? s.col : 'rgba(200,220,240,.30)';
  const base = 'points="' + hexPts(s.x, s.y, s.r) + '" fill="rgba(6,9,14,.94)"';
  const glow = (o.glow && s.own) ? ' style="filter:drop-shadow(0 0 ' + (o.glow * s.r / 44 + 1).toFixed(1) + 'px ' + s.col + ')"' : '';
  let out = '';
  if(o.grad && s.own){
    // 위 → 아래로 밝기가 떨어지는 선
    out += '<polygon ' + base + ' stroke="url(#' + gid(o, s, i) + ')" stroke-width="' + w + '"' + glow + '/>';
  } else if(o.dbl && s.own){
    // 두 겹 — 바깥은 어둡고 굵게, 안쪽은 밝고 아주 얇게
    out += '<polygon points="' + hexPts(s.x, s.y, s.r) + '" fill="rgba(6,9,14,.94)" stroke="' + s.col +
      '" stroke-width="' + (w + 1) + '" opacity=".34"/>';
    out += '<polygon points="' + hexPts(s.x, s.y, s.r - 0.9) + '" fill="none" stroke="' + s.col +
      '" stroke-width="' + w + '"' + glow + '/>';
  } else if(o.topLit && s.own){
    // 광원 방향 — 위쪽 세 변만 밝고 아래 세 변은 어둡다
    const p = hexPts(s.x, s.y, s.r).split(' ');
    out += '<polygon ' + base + ' stroke="' + s.col + '" stroke-width="' + w + '" opacity=".28"/>';
    out += '<path d="M' + p[4].replace(',', ' ') + 'L' + p[5].replace(',', ' ') +
      'L' + p[0].replace(',', ' ') + 'L' + p[1].replace(',', ' ') +
      '" fill="none" stroke="' + s.col + '" stroke-width="' + (w + .4) + '" stroke-linecap="round"' + glow + '/>';
  } else if(o.corner && s.own){
    // 꼭짓점만 밝다 — 변 중앙으로 갈수록 사라진다
    out += '<polygon ' + base + ' stroke="' + s.col + '" stroke-width="' + w + '" opacity=".22"/>';
    const P = [];
    for(let k = 0; k < 6; k++){ const a = Math.PI / 180 * (60 * k - 90);
      P.push([s.x + s.r * Math.cos(a), s.y + s.r * Math.sin(a)]); }
    let d = '';
    for(let k = 0; k < 6; k++){ const A = P[k], B = P[(k + 1) % 6];
      d += 'M' + A[0].toFixed(1) + ' ' + A[1].toFixed(1) +
           'L' + (A[0] + (B[0] - A[0]) * .3).toFixed(1) + ' ' + (A[1] + (B[1] - A[1]) * .3).toFixed(1) +
           'M' + B[0].toFixed(1) + ' ' + B[1].toFixed(1) +
           'L' + (B[0] + (A[0] - B[0]) * .3).toFixed(1) + ' ' + (B[1] + (A[1] - B[1]) * .3).toFixed(1); }
    out += '<path d="' + d + '" fill="none" stroke="' + s.col + '" stroke-width="' + (w + .5) +
      '" stroke-linecap="round"' + glow + '/>';
  } else {
    out += '<polygon ' + base + ' stroke="' + col + '" stroke-width="' + w + '"' + glow + '/>';
  }
  if(o.inLine && s.own)   // 안쪽에 아주 얇은 밝은 선 하나 더
    out += '<polygon points="' + hexPts(s.x, s.y, s.r - 3.2) + '" fill="none" stroke="#fff" stroke-width=".6" opacity=".16"/>';
  return out;
}
function defs(o){
  if(!o.grad) return '';
  let d = '<defs>';
  BIG.concat(SMALL).forEach(function(s, i){
    if(!s.own) return;
    d += '<linearGradient id="' + gid(o, s, i) + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>' +
      '<stop offset=".42" stop-color="' + s.col + '"/>' +
      '<stop offset="1" stop-color="' + s.col + '" stop-opacity=".34"/></linearGradient>';
  });
  return d + '</defs>';
}
function scene(o){
  o = o || {};
  let s = defs(o);
  BIG.forEach(function(b, i){ s += edge(b, o, i) + img(b); });
  SMALL.forEach(function(b, i){ s += edge(b, o, 100 + i) + img(b); });
  s += '<text class="lab" x="196" y="176">확대했을 때</text>';
  s += '<text class="sm" x="206" y="262">실제 크기(24px 부근) — 산 것 넷 · 안 산 것 둘</text>';
  return '<svg viewBox="0 0 400 300">' + s + '</svg>';
}

const CASES = [
  { t:'지금 (기준)', d:'산 별 테두리 <b>2px</b> 단색. 굵어서 육각이 뭉툭해 보이고, 색이 평평해 금속 느낌이 없다.',
    o:{ w:2, glow:3 } },
  { t:'그냥 얇게', d:'2px → <b>1.2px</b>. 각이 살아나고 아이콘이 넓어 보인다. ⚠ 「샀다」가 약해져서 번짐을 조금 키웠다.',
    o:{ w:1.2, glow:4 } },
  { t:'세로 그라데이션', d:'⭐ 위는 <b>흰빛</b>, 아래로 갈수록 갈래 색이 옅어진다. 한 선인데 <b>금속에 빛이 닿은</b> 느낌이 난다.',
    o:{ w:1.3, glow:3.5, grad:1, id:'A' } },
  { t:'두 겹', d:'바깥에 어두운 굵은 선, 안쪽에 밝은 얇은 선. 실제 두께는 얇은데 <b>깊이</b>가 생긴다.',
    o:{ w:1.1, glow:3, dbl:1 } },
  { t:'위쪽만 밝다', d:'광원이 위에 있다고 보고 <b>위 세 변만</b> 밝게. 나머지는 어둡게 깔린다. 입체로 읽힌다.',
    o:{ w:1.2, glow:3, topLit:1 } },
  { t:'꼭짓점만 밝다', d:'변 중앙으로 갈수록 사라지고 <b>여섯 각만</b> 빛난다. SF 느낌이 가장 강하다. ⚠ 작아지면 점 여섯 개로 보인다.',
    o:{ w:1.2, glow:3, corner:1 } },
  { t:'안쪽 하이라이트', d:'테두리는 얇게 두고 <b>안쪽에 흰 실선</b> 하나. 유리·금속 안쪽 반사처럼 보인다.',
    o:{ w:1.2, glow:3, inLine:1 } },
  { t:'⭐ 추천 — 그라데이션 + 안쪽 선', d:'세로 그라데이션(위 흰빛 → 아래 옅은 색) + 안쪽 흰 실선. <b>1.3px</b> 인데 금속처럼 읽힌다.',
    o:{ w:1.3, glow:3.5, grad:1, inLine:1, id:'B' } },
];
document.getElementById('wrap').innerHTML = CASES.map(function(c, i){
  return '<div class="cell"><p class="cap"><i>' + i + '</i>' + c.t + '</p>' +
    '<p class="sub">' + c.d + '</p><div class="pane">' + scene(c.o) + '</div></div>';
}).join('');
</script></body></html>
