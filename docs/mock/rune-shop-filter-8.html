<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>룬 상점 — 분류(유형·등급) + 펼치는 목록 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ti:'IBM Plex Sans KR',sans-serif; --font-ko:'IBM Plex Sans KR',sans-serif;
  --font-num:'Rajdhani',sans-serif;
  --r-bar:3px; --r-md:6px;
  --gold:#ffd24a; --metal-edge:rgba(150,170,200,.22);
  --txt:#e6ecf4; --txt-dim:#c3ccd8; --txt-mute:#8d97a6; --txt-off:#69737f;
  --low:#8b95a5; --mid:#5cd6ff; --high:#ffcf6b; --uniq:#c98bff;
  --eco:#7effc9; --war:#ffa3b8; --grow:#e6eef8;
}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:var(--txt);font-family:var(--font-ko);font-size:12px}
h1{font-size:15px;margin:20px 22px 4px;font-family:var(--font-ti);font-weight:700}
h1 + p{margin:0 22px 6px;color:var(--txt-mute);font-size:11.5px;line-height:1.7;max-width:1500px}
h1 + p b{color:var(--txt-dim)} h1 + p s{text-decoration:none;color:#ffb0b0}
h2{font-size:13px;margin:16px 22px 8px;color:var(--gold);font-family:var(--font-ti)}
.wrap{display:flex;flex-wrap:wrap;gap:18px;padding:6px 22px 26px;align-items:flex-start}
.cell{width:356px}
.cap{margin:0 0 4px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:var(--txt-mute);font-size:11px;line-height:1.6;min-height:78px}
.sub em{font-style:normal;color:#8fe6b0} .sub s{text-decoration:none;color:#ffb0b0}
.pane{width:356px;padding:9px;border-radius:var(--r-md);border:1px solid var(--metal-edge);
  background:radial-gradient(120% 80% at 50% 0%,#101821,#070a0e 72%)}
/* 분류 줄 */
.flt{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.fdiv{width:1px;height:16px;background:rgba(255,255,255,.14);margin:0 3px}
.f{padding:4px 9px;border-radius:var(--r-bar);font-size:10.5px;font-weight:700;cursor:pointer;
  color:var(--txt-mute);border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3)}
.f.on{color:#0d1116;background:var(--fg,#dfe6ef);border-color:transparent}
.f.gon{color:var(--fg);border-color:color-mix(in srgb,var(--fg) 60%,transparent);
  background:color-mix(in srgb,var(--fg) 16%,transparent)}
.fAll{font-size:10px;color:var(--txt-off);margin-left:auto}
/* 목록 줄 */
.rw{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.rw:last-child{border-bottom:0}
.ico{width:26px;height:26px;flex:0 0 26px;border-radius:50%;
  background:conic-gradient(from 210deg,#2a3644,#4a5c72,#2a3644);border:1px solid rgba(255,255,255,.14)}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm b{font-size:12.5px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm s{text-decoration:none;font-size:10px;color:var(--txt-off);font-family:var(--font-num)}
.grpDot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gc);margin-right:5px;vertical-align:1px}
.pct{font-family:var(--font-num)}
.pct .l{color:var(--low)} .pct .m{color:var(--mid)} .pct .h{color:var(--high)} .pct .u{color:var(--uniq)}
.arw{color:var(--txt-off);font-size:12px;padding:0 2px}
.gem{display:inline-block;width:9px;height:9px;border-radius:2px;transform:rotate(45deg);
  background:linear-gradient(160deg,#8be9ff,#3aa8d8);vertical-align:-1px;margin-right:3px}
/* 오른쪽 버튼 하나 */
.one{min-width:64px;height:28px;padding:0 10px;border-radius:var(--r-bar);display:flex;align-items:center;
  justify-content:center;font-family:var(--font-num);font-size:12.5px;font-weight:700;color:#eaf2fb;
  border:1px solid color-mix(in srgb,var(--rg) 46%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--rg) 16%,transparent),rgba(0,0,0,.3));cursor:pointer}
/* 펼친 구역 */
.exp{padding:2px 2px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.gb{padding:6px 2px 5px;border-radius:var(--r-bar);text-align:center;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--rg) 34%,transparent);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.28))}
.gb b{display:block;font-size:10px;color:var(--rg);font-weight:700}
.gb u{text-decoration:none;display:block;font-size:11px;color:var(--txt-dim);font-family:var(--font-num);margin-top:1px}
.gb i{font-style:normal;display:block;font-size:8.5px;color:var(--txt-off)}
.expH{display:flex;align-items:center;justify-content:space-between;padding:0 3px 5px;font-size:10px;color:var(--txt-off)}
.rw.open{background:rgba(255,255,255,.035);border-bottom:0}
</style></head><body>
<h1>룬 상점 · 일반 구역 — 「분류(유형·등급) + 펼치는 목록」</h1>
<p>규칙 하나로 읽었다: <b>등급이 하나로 정해졌으면 오른쪽에 버튼 하나, 안 정해졌으면 줄을 눌러 아래로 펼친다.</b>
유형(경제·전투·성장)은 <b>평소에 묶여 있고</b> 눌러서 좁힌다. ①~④ 는 그 설계의 <b>네 가지 상태</b>이고, ⑤~⑧ 은 제 보완안이다.
⚠ 지금 상점 탭은 이미 <b>경제·전투·성장 셋</b>이고 유니크는 갈래가 아니라 <b>등급</b>이라, 이 「두 축」 구조와 잘 맞는다.</p>
<h2>①~④ · 말씀하신 설계의 네 상태</h2>
<div class="wrap" id="w1"></div>
<h2>⑤~⑧ · 보완안</h2>
<div class="wrap" id="w2"></div>
<script>
const GR={low:['하급','var(--low)'],mid:['중급','var(--mid)'],high:['상급','var(--high)'],uniq:['유니크','var(--uniq)']};
const GP={eco:['경제','var(--eco)'],war:['전투','var(--war)'],grow:['성장','var(--grow)']};
const RUNES=[
  {n:'적 처치 보상',g:'eco',p:['0.5%','1%','1.5%','5%'],c:[3,9,27,90]},
  {n:'피버 획득량',g:'eco',p:['2.5%','5%','8%','30%'],c:[3,9,27,90]},
  {n:'유즈맵 보상 재화',g:'eco',p:['0.5%','1%','1.5%','5%'],c:[3,9,27,90]},
  {n:'유닛 공격력',g:'war',p:['0.3%','0.6%','1%','3%'],c:[4,12,36,120]},
  {n:'캠프 전체 진행 속도',g:'grow',p:['0.1%','0.2%','0.3%','1%'],c:[5,15,45,150]}];
const gem='<i class="gem"></i>';
function pct(r){const k=['l','m','h','u'];return r.p.map((v,i)=>'<span class="'+k[i]+'">'+v+'</span>').join(' · ');}
function fltHTML(sel,gsel,note){
  let h='<div class="flt">';
  for(const k in GP) h+='<span class="f'+(sel===k?' on':'')+'" style="--fg:'+GP[k][1]+'">'+GP[k][0]+'</span>';
  h+='<span class="fdiv"></span>';
  for(const k in GR) h+='<span class="f'+(gsel===k?' gon':'')+'" style="--fg:'+GR[k][1]+'">'+GR[k][0]+'</span>';
  if(note) h+='<span class="fAll">'+note+'</span>';
  return h+'</div>';
}
function rowList(r,tail){
  return '<div class="rw"><div class="ico"></div><div class="nm">'
    +'<b><i class="grpDot" style="--gc:'+GP[r.g][1]+'"></i>'+r.n+'</b>'
    +'<s class="pct">'+pct(r)+'</s></div>'+tail+'</div>';
}
function expHTML(r){
  let h='<div class="exp">';
  const ks=['low','mid','high','uniq'];
  ks.forEach((k,i)=>{h+='<div class="gb" style="--rg:'+GR[k][1]+'"><b>'+GR[k][0]+'</b><u>'+gem+r.c[i]+'</u><i>'+r.p[i]+'</i></div>';});
  return h+'</div>';
}
function oneBtn(r,gd){const i=['low','mid','high','uniq'].indexOf(gd);
  return '<span class="one" style="--rg:'+GR[gd][1]+'">'+gem+r.c[i]+'</span>';}
function cell(n,cap,sub,body){
  return '<div class="cell"><p class="cap"><i>'+n+'</i>'+cap+'</p><p class="sub">'+sub+'</p>'
    +'<div class="pane">'+body+'</div></div>';
}
const W1=document.getElementById('w1'), W2=document.getElementById('w2');

// ① 기본 — 유형 묶임 · 등급 미지정 → 목록만, 한 줄이 펼쳐져 있다
{ let b=fltHTML(null,null,'전체 5종');
  b+=rowList(RUNES[0],'<span class="arw">⌄</span>');
  b+=expHTML(RUNES[0]);
  b+=RUNES.slice(1,4).map(r=>rowList(r,'<span class="arw">›</span>')).join('');
  W1.innerHTML+=cell('1','기본 — 유형 묶임 · 줄을 눌러 펼친다',
   '평소엔 <b>경제·전투·성장이 한 목록</b>이고 줄은 <b>이름과 등급 값만</b> 갖는다. '
   +'줄을 누르면 <b>그 아래가 열리며</b> 하급~유니크 넷이 나온다. '
   +'<em>목록이 조용해지고 갈래 점으로 유형이 읽힌다.</em> <s>사려면 두 번 눌러야 한다.</s>',b); }

// ② 유니크로 분류 → 펼치지 않고 오른쪽 버튼 하나
{ let b=fltHTML(null,'uniq','유니크만');
  b+=RUNES.map(r=>rowList(r,oneBtn(r,'uniq'))).join('');
  W1.innerHTML+=cell('2','유니크로 분류 — 오른쪽 버튼 하나',
   '등급을 <b>유니크</b>로 좁히면 고를 것이 없으므로 <b>펼치지 않고</b> 바로 산다. '
   +'<em>한 번 눌러 구매 — 가장 빠른 길이다.</em> '
   +'⚠ 값이 제일 비싼 등급이라 <s>실수로 눌리면 아플 수 있다</s>(확인창이 필요할 수 있다).',b); }

// ③ 경제만 → 기본처럼 펼친다
{ let b=fltHTML('eco',null,'경제 3종');
  b+=rowList(RUNES[0],'<span class="arw">›</span>');
  b+=rowList(RUNES[1],'<span class="arw">⌄</span>');
  b+=expHTML(RUNES[1]);
  b+=rowList(RUNES[2],'<span class="arw">›</span>');
  W1.innerHTML+=cell('3','경제만 — 유형만 좁히면 그대로 펼친다',
   '유형만 골랐을 때는 <b>등급이 아직 넷</b>이므로 기본과 같다. 목록이 짧아져 훑기 쉬워진다. '
   +'<em>유형은 「무엇을 살까」, 등급은 「얼마짜리로」 — 축이 갈려 읽힌다.</em>',b); }

// ④ 유형+등급 둘 다 → 각 줄 오른쪽 버튼 하나
{ let b=fltHTML('eco','mid','경제 · 중급');
  b+=RUNES.slice(0,3).map(r=>rowList(r,oneBtn(r,'mid'))).join('');
  W1.innerHTML+=cell('4','유형 + 등급 — 줄마다 버튼 하나',
   '둘 다 고르면 <b>살 것이 한 가지로 정해져</b> 줄마다 버튼 하나만 남는다. '
   +'<em>「경제 · 중급」을 쓸어 담는 화면 — 상점다운 흐름이다.</em> '
   +'<s>지금 무엇으로 좁혀져 있는지 분류 줄을 봐야 안다.</s>',b); }

// ⑤ 보완 — 분류를 한 줄로 접고 「전체」 칩을 둔다
{ let b='<div class="flt">'
   +'<span class="f on" style="--fg:#dfe6ef">전체</span>'
   +'<span class="f" style="--fg:var(--eco)">경제</span>'
   +'<span class="f" style="--fg:var(--war)">전투</span>'
   +'<span class="f" style="--fg:var(--grow)">성장</span>'
   +'<span class="fdiv"></span>'
   +'<span class="f" style="--fg:#dfe6ef">등급 ⌄</span>'
   +'<span class="fAll">5종</span></div>';
  b+=rowList(RUNES[0],'<span class="arw">›</span>')
   +rowList(RUNES[3],'<span class="arw">›</span>')
   +rowList(RUNES[4],'<span class="arw">›</span>');
  W2.innerHTML+=cell('5','분류를 한 줄로 — 등급은 접어 둔다',
   '칩이 일곱이면 상단이 두 줄로 넘친다. <b>「전체」 칩을 앞에 두고 등급은 「등급 ⌄」 하나로 접는다.</b> '
   +'<em>상단이 늘 한 줄이라 목록이 위로 올라온다.</em> <s>등급을 고르려면 한 번 더 눌러야 한다.</s>',b); }

// ⑥ 보완 — 펼친 칸에 보유·장착을 함께
{ let b=fltHTML(null,null,'전체 5종');
  b+=rowList(RUNES[0],'<span class="arw">⌄</span>');
  b+='<div class="expH"><span>등급을 고르세요</span><span>보유 · 장착</span></div>';
  let e='<div class="exp">';
  ['low','mid','high','uniq'].forEach((k,i)=>{
    e+='<div class="gb" style="--rg:'+GR[k][1]+'"><b>'+GR[k][0]+'</b><u>'+gem+RUNES[0].c[i]+'</u>'
      +'<i>'+(i===1?'×2 · 1낌':i===0?'×5':'—')+'</i></div>';});
  b+=e+'</div>';
  b+=RUNES.slice(1,4).map(r=>rowList(r,'<span class="arw">›</span>')).join('');
  W2.innerHTML+=cell('6','펼친 칸에 「보유 · 장착」을 함께',
   '①과 같되 펼친 칸이 <b>값만이 아니라 보유 수와 낀 개수</b>를 말한다. '
   +'<em>두 번 누르는 값을 치르는 만큼 거기서 결정이 끝나야 한다.</em> '
   +'⚠ 장착 수는 지금 상점이 안 보여 주는 값이라 <s>배선이 필요하다</s>.',b); }

// ⑦ 보완 — 열린 줄만 카드로 커진다
{ let b=fltHTML(null,null,'전체 5종');
  b+=rowList(RUNES[1],'<span class="arw">›</span>');
  b+='<div class="rw open"><div class="ico"></div><div class="nm">'
   +'<b><i class="grpDot" style="--gc:var(--eco)"></i>적 처치 보상</b>'
   +'<s class="pct">'+pct(RUNES[0])+'</s></div><span class="arw">⌃</span></div>';
  b+=expHTML(RUNES[0]);
  b+=RUNES.slice(3).map(r=>rowList(r,'<span class="arw">›</span>')).join('');
  W2.innerHTML+=cell('7','열린 줄만 밝아진다 (한 번에 하나)',
   '펼친 줄에 <b>옅은 면</b>을 깔아 「지금 이걸 보는 중」을 표시하고, 다른 줄을 누르면 이 줄은 닫힌다. '
   +'<em>목록이 길어도 지금 자리를 잃지 않는다.</em> '
   +'⛔ 판·테두리를 더하지 않고 <b>면 한 겹</b>만 — 카드로 만들면 상점의 「할인 카드」와 얼굴이 겹친다.',b); }

// ⑧ 보완 — 등급을 하단 고정 바로(엄지 범위)
{ let b='<div class="flt">'
   +'<span class="f on" style="--fg:#dfe6ef">전체</span>'
   +'<span class="f" style="--fg:var(--eco)">경제</span>'
   +'<span class="f" style="--fg:var(--war)">전투</span>'
   +'<span class="f" style="--fg:var(--grow)">성장</span></div>';
  b+=RUNES.slice(0,3).map(r=>rowList(r,oneBtn(r,'mid'))).join('');
  b+='<div style="margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.10)">'
   +'<div class="flt" style="margin:0">'
   +'<span style="font-size:10px;color:var(--txt-off);margin-right:4px">등급</span>'
   +'<span class="f" style="--fg:var(--low)">하급</span>'
   +'<span class="f gon" style="--fg:var(--mid)">중급</span>'
   +'<span class="f" style="--fg:var(--high)">상급</span>'
   +'<span class="f" style="--fg:var(--uniq)">유니크</span>'
   +'<span class="fAll">안 고르면 펼치기</span></div></div>';
  W2.innerHTML+=cell('8','등급은 아래에 — 엄지가 닿는 자리',
   '유형은 위, <b>등급은 목록 아래 고정 줄</b>로 내린다. 세로 화면에서 자주 바꾸는 것은 아래가 편하다(GAME_DIRECTION 「엄지 도달」). '
   +'<em>등급을 바꿔 가며 쓸어 담기 좋다.</em> <s>목록이 짧을 때 아래 줄이 붕 뜬다.</s>',b); }
</script>
</body></html>
