<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>환생 트리 별 — 면과 내부 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'IBM Plex Sans KR',sans-serif;--font-num:'Rajdhani',sans-serif;--gold:#ffd24a}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:22px;justify-content:center;align-items:flex-start}
.cell{width:400px}
.cap{margin:0 0 5px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:#8d97a6;font-size:11px;line-height:1.65;min-height:62px}
.pane{position:relative;width:400px;height:300px;
  background:radial-gradient(120% 120% at 50% 30%,#151a22 0%,#0b0e13 62%,#07090c 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}
.lab{text-anchor:middle;font-size:9px;fill:#6d7683}
.sm{text-anchor:middle;font-size:8px;fill:#5c6674}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const BIG = [
  { x: 76, y:104, r:44, col:'#ffd24a', ic:'mine',   gr:'보통' },
  { x:196, y:104, r:44, col:'#4aa8ff', ic:'endure', gr:'귀함' },
  { x:316, y:104, r:44, col:'#ff3b3b', ic:'bossHp', gr:'극상' },
];
const SMALL = [
  { x:118, y:224, r:15, col:'#ffd24a', ic:'gather', gr:'흔함' },
  { x:162, y:224, r:15, col:'#ffd24a', ic:'gas',    gr:'보통' },
  { x:206, y:224, r:15, col:'#4aa8ff', ic:'atk',    gr:'흔함' },
  { x:250, y:224, r:15, col:'#4aa8ff', ic:'bldg',   gr:'귀함' },
  { x:294, y:224, r:15, col:'#ff3b3b', ic:'foeHp',  gr:'흔함' },
];
const ICO = '../../assets/icons/tree/';
function hexPts(x, y, r){ const q = [];
  for(let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 90);
    q.push((x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1)); }
  return q.join(' '); }
function img(s, o){ const w = s.r * (o.icoBig ? 1.62 : 1.46);
  return '<image href="' + ICO + s.ic + '.webp" x="' + (s.x - w / 2).toFixed(1) + '" y="' +
    (s.y - w / 2).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + w.toFixed(1) + '"/>'; }
function id(o, k){ return o.id + k; }

function defs(o){
  let d = '<defs>';
  BIG.concat(SMALL).forEach(function(s, i){
    d += '<linearGradient id="' + id(o, 'e' + i) + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#fff" stop-opacity=".92"/>' +
      '<stop offset=".42" stop-color="' + s.col + '"/>' +
      '<stop offset="1" stop-color="' + s.col + '" stop-opacity=".34"/></linearGradient>';
    // 면 — 위가 살짝 밝은 남색, 아래로 검정
    d += '<linearGradient id="' + id(o, 'f' + i) + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#1b2634"/><stop offset="1" stop-color="#06090e"/></linearGradient>';
    // 면 — 갈래 색이 가장자리에만 아주 옅게
    d += '<radialGradient id="' + id(o, 'g' + i) + '">' +
      '<stop offset=".45" stop-color="#06090e"/>' +
      '<stop offset="1" stop-color="' + s.col + '" stop-opacity=".22"/></radialGradient>';
  });
  return d + '</defs>';
}
function face(s, i, o){
  if(o.faceGrad) return 'url(#' + id(o, 'f' + i) + ')';
  if(o.faceEdge) return 'url(#' + id(o, 'g' + i) + ')';
  return 'rgba(6,9,14,.94)';
}
function node(s, i, o){
  let out = '';
  // 바깥 링
  out += '<polygon points="' + hexPts(s.x, s.y, s.r + s.r * 0.09) + '" fill="none" stroke="' + s.col +
    '" stroke-width="1" opacity=".45"/>';
  // 홈 — 바깥 테두리 안쪽에 한 겹 더 어두운 육각(파인 느낌)
  if(o.inset) out += '<polygon points="' + hexPts(s.x, s.y, s.r) + '" fill="#000" opacity=".55"/>';
  // 몸통
  out += '<polygon points="' + hexPts(s.x, s.y, o.inset ? s.r - s.r * 0.07 : s.r) + '" fill="' + face(s, i, o) +
    '" stroke="url(#' + id(o, 'e' + i) + ')" stroke-width="1.3" style="filter:drop-shadow(0 0 ' +
    (3 * s.r / 44 + 1).toFixed(1) + 'px ' + s.col + ')"/>';
  // 아이콘 뒤 광
  if(o.backGlow) out += '<circle cx="' + s.x + '" cy="' + s.y + '" r="' + (s.r * 0.62).toFixed(1) +
    '" fill="' + s.col + '" opacity=".13" style="filter:blur(' + (s.r * 0.18).toFixed(1) + 'px)"/>';
  // 위쪽 유리 반사 — 위 절반에만 흰 띠
  if(o.gloss){
    const p = hexPts(s.x, s.y, s.r * 0.93).split(' ');
    out += '<path d="M' + p[4].replace(',', ' ') + 'L' + p[5].replace(',', ' ') + 'L' + p[0].replace(',', ' ') +
      'L' + p[1].replace(',', ' ') + 'L' + (s.x + s.r * 0.5).toFixed(1) + ' ' + (s.y - s.r * 0.12).toFixed(1) +
      'L' + (s.x - s.r * 0.5).toFixed(1) + ' ' + (s.y - s.r * 0.12).toFixed(1) +
      'Z" fill="#ffffff" opacity=".055"/>';
  }
  out += img(s, o);
  // 안쪽 얇은 흰 선
  if(!o.noInLine) out += '<polygon points="' + hexPts(s.x, s.y, s.r - Math.max(1, s.r * 0.073)) +
    '" fill="none" stroke="#fff" stroke-width=".6" opacity=".16"/>';
  // 등급 — 지금은 안쪽 육각 링, 대안은 위 꼭짓점 표식
  if(o.gradeMark){
    if(s.gr === '귀함' || s.gr === '극상')
      out += '<polygon points="' + (s.x) + ',' + (s.y - s.r - s.r * 0.20) + ' ' +
        (s.x - s.r * 0.13) + ',' + (s.y - s.r - s.r * 0.05) + ' ' +
        (s.x + s.r * 0.13) + ',' + (s.y - s.r - s.r * 0.05) + '" fill="#ffcf5a"/>';
  } else {
    if(s.gr === '귀함' || s.gr === '극상')
      out += '<polygon points="' + hexPts(s.x, s.y, s.r - s.r * 0.13) + '" fill="none" stroke="#ffcf5a" stroke-width="1" opacity=".8"/>';
    else if(s.gr === '보통')
      out += '<polygon points="' + hexPts(s.x, s.y, s.r - s.r * 0.13) + '" fill="none" stroke="rgba(220,232,246,.34)" stroke-width=".8"/>';
  }
  return out;
}
function scene(o){
  o = o || {};
  let s = defs(o);
  BIG.forEach(function(b, i){ s += node(b, i, o); });
  SMALL.forEach(function(b, i){ s += node(b, BIG.length + i, o); });
  s += '<text class="lab" x="196" y="176">확대했을 때 — 보통 · 귀함 · 극상</text>';
  s += '<text class="sm" x="206" y="258">실제 크기(24px 부근)</text>';
  return '<svg viewBox="0 0 400 300">' + s + '</svg>';
}
const CASES = [
  { t:'지금 (기준)', d:'면은 <b>거의 검정 단색</b>. 아이콘이 허공에 떠 있는 것 같고, 등급은 안쪽 육각 링으로만 말한다.',
    o:{ id:'a' } },
  { t:'면에 세로 그라데이션', d:'⭐ 위는 <b>살짝 밝은 남색</b>, 아래로 검정. 테두리 그라데이션과 같은 방향이라 <b>한 덩어리로 빚어진</b> 느낌이 난다.',
    o:{ id:'b', faceGrad:1 } },
  { t:'가장자리에 갈래 색', d:'가운데는 검정, <b>가장자리로 갈수록 갈래 색</b>이 아주 옅게 돈다. 색이 면에 스며서 테두리만 색인 것보다 덜 도식적이다.',
    o:{ id:'c', faceEdge:1 } },
  { t:'파인 홈', d:'테두리 안에 어두운 육각을 한 겹 더 깔아 <b>아이콘이 파인 자리에 앉은</b> 것처럼 보이게 한다. 두께감이 확 는다.',
    o:{ id:'d', faceGrad:1, inset:1 } },
  { t:'아이콘 뒤 광', d:'아이콘 뒤에 <b>갈래 색 흐린 빛</b>. 아이콘이 면에서 떠오르고, 작아져도 무슨 색 갈래인지 남는다.',
    o:{ id:'e', faceGrad:1, backGlow:1 } },
  { t:'유리 반사', d:'위 절반에 아주 옅은 <b>흰 띠</b>. 유리·에나멜을 씌운 것처럼 보인다. ⚠ 아이콘이 흐려 보일 수 있다.',
    o:{ id:'f', faceGrad:1, gloss:1 } },
  { t:'등급을 위 꼭짓점으로', d:'안쪽 링을 없애고 귀함·극상만 <b>위 꼭짓점에 금색 쐐기</b>. 안이 비어 아이콘이 가장 크게 보인다.',
    o:{ id:'g', faceGrad:1, gradeMark:1, icoBig:1 } },
  { t:'⭐ 추천 — 그라데이션 + 홈 + 뒤광', d:'면 그라데이션 + 파인 홈 + 아이콘 뒤 광. <b>아이콘이 금속 판에 박힌 보석</b>처럼 읽힌다. 등급 링은 그대로 둔다.',
    o:{ id:'h', faceGrad:1, inset:1, backGlow:1 } },
];
document.getElementById('wrap').innerHTML = CASES.map(function(c, i){
  return '<div class="cell"><p class="cap"><i>' + i + '</i>' + c.t + '</p>' +
    '<p class="sub">' + c.d + '</p><div class="pane">' + scene(c.o) + '</div></div>';
}).join('');
</script></body></html>
