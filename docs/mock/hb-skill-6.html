<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사냥터 스킬 바 6안</title>
<style>
:root{
  --font-ko:'NotoKR','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --font-num:'Rajdhani','IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  --r-bar:3px; --r-md:6px; --r-lg:9px;
  --metal-edge:#3c3e46;
  --metal-ring:linear-gradient(180deg,#585b66 0%,#3c3e46 38%,#2a2c33 72%,#45474f 100%);
  --edge-light:linear-gradient(90deg,rgba(150,158,172,.14) 0%,rgba(160,168,182,.26) 13%,
    rgba(186,194,208,.55) 30%, rgb(232,236,244) 50%,rgba(186,194,208,.55) 70%,
    rgba(160,168,182,.26) 87%,rgba(150,158,172,.14) 100%);
  --txt-mute:#9aa0a8; --rdy:#5dff8f; --warn:#ffd24a; --hot:#ff6b7a;
}
*{box-sizing:border-box}
body{margin:0;padding:22px 16px 60px;background:#08090c;color:#ececec;font-family:var(--font-ko)}
h1{margin:0 0 4px;font-size:19px;letter-spacing:.02em}
.lead{margin:0 0 20px;font-size:12.5px;color:var(--txt-mute);line-height:1.65;max-width:760px}
.lead b{color:#ececec}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:880px}
.cell{min-width:0}
.cap{display:flex;align-items:baseline;gap:6px;margin:0 0 7px;font-size:12.5px;font-weight:700}
.cap i{font-style:normal;font-family:var(--font-num);font-size:11px;color:#fff;background:#2a2c33;
  border:1px solid var(--metal-edge);border-radius:var(--r-bar);padding:1px 5px}
.cap em{font-style:normal;font-size:11px;font-weight:400;color:var(--txt-mute)}
.note{margin:6px 2px 0;font-size:11px;color:var(--txt-mute);line-height:1.6}
/* 전장 — 목업이 '게임 안'으로 읽히게 */
.field{position:relative;height:290px;border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 18%,#3a3350 0%,#241f33 42%,#14121c 100%);
  border:1px solid var(--metal-edge)}
.field::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 45%,rgba(93,255,143,.10),transparent 70%)}
.hero{position:absolute;left:50%;top:44%;width:16px;height:22px;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#7d8ea8,#3d4657);border-radius:2px}
.ring{position:absolute;left:50%;top:44%;width:104px;height:52px;transform:translate(-50%,-50%);
  border:1px solid rgba(93,255,143,.5);border-radius:50%}
.foe{position:absolute;width:9px;height:9px;border-radius:50%;background:#c8a24a;opacity:.85}
.hud{position:absolute;left:8px;top:8px;font-family:var(--font-num);font-size:10px;color:#b9bec6;letter-spacing:.04em}
/* 아이콘 */
.ic{width:100%;height:100%;object-fit:contain;display:block}
/* ══ 공통 툴 ══ */
.dock{position:absolute;right:9px;bottom:10px;display:flex;align-items:center;gap:6px}
.dockC{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center}
</style>

<h1>사냥터 스킬 바 — 6안</h1>
<p class="lead">
  전제: 스킬 <b>3개</b> · <b>평소엔 자동</b>으로 돌고 막힐 때만 직접 누른다 · 오른손 엄지 사정권.<br>
  그래서 여섯 안 모두 ① <b>자동 상태가 한눈에</b> ② <b>지금 쓸 수 있는가</b> ③ <b>얼마나 남았나</b> 세 가지를 항상 말한다.<br>
  <b>A안 3개</b>는 지금 쓰는 물성(검정 면 · 은색 링 · 라운드 3px · 윗변 광선)을 그대로 녹였고,
  <b>B안 3개</b>는 배치·형태를 아예 다르게 잡았다.
</p>
<div class="grid" id="grid"></div>

<style>
/* ══════════ A1 · 원형 유지 + 자동 띠 ══════════ */
.a1 .dock{gap:7px}
.a1s{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(20,20,20,.55);border:1.5px solid #a2a9b5;box-shadow:0 2px 8px -3px #000,inset 0 1px 0 rgba(255,255,255,.08)}
.a1s .ic{padding:7px}
.a1s .cd{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(rgba(6,7,10,.78) var(--p),transparent 0)}
.a1s .sec{position:absolute;font-family:var(--font-num);font-size:14px;font-weight:800;color:#dfe4ea;text-shadow:0 1px 2px #000}
.a1s.rdy{border-color:rgba(93,255,143,.85);box-shadow:0 0 12px -4px var(--rdy),inset 0 1px 0 rgba(255,255,255,.1)}
.a1s.cool .ic{opacity:.34}
.a1auto{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-num);font-size:12px;font-weight:800;color:#fff;
  background:rgba(180,42,42,.42);border:1.5px solid #a2a9b5}
.a1bar{position:absolute;right:9px;bottom:56px;display:flex;align-items:center;gap:5px;
  font-family:var(--font-num);font-size:9.5px;letter-spacing:.08em;color:var(--rdy)}
.a1bar span{width:26px;height:2px;background:var(--rdy);opacity:.55;border-radius:2px}

/* ══════════ A2 · 각진 카드 ══════════ */
.a2s{position:relative;width:46px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(36,45,60,.95),rgba(14,18,26,.96));
  border:1px solid var(--metal-edge);border-radius:var(--r-bar);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.a2s::before{content:'';position:absolute;left:6px;right:1px;top:0;height:1px;background:var(--edge-light);opacity:.7}
.a2s .ic{width:24px;height:24px}
.a2s b{font-family:var(--font-num);font-size:11px;font-weight:800;color:#cfd5dd;letter-spacing:.02em}
.a2s.rdy{border-color:rgba(93,255,143,.5);box-shadow:0 0 10px -6px var(--rdy)}
.a2s.rdy b{color:var(--rdy)}
.a2s.cool .ic{opacity:.3}
.a2s.cool b{color:#7a8089}
.a2s .fill{position:absolute;left:0;right:0;bottom:0;height:var(--h);background:rgba(93,255,143,.13)}
.a2auto{width:26px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:linear-gradient(180deg,rgba(36,45,60,.95),rgba(14,18,26,.96));
  border:1px solid var(--metal-edge);border-radius:var(--r-bar);
  font-family:var(--font-num);font-size:10px;font-weight:800;color:#fff;letter-spacing:.02em}
.a2auto i{font-style:normal;width:8px;height:8px;border-radius:50%;background:var(--rdy);box-shadow:0 0 7px var(--rdy)}

/* ══════════ A3 · 한 판 트레이 ══════════ */
.a3tray{display:flex;align-items:stretch;gap:0;padding:4px;
  background:linear-gradient(180deg,#111318,#07080b) padding-box,var(--metal-ring) border-box;
  border:1px solid transparent;border-radius:var(--r-md)}
.a3auto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:34px;border-right:1px solid rgba(255,255,255,.08);
  font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--rdy)}
.a3auto b{font-size:13px;color:#fff}
.a3s{position:relative;width:42px;height:42px;margin-left:4px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.045);border:1px solid var(--metal-edge);border-radius:var(--r-bar)}
.a3s .ic{width:24px;height:24px}
.a3s .bar{position:absolute;left:2px;right:2px;bottom:2px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.a3s .bar i{display:block;height:100%;width:var(--w);background:var(--rdy)}
.a3s.rdy{border-color:rgba(93,255,143,.55)}
.a3s.rdy .bar i{background:var(--rdy);box-shadow:0 0 6px var(--rdy)}
.a3s.cool .ic{opacity:.32}
.a3s.cool .bar i{background:#5a6472}
.a3s .sec{position:absolute;font-family:var(--font-num);font-size:13px;font-weight:800;color:#e6eaf0}

/* ══════════ B1 · 엄지 호(부채꼴) ══════════ */
.b1wrap{position:absolute;right:6px;bottom:6px;width:176px;height:176px}
.b1core{position:absolute;right:30px;bottom:30px;width:56px;height:56px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 50% 32%,#2b3446,#0d1017);border:2px solid rgba(93,255,143,.65);
  box-shadow:0 0 22px -8px var(--rdy)}
.b1core b{font-family:var(--font-num);font-size:15px;font-weight:800;color:#fff;line-height:1}
.b1core em{font-style:normal;font-size:8.5px;color:var(--rdy);letter-spacing:.1em}
.b1s{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(14,17,24,.9);border:1.5px solid #98a0ad}
.b1s .ic{width:24px;height:24px}
.b1s.rdy{border-color:var(--rdy);box-shadow:0 0 14px -5px var(--rdy)}
.b1s.cool{opacity:.55}
.b1s .sec{position:absolute;font-family:var(--font-num);font-size:13px;font-weight:800;color:#dfe4ea}
.b1arc{position:absolute;right:-18px;bottom:-18px;width:152px;height:152px;border-radius:50%;
  border:1px dashed rgba(255,255,255,.12);border-right-color:transparent;border-bottom-color:transparent}

/* ══════════ B2 · 알약 스택 ══════════ */
.b2wrap{position:absolute;right:9px;bottom:10px;display:flex;flex-direction:column;align-items:stretch;gap:5px;width:132px}
.b2s{position:relative;display:flex;align-items:center;gap:7px;padding:5px 9px 5px 5px;overflow:hidden;
  background:rgba(10,12,17,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px}
.b2s .ico{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center}
.b2s .ico .ic{width:17px;height:17px}
.b2s .nm{flex:1;min-width:0;font-size:11px;font-weight:700;color:#dfe4ea}
.b2s .rt{font-family:var(--font-num);font-size:12px;font-weight:800;color:var(--txt-mute)}
.b2s .fill{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:rgba(255,255,255,.06)}
.b2s.rdy{border-color:rgba(93,255,143,.6);box-shadow:0 0 12px -6px var(--rdy)}
.b2s.rdy .rt{color:var(--rdy)}
.b2s.cool .ico .ic{opacity:.35}
.b2sw{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 5px 4px 10px;
  background:rgba(10,12,17,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px}
.b2sw span{font-size:11px;font-weight:700;color:#dfe4ea}
.b2sw i{position:relative;width:34px;height:18px;border-radius:999px;background:rgba(93,255,143,.28);
  border:1px solid rgba(93,255,143,.55)}
.b2sw i::after{content:'';position:absolute;right:2px;top:1.5px;width:13px;height:13px;border-radius:50%;
  background:var(--rdy);box-shadow:0 0 8px var(--rdy)}

/* ══════════ B3 · 링 다이얼 ══════════ */
.b3wrap{position:absolute;right:14px;bottom:14px;width:112px;height:112px}
.b3seg{position:absolute;inset:0;border-radius:50%}
.b3hub{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#252d3c,#0b0d13);border:1.5px solid rgba(255,255,255,.22)}
.b3hub b{font-family:var(--font-num);font-size:13px;font-weight:800;color:#fff;line-height:1}
.b3hub em{font-style:normal;font-size:7.5px;letter-spacing:.1em;color:var(--rdy)}
.b3i{position:absolute;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(8,10,15,.7)}
.b3i .ic{width:19px;height:19px}
.b3i.cool .ic{opacity:.34}
.b3i .sec{position:absolute;font-family:var(--font-num);font-size:11px;font-weight:800;color:#e6eaf0}
</style>

<script>
const SK=[
  {k:'nova', n:'폭발', ic:'sk_nova'},
  {k:'heal', n:'응급', ic:'sk_emrg'},
  {k:'slow', n:'감속', ic:'sk_slow'},
];
// 상태 표본: 폭발=준비됨(지금 눌러야 할 것) · 응급=쿨 8초 남음 · 감속=쿨 31초 남음
const ST=[{rdy:1,p:0,left:0},{rdy:0,p:.27,left:8},{rdy:0,p:.69,left:31}];
const IC=k=>'../../assets/icons/skills/'+k+'.webp';
const img=k=>'<img class="ic" src="'+IC(k)+'" alt="">';
const foes=()=>[[22,26],[74,20],[80,62],[16,58],[52,72]]
  .map(([x,y])=>'<span class="foe" style="left:'+x+'%;top:'+y+'%"></span>').join('');
const field=(inner,cls)=>'<div class="field '+(cls||'')+'">'
  +'<span class="hud">라운드 12 · 웨이브 2/3</span>'+foes()
  +'<span class="ring"></span><span class="hero"></span>'+inner+'</div>';

const V=[];

/* A1 */ V.push({t:'A1 · 원형 유지 + 자동 띠', tag:'A', d:'지금 형태 그대로. 준비된 스킬만 초록 링이 켜지고, 쿨은 원이 시계방향으로 풀리며 남은 초가 가운데 온다. 자동일 땐 위에 얇은 초록 띠가 켜져 "지금 알아서 돌고 있다"를 말한다.',
  html: field('<div class="a1bar"><span></span>자동 사용 중</div><div class="dock">'
    +'<button class="a1auto">A</button>'
    +SK.map((s,i)=>{const t=ST[i];
      return '<div class="a1s '+(t.rdy?'rdy':'cool')+'">'+img(s.ic)
        +(t.rdy?'':'<span class="cd" style="--p:'+(t.p*360)+'deg"></span><span class="sec">'+t.left+'</span>')+'</div>';}).join('')
    +'</div>','a1')});

/* A2 */ V.push({t:'A2 · 각진 카드', tag:'A', d:'원 대신 모서리를 깎은 판. 라운드 3px·윗변 광선이라 아래 업그레이드 카드와 같은 언어가 된다. 남은 시간은 판이 아래에서 차오르고, 숫자는 항상 크게 읽힌다.',
  html: field('<div class="dock">'
    +'<div class="a2auto"><i></i>자동</div>'
    +SK.map((s,i)=>{const t=ST[i];
      return '<div class="a2s '+(t.rdy?'rdy':'cool')+'">'
        +(t.rdy?'':'<span class="fill" style="--h:'+((1-t.p)*100)+'%"></span>')
        +img(s.ic)+'<b>'+(t.rdy?'READY':t.left)+'</b></div>';}).join('')
    +'</div>','a2')});

/* A3 */ V.push({t:'A3 · 한 판 트레이', tag:'A', d:'셋을 금속 판 하나에 담고 왼쪽 끝을 자동 스위치로 쓴다. 판이 하나라 전장을 덜 가리고, 쿨은 각 칸 아래 얇은 바로만 말해 시선이 조용하다.',
  html: field('<div class="dock"><div class="a3tray">'
    +'<div class="a3auto"><b>A</b>자동</div>'
    +SK.map((s,i)=>{const t=ST[i];
      return '<div class="a3s '+(t.rdy?'rdy':'cool')+'">'
        +(t.rdy?img(s.ic):'<span class="sec">'+t.left+'</span>')
        +'<span class="bar"><i style="--w:'+((1-t.p)*100)+'%"></i></span></div>';}).join('')
    +'</div></div>','a3')});

/* B1 */ V.push({t:'B1 · 엄지 호', tag:'B', d:'엄지가 닿는 반경을 따라 부채꼴로 편다. 가운데 큰 버튼이 자동 토글이자 "막혔을 때 누르는 곳" — 손가락을 옮기지 않고 셋 다 닿는다. 셋을 겹쳐 두지 않아 오조작이 적다.',
  html: field('<div class="b1wrap"><span class="b1arc"></span>'
    +SK.map((s,i)=>{const t=ST[i];
      const ang=[176,214,252][i], r=76, C=118;   /* C = 자동 코어 중심 = 엄지 회전축 */
      const x=C+r*Math.cos(ang*Math.PI/180)-22, y=C+r*Math.sin(ang*Math.PI/180)-22;
      return '<div class="b1s '+(t.rdy?'rdy':'cool')+'" style="left:'+x+'px;top:'+y+'px">'
        +(t.rdy?img(s.ic):'<span class="sec">'+t.left+'</span>')+'</div>';}).join('')
    +'<div class="b1core"><b>AUTO</b><em>ON</em></div></div>','b1')});

/* B2 */ V.push({t:'B2 · 알약 스택', tag:'B', d:'이름을 같이 읽히게 한 세로 목록. 무엇이 왜 안 눌리는지가 글자로 보여서 "막혔을 때"에 강하다. 맨 위는 실물 스위치 모양의 자동 토글.',
  html: field('<div class="b2wrap">'
    +'<div class="b2sw"><span>자동 사용</span><i></i></div>'
    +SK.map((s,i)=>{const t=ST[i];
      return '<div class="b2s '+(t.rdy?'rdy':'cool')+'">'
        +(t.rdy?'':'<span class="fill" style="--w:'+((1-t.p)*100)+'%"></span>')
        +'<span class="ico">'+img(s.ic)+'</span><span class="nm">'+s.n+'</span>'
        +'<span class="rt">'+(t.rdy?'준비':t.left+'s')+'</span></div>';}).join('')
    +'</div>','b2')});

/* B3 */ V.push({t:'B3 · 링 다이얼', tag:'B', d:'하나의 원을 셋으로 나눈 다이얼. 조각이 곧 스킬이고, 쿨은 그 조각만 어둡게 잠긴다. 가운데가 자동. 차지 면적이 가장 작아 전장을 거의 안 가린다.',
  html: (function(){
    const seg=ST.map((t,i)=>{ const a0=i*120-90, a1=a0+118;
      const col=t.rdy? 'rgba(93,255,143,.30)' : 'rgba(120,128,140,.16)';
      return col+' '+a0+'deg '+a1+'deg, transparent '+a1+'deg '+(a0+120)+'deg'; }).join(', ');
    return field('<div class="b3wrap">'
      +'<div class="b3seg" style="background:conic-gradient(from 0deg,'+seg+');border:1px solid rgba(255,255,255,.14)"></div>'
      +SK.map((s,i)=>{const t=ST[i]; const ang=(i*120-90+59)*Math.PI/180, r=38;
        const x=56+r*Math.cos(ang)-15, y=56+r*Math.sin(ang)-15;
        return '<div class="b3i '+(t.rdy?'':'cool')+'" style="left:'+x+'px;top:'+y+'px">'
          +(t.rdy?img(s.ic):'<span class="sec">'+t.left+'</span>')+'</div>';}).join('')
      +'<div class="b3hub"><b>A</b><em>AUTO</em></div></div>','b3'); })()});

document.getElementById('grid').innerHTML=V.map((v,i)=>
  '<div class="cell"><div class="cap"><i>'+v.tag+(i%3+1)+'</i>'+v.t.replace(/^\S+ · /,'')+'</div>'
  +v.html+'<div class="note">'+v.d+'</div></div>').join('');
</script>
