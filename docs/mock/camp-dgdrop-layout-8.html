<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>던전 선택 — 구조를 바꾼 8안 + 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ⚠ 앞의 두 벌(redo-8 · harmony-8)은 **같은 구조**(왼쪽 목록 · 오른쪽 굴림 · 아래 버튼)에 껍데기만
     바꾼 것이었다. 이번엔 **구조 자체**를 여덟 갈래로 벌린다 — 어디에 열리나(칩 아래 / 전폭 / 시트 안),
     던전을 어떻게 고르나(목록 / 타일 / 숫자판 / 타임라인), 라운드를 어떻게 고르나(굴림 / 막대 / ◀▶ / 아코디언).
     재질은 전부 하단 구역에서 온 것 하나만 쓴다: 검정 면 · 흰 7% 테두리 · Rajdhani · 붉은색은 「지금 여기」에만.
     버튼은 공용 .actBtn(옅은 흰 면 + 1px), ◀▶ 는 공용 .arwBtn(글리프만). ⛔ 청록 없음 · 발광 없음. */
:root{
  --font-ko:'IBM Plex Sans KR',sans-serif; --font-num:'Rajdhani',sans-serif;
  --cost:#ff7676; --ink:#e6eefc; --dim:#8a94a6; --mute:#5f6874;
  --edge:rgba(255,255,255,.07); --edge2:rgba(255,255,255,.12);
  --face:linear-gradient(#0a0a0a,#000);
}
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:406px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:#ffd24a;margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 10px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:62px}
.sub b{color:#c3ccd8;font-weight:700}

/* 무대 */
.phone{width:390px;height:440px;position:relative;overflow:hidden;background:#8f8672;font-size:11px;color:#d6e2f0}
.map{position:absolute;inset:0;background:
    radial-gradient(120% 60% at 30% 0%,rgba(0,0,0,.20),transparent 55%),
    repeating-linear-gradient(0deg,#948b76 0 68px,#8a8168 68px 70px),
    repeating-linear-gradient(90deg,#948b76 0 68px,#8a8168 68px 70px)}
.bar{position:absolute;left:0;top:0;right:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:5;
  background:linear-gradient(180deg,rgba(0,0,0,.32),transparent)}
.chip{display:flex;align-items:baseline;font-size:11.5px;font-weight:800;color:#e6eefc}
.chip i{font-style:normal;color:rgba(214,226,240,.35);margin:0 4px}
.chip b{font-family:var(--font-num);font-size:13px}
.chip .dim{font-family:var(--font-num);font-size:11px;color:rgba(214,226,240,.5)}
.res{margin-left:auto;font-family:var(--font-num);font-weight:700;color:#cfd8e6;font-size:11px}
/* 실제 하단 시트(고정 기준) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:9px 8px 12px;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%,0 7px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent) top/100% 1px no-repeat,
    linear-gradient(180deg,rgba(20,20,22,.55),rgba(10,10,11,.86) 55%,rgba(6,6,7,.94)),
    linear-gradient(180deg,rgba(26,28,32,.38),rgba(16,18,21,.26));
  box-shadow:0 -8px 24px rgba(0,0,0,.55)}
.kick{font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:2.16px;color:#e8edf5;padding:0 2px 7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat span{font-size:9px;letter-spacing:.06em;color:var(--dim)}
.stat b{font-family:var(--font-num);font-size:13px;color:var(--ink);font-weight:700}

/* 공통 부품 */
.pane{background:var(--face);border:1px solid var(--edge);border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.sl{font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:2.16px;color:#e8edf5}
.num{font-family:var(--font-num);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;height:30px;cursor:pointer;
  font-family:var(--font-ko);font-size:12px;font-weight:800;color:#fff;
  border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(255,255,255,.14)}
.arw{width:26px;height:26px;display:grid;place-items:center;color:#c3ccd8;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.arw svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row{position:relative;display:flex;align-items:baseline;gap:7px;padding:5.5px 3px 5.5px 8px;font-size:11.5px;font-weight:700;color:#b9c4d2}
.row .ix{font-family:var(--font-num);font-size:11px;color:var(--mute);min-width:11px;text-align:right}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mul{font-family:var(--font-num);font-size:10.5px;color:var(--mute)}
.row.here{color:#fff}.row.here .ix{color:var(--cost)}
.row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.row.lock{color:#4d545e}

/* ① 전폭 띠 — 칩 아래가 아니라 재화 바 아래 화면 끝까지. 던전은 가로 칩, 라운드는 아래 막대 */
.v1{position:absolute;left:0;right:0;top:34px;z-index:4;padding:9px 10px 10px;border-radius:0;border-left:0;border-right:0}
.v1 .hs{display:flex;gap:5px;overflow:hidden;margin:6px 0 10px}
.v1 .hc{flex:none;padding:5px 9px;border:1px solid var(--edge);border-radius:2px;background:rgba(255,255,255,.02);
  font-weight:700;color:#b9c4d2;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.v1 .hc .num{font-size:10px;color:var(--mute)}
.v1 .hc.here{color:#fff;border-color:rgba(255,118,118,.4);background:rgba(255,59,59,.06)}
.v1 .hc.here .num{color:var(--cost)}
.v1 .hc.lock{color:#4d545e}
.v1 .rb{display:flex;align-items:center;gap:8px}
.v1 .track{flex:1;height:2px;background:rgba(255,255,255,.09);position:relative}
.v1 .track i{position:absolute;left:0;top:0;height:100%;width:60%;background:var(--cost)}
.v1 .track b{position:absolute;left:60%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #000}
.v1 .rb .num{font-size:14px;color:#fff;min-width:44px;text-align:right}
.v1 .rb .num em{font-style:normal;color:var(--mute);font-size:11px}
.v1 .go{width:64px;height:28px;font-size:11px}

/* ② 아코디언 — 던전 줄을 고르면 그 줄이 펼쳐져 라운드가 안에 나온다 */
.v2{position:absolute;left:30px;top:44px;width:250px;z-index:4;padding:8px 0 9px}
.v2 .row{padding-left:9px}
.v2 .open{margin:2px 9px 4px;padding:8px 9px;border:1px solid var(--edge);border-radius:2px;background:rgba(255,255,255,.02)}
.v2 .open .rl{display:flex;align-items:center;gap:6px}
.v2 .open .rl .num{font-size:20px;color:var(--cost);flex:1;text-align:center}
.v2 .open .rl .num em{font-style:normal;color:var(--mute);font-size:11px;margin-left:2px}
.v2 .open .go{margin-top:8px;height:26px;font-size:11px}

/* ③ 타일 격자 — 커맨드 카드 4열 그리드 그대로, 던전 10 + 캠프 = 11칸 */
.v3{position:absolute;left:30px;top:44px;width:300px;z-index:4;padding:9px}
.v3 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 8px}
.v3 .tile{aspect-ratio:1.15;border:1px solid var(--edge);border-radius:3px;background:var(--face);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.v3 .tile .num{font-size:15px;color:#c3ccd8}
.v3 .tile .nm{font-size:8.5px;color:var(--dim);letter-spacing:-.2px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3 .tile .mul{position:absolute;top:3px;right:4px;font-family:var(--font-num);font-size:8px;color:var(--mute)}
.v3 .tile.here{border-color:rgba(255,118,118,.45)}.v3 .tile.here .num{color:var(--cost)}.v3 .tile.here .nm{color:#fff}
.v3 .tile.lock{opacity:.35}
.v3 .rl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid var(--edge)}
.v3 .rl .num{font-size:16px;color:#fff}.v3 .rl .num em{font-style:normal;color:var(--mute);font-size:11px}
.v3 .go{width:64px;height:26px;font-size:11px}

/* ④ 타임라인 — 던전이 세로 선 위의 점, 라운드는 오른쳌 굴림(구조 유지) */
.v4{position:absolute;left:30px;top:44px;width:250px;z-index:4;padding:8px 9px 9px;display:flex;gap:10px}
.v4 .tl{flex:1;position:relative;padding-left:14px}
.v4 .tl::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--edge2)}
.v4 .pt{position:relative;display:flex;align-items:baseline;gap:6px;padding:4.5px 0;font-weight:700;color:#b9c4d2}
.v4 .pt::before{content:'';position:absolute;left:-12.5px;top:9px;width:5px;height:5px;border-radius:50%;background:#3a4048;border:1px solid var(--edge2)}
.v4 .pt.done::before{background:#8a94a6}
.v4 .pt.here{color:#fff}.v4 .pt.here::before{background:var(--cost);border-color:var(--cost);box-shadow:0 0 0 2px #000}
.v4 .pt .mul{margin-left:auto;font-family:var(--font-num);font-size:10px;color:var(--mute)}
.v4 .pt.lock{color:#4d545e}
.v4 .rc{width:70px;flex:none;border-left:1px solid var(--edge);padding-left:9px;display:flex;flex-direction:column;align-items:center;gap:2px}
.v4 .rc .num{color:var(--mute);font-size:12px}.v4 .rc .num.on{color:var(--cost);font-size:18px}
.v4 .rc .go{width:100%;height:24px;font-size:10.5px;margin-top:auto}

/* ⑤ 라운드를 막대로 — 칩 밑선의 확대판. 던전 목록 + 아래 가로 막대에서 라운드를 고른다 */
.v5{position:absolute;left:30px;top:44px;width:250px;z-index:4;padding:8px 0 9px}
.v5 .rb{margin:8px 9px 0;padding-top:8px;border-top:1px solid var(--edge)}
.v5 .rb .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.v5 .rb .top .num{font-size:18px;color:#fff}.v5 .rb .top .num em{font-style:normal;color:var(--mute);font-size:11px}
.v5 .track{height:14px;position:relative;display:flex;align-items:center}
.v5 .track::before{content:'';position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.09)}
.v5 .track i{position:absolute;left:0;width:60%;height:2px;background:var(--cost)}
.v5 .track b{position:absolute;left:60%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #000}
.v5 .ticks{display:flex;justify-content:space-between;margin-top:3px;font-family:var(--font-num);font-size:8.5px;color:var(--mute)}
.v5 .go{margin:9px 9px 0;height:28px}

/* ⑥ 판 없음 · 글자만 — 칩과 같은 어법. 던전 이름 목록, 라운드는 큰 숫자 + ◀▶ */
.v6{position:absolute;left:30px;top:44px;width:220px;z-index:4;padding:6px 0;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35));border:0;border-radius:3px;box-shadow:none;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.95))}
.v6 .row{padding:4px 8px}
.v6 .row.here::before{display:none}
.v6 .row.here .nm{color:#fff}
.v6 .rl{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.v6 .rl .num{font-size:22px;color:#fff;min-width:56px;text-align:center}
.v6 .rl .num em{font-style:normal;color:var(--mute);font-size:12px}
.v6 .go{margin:8px 8px 2px;height:26px;font-size:11px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}

/* ⑦ 숫자판 — 던전 0~10 정사각 칸 · 라운드는 10 단위 칸 + ◀▶ 미세 */
.v7{position:absolute;left:30px;top:44px;width:250px;z-index:4;padding:9px}
.v7 .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 8px}
.v7 .k{aspect-ratio:1;border:1px solid var(--edge);border-radius:2px;background:var(--face);display:grid;place-items:center;
  font-family:var(--font-num);font-size:13px;font-weight:700;color:#c3ccd8;position:relative}
.v7 .k.here{color:var(--cost);border-color:rgba(255,118,118,.45)}
.v7 .k.lock{color:#3a4048}
.v7 .k.home{font-size:9px;font-family:var(--font-ko)}
.v7 .rk{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 8px}
.v7 .rk .k{aspect-ratio:auto;height:22px;font-size:11px}
.v7 .fine{display:flex;align-items:center;justify-content:center;gap:2px}
.v7 .fine .num{font-size:16px;color:#fff;min-width:40px;text-align:center}
.v7 .go{margin-top:8px;height:26px;font-size:11px}

/* ⑧ 시트 대체 — 드롭다운이 아니라 **하단 시트 내용이 던전 선택으로 바뀐다**. 맵은 그대로, 트레이 [뒤로]로 돌아온다 */
.v8 .sheet{padding-top:9px}
.v8 .sheet .head{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px}
.v8 .sheet .head .gly{width:22px;height:22px;border-radius:3px;background:rgba(255,255,255,.19);display:grid;place-items:center;color:#f0f4f9}
.v8 .sheet .head .gly svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.v8 .body{display:flex;gap:8px}
.v8 .info{flex:1;border:1px solid var(--edge);border-radius:3px;background:var(--face);padding:8px 9px;display:flex;flex-direction:column;gap:3px}
.v8 .info .nm{font-size:12px;font-weight:800;color:#fff}
.v8 .info .d{font-size:9.5px;color:var(--dim)}
.v8 .info .rl{display:flex;align-items:center;gap:4px;margin-top:auto}
.v8 .info .rl .num{font-size:18px;color:var(--cost);flex:1;text-align:center}
.v8 .info .rl .num em{font-style:normal;color:var(--mute);font-size:11px}
.v8 .grid{display:grid;grid-template-columns:repeat(4,56px);gap:4px}
.v8 .tile{height:58px;border:1px solid var(--edge);border-radius:3px;background:var(--face);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.v8 .tile .num{font-size:14px;color:#c3ccd8}.v8 .tile .nm{font-size:8px;color:var(--dim)}
.v8 .tile.here{border-color:rgba(255,118,118,.45)}.v8 .tile.here .num{color:var(--cost)}.v8 .tile.here .nm{color:#fff}
.v8 .tile.lock{opacity:.35}
.v8 .goRow{margin-top:8px}.v8 .goRow .go{height:30px}
/* ★ 추천 — 여덟 안에서 맞는 요소만 뽑아 합친 것.
     자리    : 칩 아래(②④⑤⑥⑦) — 전폭(①)은 맵을 너무 가리고, 시트 대체(⑧)는 MY BASE 가 사라진다.
     껍데기  : harmony-8 ②·④ — .cgSlot 과 같은 검정 면 + 흰 7% 테두리 + 윗변 헤어라인, 왼쪽 위 모서리는
               칩에 물려 각지게(0 3px 3px 3px). 발광 없음.
     라벨    : MY BASE 와 **같은 서명**(Rajdhani 9px · 자간 2.16 · #e8edf5) + 아래 헤어라인(harmony ④).
     던전    : 번호+이름+배수 **목록**(②⑤⑥) — 타일·숫자판은 이름이 안 읽히고, 타임라인 점은 번호와 겹친다.
               「지금 여기」= 왼콝 붉은 2px + 흰 글자(칩의 밑선과 같은 색). 지나온 던전은 번호를 옅게, 잠긴 건 더 옅게(④의 뜻만).
     라운드  : **큰 숫자 + 공용 ◀▶ 글리프**(⑥) 아래에 **칩과 같은 붉은 진행 밑선**(⑤의 뜻) — 끌어서 고르는 막대는
               모바일에서 정확히 안 잡히고, 굴림 피커는 무겁다. 눌러서 정확히, 밑선으로 위치를 읽는다.
     버튼    : 공용 .actBtn.pri(옅은 흰 면 .14 + 1px .32) — 지금 드롭다운의 제 버튼을 버린다.
     ⛔ 청록 없음 · 발광 없음 · 붉은색은 「지금 여기」와 진행선에만. */
.vR{position:absolute;left:30px;top:44px;width:256px;z-index:4;padding:0;border-radius:0 3px 3px 3px;position:absolute}
.vR::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.vR .sec{padding:8px 9px 0}
.vR .sl{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:5px;border-bottom:1px solid var(--edge);margin-bottom:3px}
.vR .sl em{font-style:normal;font-family:var(--font-num);font-size:9px;letter-spacing:.06em;color:var(--mute);font-weight:700}
.vR .list{max-height:150px;overflow:hidden}
.vR .row{padding:5px 3px 5px 9px}
.vR .row.done .ix{color:#4d545e}
.vR .row.home{border-bottom:1px solid var(--edge);padding-bottom:6px;margin-bottom:2px}
.vR .rnd{margin-top:8px;padding:8px 9px 0;border-top:1px solid var(--edge)}
.vR .rnd .sl{border-bottom:0;margin-bottom:0;padding-bottom:2px}
.vR .rl{display:flex;align-items:center;gap:2px;padding:2px 0 6px}
.vR .rl .num{flex:1;text-align:center;font-size:24px;line-height:1;color:#fff}
.vR .rl .num em{font-style:normal;color:var(--mute);font-size:12px;margin-left:3px}
.vR .rl .arw{width:32px;height:28px}
.vR .prog{height:2px;background:rgba(255,255,255,.09);position:relative;margin:0 2px}
.vR .prog i{position:absolute;left:0;top:0;height:100%;width:60%;background:var(--cost)}
.vR .foot{padding:9px 9px 9px}
.vR .foot .go{height:32px}
.star .cap i{color:#ff7676}
.star .cap::after{content:'추천';margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.1em;color:#ff7676;border:1px solid rgba(255,118,118,.4);border-radius:2px;padding:1px 5px;vertical-align:1px}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const L='<svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>', R='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const DG=[['0','캠프','안전'],['1','감염된 둥지','×1.0'],['2','버려진 전초기지','×3.0'],['3','잊혀진 회랑','×10.0'],
  ['4','산란장','×30.0'],['5','폐쇄된 시설','×100'],['6','심연의 관문','—'],['7','—','—'],['8','—','—'],['9','—','—'],['10','—','—']];
const HERE=3, OPEN=5;
const st=(i)=> i===HERE?' here':(i>OPEN?' lock':'');
const rows=(n)=>DG.slice(0,n).map(([i,nm,m])=>'<div class="row'+st(+i)+'"><i class="ix">'+i+'</i><span class="nm">'+nm+'</span><span class="mul">'+(+i>OPEN?'잠김':m)+'</span></div>').join('');
const CHIP='<div class="bar"><div class="chip">잊혀진 회랑<i>·</i><b>30</b><span class="dim">/50</span></div><div class="res">1.6M&nbsp;&nbsp;755&nbsp;&nbsp;0&nbsp;&nbsp;0/10</div></div>';
const STATS=[['터치 획득','16'],['자동 수급','측정 중'],['일꾼','0기'],['인구','0 / 10'],['던전 배수','×10.0'],['채취 배수','×15.8'],['터치 강화','Lv.0'],['채취 강화','Lv.0']];
const SHEET='<div class="sheet"><div class="kick">MY BASE</div><div class="stats">'+STATS.map(([n,v])=>'<div class="stat"><span>'+n+'</span><b>'+v+'</b></div>').join('')+'</div></div>';
const ARW=(d)=>'<span class="arw">'+(d==='l'?L:R)+'</span>';

const V={
 1:'<div class="pane v1"><div class="sl">DUNGEON</div><div class="hs">'
   +DG.slice(0,7).map(([i,nm,m])=>'<span class="hc'+st(+i)+'"><span class="num">'+i+'</span>'+nm+'</span>').join('')
   +'</div><div class="sl">ROUND</div><div class="rb" style="margin-top:6px"><span class="track"><i></i><b></b></span><span class="num">30<em>/50</em></span><span class="go">이동</span></div></div>',
 2:'<div class="pane v2">'+rows(3)
   +'<div class="row here"><i class="ix">3</i><span class="nm">잊혀진 회랑</span><span class="mul">×10.0</span></div>'
   +'<div class="open"><div class="sl">ROUND</div><div class="rl" style="margin-top:4px">'+ARW('l')+'<span class="num">30<em>/50</em></span>'+ARW('r')+'</div><div class="go">이동</div></div>'
   +DG.slice(4,6).map(([i,nm,m])=>'<div class="row'+st(+i)+'"><i class="ix">'+i+'</i><span class="nm">'+nm+'</span><span class="mul">'+m+'</span></div>').join('')+'</div>',
 3:'<div class="pane v3"><div class="sl">DUNGEON</div><div class="grid">'
   +DG.slice(0,8).map(([i,nm,m])=>'<div class="tile'+st(+i)+'"><span class="mul">'+(+i>OPEN?'':m)+'</span><span class="num">'+i+'</span><span class="nm">'+nm+'</span></div>').join('')
   +'</div><div class="rl"><span class="sl">ROUND</span>'+ARW('l')+'<span class="num">30<em>/50</em></span>'+ARW('r')+'<span class="go">이동</span></div></div>',
 4:'<div class="pane v4"><div class="tl">'
   +DG.slice(0,7).map(([i,nm,m])=>'<div class="pt'+(+i<HERE?' done':'')+st(+i)+'"><span class="nm">'+nm+'</span><span class="mul">'+(+i>OPEN?'잠김':m)+'</span></div>').join('')
   +'</div><div class="rc"><span class="sl">ROUND</span><span class="num">31</span><span class="num on">30</span><span class="num">29</span><span class="go">이동</span></div></div>',
 5:'<div class="pane v5">'+rows(5)
   +'<div class="rb"><div class="top"><span class="sl">ROUND</span><span class="num">30<em>/50</em></span></div>'
   +'<div class="track"><i></i><b></b></div><div class="ticks"><span>1</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div></div>'
   +'<div class="go">이동</div></div>',
 6:'<div class="pane v6">'+rows(6)
   +'<div class="rl">'+ARW('l')+'<span class="num">30<em>/50</em></span>'+ARW('r')+'</div><div class="go">이동</div></div>',
 7:'<div class="pane v7"><div class="sl">DUNGEON</div><div class="keys">'
   +DG.map(([i])=>'<div class="k'+(+i===0?' home':'')+st(+i)+'">'+(+i===0?'캠프':i)+'</div>').join('')
   +'</div><div class="sl">ROUND</div><div class="rk">'+[10,20,30,40,50].map(r=>'<div class="k'+(r===30?' here':'')+'">'+r+'</div>').join('')
   +'</div><div class="fine">'+ARW('l')+'<span class="num">30</span>'+ARW('r')+'</div><div class="go">이동</div></div>',
 8:'',
};
const SHEET8='<div class="sheet"><div class="head"><span class="kick" style="padding:0">DUNGEON · 3 잊혀진 회랑</span><span class="gly">'+L+'</span></div>'
  +'<div class="body"><div class="info"><span class="nm">잊혀진 회랑</span><span class="d">던전 배수 ×10.0 · 적 16</span>'
  +'<div class="rl">'+ARW('l')+'<span class="num">30<em>/50</em></span>'+ARW('r')+'</div></div>'
  +'<div class="grid">'+DG.slice(0,8).map(([i,nm])=>'<div class="tile'+st(+i)+'"><span class="num">'+i+'</span><span class="nm">'+nm+'</span></div>').join('')+'</div></div>'
  +'<div class="goRow"><div class="go">이동</div></div></div>';

const ANS=[
 ['전폭 띠','칩 아래 작은 판이 아니라 <b>재화 바 아래 화면 폭 전체</b>로 열린다(시트처럼 화면 끝에 붙는다). 던전은 가로 칩, 라운드는 아래 막대 하나. 목록을 굴리지 않아도 한눈에 보인다.'],
 ['아코디언','던전 줄을 고르면 <b>그 줄이 펼쳐져 라운드가 안에</b> 나온다. 두 칸을 오갈 필요가 없고, 어느 던전의 라운드인지 모호하지 않다.'],
 ['타일 격자','던전 11칸을 <b>커맨드 카드 4열 그리드</b> 그대로 — 시트 안 카드와 정확히 같은 칸. 라운드는 아래 한 줄(◀▶). 판이 넓어지지만(300px) 목록 스크롤이 사라진다.'],
 ['타임라인','던전이 <b>세로 선 위의 점</b>이다 — 지나온 곳·지금·잠김이 한 선에서 읽힌다. 라운드 굴림은 오른쪽에 그대로.'],
 ['라운드를 막대로','칩의 진행 밑선을 <b>그대로 키운 막대</b>에서 라운드를 고른다(끌기·탭). 굴림 피커 대신 위치로 읽히고 위아래 칩과 어휘가 이어진다.'],
 ['판 없음 · 글자만','칩과 같은 어법 — 판을 거의 걷고 <b>어두운 그늘 위에 글자만</b>. 라운드는 큰 숫자 하나에 공용 ◀▶ 글리프(.arwBtn). 가장 가볍고 맵을 가장 안 가린다.'],
 ['숫자판','던전을 <b>0~10 정사각 칸</b>으로(잠긴 칸은 어둡게), 라운드는 10 단위 칸 + ◀▶ 미세. 이름 없이 숫자로만 — 빠르고 좁다.'],
 ['시트 대체','드롭다운을 없애고 <b>하단 시트 내용이 던전 선택으로 바뀐다</b>. 맵은 그대로 보이고 트레이 [뒤로] 글리프로 돌아온다 — 새 판을 만들지 않고 이미 있는 시트 하나를 쓴다.'],
];
const VR='<div class="pane vR">'
  +'<div class="sec"><div class="sl">DUNGEON<em>0 – 10</em></div><div class="list">'
  +DG.slice(0,7).map(([i,nm,m])=>'<div class="row'+(+i===0?' home':'')+(+i<HERE?' done':'')+st(+i)+'"><i class="ix">'+i+'</i><span class="nm">'+nm+'</span><span class="mul">'+(+i>OPEN?'잠김':m)+'</span></div>').join('')
  +'</div></div>'
  +'<div class="rnd"><div class="sl">ROUND<em>1 – 50</em></div>'
  +'<div class="rl">'+ARW('l')+'<span class="num">30<em>/50</em></span>'+ARW('r')+'</div>'
  +'<div class="prog"><i></i></div></div>'
  +'<div class="foot"><div class="go">이동</div></div></div>';
const REC=['추천 — 뽑아 합친 것',
  '자리는 <b>칩 아래</b>(전폭은 맵을 가리고, 시트 대체는 MY BASE 가 사라진다). 껍데기는 <b>.cgSlot 과 같은 검정 면 + 흰 7% 테두리 + 윗변 헤어라인</b>, 라벨은 <b>MY BASE 와 같은 서명</b>. 던전은 <b>번호·이름·배수 목록</b>(타일·숫자판은 이름이 안 읽힌다) — 지나온 곳은 번호를 옅게. 라운드는 <b>큰 숫자 + 공용 ◀▶</b>(눌러서 정확히) 아래 <b>칩과 같은 붉은 진행 밑선</b>(위치를 읽는다). 버튼은 공용 <b>.actBtn.pri</b>. 청록·발광 없음, 붉은색은 「지금 여기」와 진행선에만.'];
document.getElementById('wrap').innerHTML=
 '<div class="cell star"><p class="cap"><i>★</i>'+REC[0]+'</p><p class="sub">'+REC[1]+'</p>'
 +'<div class="phone"><div class="map"></div>'+CHIP+VR+SHEET+'</div></div>'
 +ANS.map(([t,d],i)=>
 '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'
 +'<div class="phone'+(i===7?' v8':'')+'"><div class="map"></div>'+CHIP+(i===7?SHEET8:(V[i+1]+SHEET))+'</div></div>').join('');
</script></body></html>
