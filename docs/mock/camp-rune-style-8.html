<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>룬 판 — 생김새 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'IBM Plex Sans KR',sans-serif;--font-num:'Rajdhani',sans-serif;
  --low:#8b95a5;--mid:#5cd6ff;--high:#ffcf6b;--uniq:#c98bff;--gold:#ffd24a;--sel:#5cd6ff}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:390px}
.cap{margin:0 0 6px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:52px}
.pane{position:relative;width:390px;height:560px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 6%,#161b23 0%,#0d1015 60%,#07090c 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}
.hd{position:absolute;left:14px;top:10px;z-index:3;font-size:11px;color:#69737f;letter-spacing:.04em}
.hd b{font-family:var(--font-num);font-size:13px;color:var(--gold)}
/* 공통 — 트리(#campTree)의 어휘를 그대로 가져온다 */
.gem{fill:rgba(6,9,14,.94)}
.in{fill:none;stroke:rgba(220,232,246,.34);stroke-width:.8}
.in.gold{stroke:#ffcf5a;stroke-width:1}
.halo{fill:none;stroke:#ffcf5a;stroke-width:1;stroke-dasharray:2 4}
.sp{stroke-width:.7;fill:none}
.sel{fill:none;stroke:var(--sel);stroke-width:1.1;opacity:.85}
.tag{text-anchor:middle;dominant-baseline:hanging;font-family:var(--font-num);
  font-variant-numeric:tabular-nums;font-size:7.8px;fill:#7b8593}
.nm{text-anchor:middle;font-size:8px;fill:#c3ccd8}
.cnm{text-anchor:middle;dominant-baseline:middle;font-size:10px;letter-spacing:3px;font-weight:800}
.lk{fill:rgba(120,140,165,.02);stroke:rgba(140,160,185,.10);stroke-width:1}
.lkT{fill:#4a535e;font-family:var(--font-num);font-size:7.5px;text-anchor:middle}
.ln{stroke:rgba(200,220,240,.20);stroke-width:.9;stroke-dasharray:2 3;fill:none}
.ln.on{stroke-width:2;stroke-dasharray:none;opacity:.62}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
/* ── 데이터 ─────────────────────────────────────────────────────────── */
const GD = { low:{tx:'하급',c:'#8b95a5'}, mid:{tx:'중급',c:'#5cd6ff'},
             high:{tx:'상급',c:'#ffcf6b'}, uniq:{tx:'유니크',c:'#c98bff'} };
const VAL = { low:'+1%', mid:'+2.5%', high:'+5%', uniq:'+5%' };
const CONS = 8, NSLOT = 24, USLOT = 3;
const SLOT_R = [0,15,30,45,60,75,90,105, 140,155,170,185,200,215,230,245,
                280,295,310,325,340,355,370,385];
const USLOT_R = [120,260,400];
const OPEN_N = 14, OPEN_U = 1;
const EQ = { 0:['손끝','high'], 1:['정제','mid'], 3:['증원','mid'], 5:['힘','high'],
             6:['수호','low'], 9:['연타','mid'], 11:['치유','low'] };
const EQU = { 0:['가속','uniq'] };
const SEL = 4;                       // 지금 고른 칸(일반 5번)

/* 판 — 실제 좌표(js/22-camp-rune.js)와 같은 배치, 세로만 조금 줄였다 */
const W=390, H=560, CT=[[195,118],[91,336],[299,470]], RING=72, RN=21, RU=34;
const nPos = i => { const c=CT[Math.floor(i/CONS)], a=-Math.PI/2 + (i%CONS)/CONS*Math.PI*2;
  return [c[0]+Math.cos(a)*RING, c[1]+Math.sin(a)*RING]; };
const uPos = i => CT[i];
const hex = (x,y,r,rot) => { const p=[];
  for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90+(rot||0));
    p.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1)); }
  return p.join(' '); };
const spark = (x,y,r,c,o) => '<path d="M'+(x-r)+' '+y+' L'+(x+r)+' '+y+' M'+x+' '+(y-r)+' L'+x+' '+(y+r)+
  '" class="sp" stroke="'+c+'" opacity="'+o.toFixed(2)+'"/>';
const st = i => ({ open:i<OPEN_N, eq:EQ[i]||null, at:SLOT_R[i], sel:i===SEL });
const ust = i => ({ open:i<OPEN_U, eq:EQU[i]||null, at:USLOT_R[i], uq:true });

/* ── 안 ①~⑧ — 「칸 하나를 어떻게 그리나」가 축이다 ─────────────────── */

/* ① 트리 문법 이식 — 육각은 그대로, **빛**을 트리에서 가져온다 */
function cell1(x,y,r,s){
  const g=[], c=s.eq?GD[s.eq[1]].c:'#8b95a5';
  if(!s.open) return '<polygon class="lk" points="'+hex(x,y,r)+'"/>'
    +'<text class="lkT" x="'+x+'" y="'+(y+2.5)+'">R'+s.at+'</text>';
  if(s.sel){ g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*2.2)+'" fill="rgba(92,214,255,.07)"/>');
    g.push(spark(x,y,r*2.0,'#5cd6ff',.5)); }
  if(s.eq){ g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.45)+'" fill="'+c+'" opacity=".11"/>');
    g.push(spark(x,y,r*1.75,c,.34)); }
  g.push('<polygon class="gem" points="'+hex(x,y,r)+'" stroke="'+(s.eq?c:'rgba(200,220,240,.30)')+
    '" stroke-width="'+(s.eq?1.7:1.1)+'"/>');
  if(s.eq&&(s.eq[1]==='high'||s.eq[1]==='uniq'))
    g.push('<polygon class="in gold" points="'+hex(x,y,r-3)+'"/>');
  else if(s.eq) g.push('<polygon class="in" points="'+hex(x,y,r-3)+'"/>');
  if(s.eq){ g.push('<text class="nm" x="'+x+'" y="'+(y+3)+'" fill="'+(s.uq?c:'#c3ccd8')+'">'+s.eq[0]+'</text>');
    g.push('<text class="tag" x="'+x+'" y="'+(y+r+3)+'" fill="'+c+'">'+VAL[s.eq[1]]+'</text>'); }
  else g.push('<text class="tag" x="'+x+'" y="'+(y-4)+'" style="font-size:12px;fill:rgba(180,205,235,.34)">+</text>');
  if(s.sel) g.push('<polygon class="sel" points="'+hex(x,y,r+4)+'"/>');
  return g.join(''); }

/* ② 원으로 통일 — 트리와 **완전히 같은 별**. 유니크만 육각으로 남긴다 */
function cell2(x,y,r,s){
  const g=[], c=s.eq?GD[s.eq[1]].c:'#8b95a5';
  const shape=(rr,cls,extra)=> s.uq ? '<polygon class="'+cls+'" points="'+hex(x,y,rr)+'" '+(extra||'')+'/>'
    : '<circle class="'+cls+'" cx="'+x+'" cy="'+y+'" r="'+rr+'" '+(extra||'')+'/>';
  if(!s.open) return shape(r,'lk')+'<text class="lkT" x="'+x+'" y="'+(y+2.5)+'">R'+s.at+'</text>';
  if(s.sel){ g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*2.2)+'" fill="rgba(92,214,255,.07)"/>');
    g.push(spark(x,y,r*2.0,'#5cd6ff',.5)); }
  if(s.eq){ g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.45)+'" fill="'+c+'" opacity=".11"/>');
    g.push(spark(x,y,r*1.75,c,.34)); }
  g.push(shape(r,'gem','stroke="'+(s.eq?c:'rgba(200,220,240,.30)')+'" stroke-width="'+(s.eq?1.7:1.1)+'"'));
  if(s.eq&&(s.eq[1]==='high'||s.eq[1]==='uniq')) g.push(shape(r-3,'in gold'));
  else if(s.eq) g.push(shape(r-3,'in'));
  if(s.eq){ g.push('<text class="nm" x="'+x+'" y="'+(y+3)+'">'+s.eq[0]+'</text>');
    g.push('<text class="tag" x="'+x+'" y="'+(y+r+3)+'" fill="'+c+'">'+VAL[s.eq[1]]+'</text>'); }
  else g.push('<text class="tag" x="'+x+'" y="'+(y-4)+'" style="font-size:12px;fill:rgba(180,205,235,.34)">+</text>');
  if(s.sel) g.push('<circle class="sel" cx="'+x+'" cy="'+y+'" r="'+(r+4)+'"/>');
  return g.join(''); }

/* ③⑧ 은 칸 그림을 ① 과 같이 쓰고 **판**을 다르게 그린다 */
const cellA = cell1;

/* ── 판 그리기 ──────────────────────────────────────────────────────── */
function board(cell, opt){
  const O=opt||{}, rows=[];
  // 배경 장치
  if(O.orbit) CT.forEach((c,k)=>rows.push('<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+RING+
    '" fill="none" stroke="rgba(180,205,240,'+(k<1?.16:.07)+')" stroke-width="1" stroke-dasharray="1 5"/>'));
  if(O.nebula) CT.forEach((c,k)=>rows.push('<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(RING*1.7)+
    '" fill="'+(O.consCol?O.consCol[k]:'#7f9dd0')+'" opacity="'+(k<1?.055:.028)+'"/>'));
  // 선
  for(let i=0;i<NSLOT;i++){
    const ci=Math.floor(i/CONS), c=CT[ci], q=nPos(i), on=i<OPEN_N;
    const col=(O.consCol?O.consCol[ci]:'#9fb6d8');
    if(O.chain){                       // 이웃끼리 잇는다(진짜 별자리)
      const nx=nPos(ci*CONS+((i%CONS)+1)%CONS);
      rows.push('<line class="ln'+(on?' on':'')+'" x1="'+q[0].toFixed(1)+'" y1="'+q[1].toFixed(1)+
        '" x2="'+nx[0].toFixed(1)+'" y2="'+nx[1].toFixed(1)+'" stroke="'+(on?col:'')+'"/>'); }
    else if(!O.noSpoke)
      rows.push('<line class="ln'+(on?' on':'')+'" x1="'+c[0]+'" y1="'+c[1]+
        '" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+(on?col:'')+'"/>'); }
  // 칸
  for(let i=0;i<NSLOT;i++){ const q=nPos(i); rows.push(cell(q[0],q[1],RN,st(i))); }
  for(let i=0;i<USLOT;i++){ const q=uPos(i);
    rows.push((O.uniq||cell)(q[0],q[1],RU,ust(i))); }
  // 성좌 이름
  if(O.consNm) CT.forEach((c,k)=>rows.push('<text class="cnm" x="'+c[0]+'" y="'+(c[1]-RING-22)+
    '" fill="'+(O.consCol?O.consCol[k]:'#6d7b8f')+'" opacity="'+(k<1?.55:.3)+'">성좌 '+'ⅠⅡⅢ'[k]+'</text>'));
  return rows.join(''); }

/* 유니크 전용 그림 — ④ 각진 보석(트리 가운데 마름모의 어휘) */
function uniqGem(x,y,r,s){
  const g=[], c='#c98bff';
  const dia=rr=>[[0,-rr],[rr*.72,0],[0,rr],[-rr*.72,0]].map(p=>(x+p[0]).toFixed(1)+','+(y+p[1]).toFixed(1)).join(' ');
  if(!s.open) return '<polygon class="lk" points="'+dia(r)+'"/>'
    +'<text class="lkT" x="'+x+'" y="'+(y+2.5)+'">R'+s.at+'</text>';
  g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.9)+'" fill="'+c+'" opacity=".07"/>');
  g.push(spark(x,y,r*2.1,c,.42));
  g.push('<polygon points="'+dia(r*1.34)+'" fill="none" stroke="'+c+'" stroke-opacity=".34" stroke-width="1"/>');
  g.push('<polygon points="'+dia(r)+'" fill="rgba(6,9,14,.94)" stroke="'+c+'" stroke-width="1.7"/>');
  if(s.eq){ g.push('<text class="nm" x="'+x+'" y="'+(y+2)+'" fill="'+c+'" style="font-size:9.5px;font-weight:700">'+s.eq[0]+'</text>');
    g.push('<text class="tag" x="'+x+'" y="'+(y+r+4)+'" fill="'+c+'">'+VAL.uniq+'</text>'); }
  return g.join(''); }

/* ⑦ 미니멀 — 테두리를 지우고 빛만 남긴다 */
function cellGlow(x,y,r,s){
  const g=[], c=s.eq?GD[s.eq[1]].c:'#8b95a5';
  if(!s.open) return '<circle cx="'+x+'" cy="'+y+'" r="2" fill="rgba(150,175,210,.22)"/>';
  if(s.eq){ g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.5)+'" fill="'+c+'" opacity=".13"/>');
    g.push(spark(x,y,r*1.9,c,.42));
    g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*.42)+'" fill="'+c+'"/>');
    g.push('<text class="nm" x="'+x+'" y="'+(y+r+2)+'" fill="#c3ccd8">'+s.eq[0]+'</text>');
    g.push('<text class="tag" x="'+x+'" y="'+(y+r+7)+'" fill="'+c+'">'+VAL[s.eq[1]]+'</text>'); }
  else { g.push('<circle cx="'+x+'" cy="'+y+'" r="'+(r*.9)+'" fill="none" stroke="rgba(200,220,240,.22)" stroke-width="1"/>'); }
  if(s.sel){ g.push(spark(x,y,r*2.0,'#5cd6ff',.55));
    g.push('<circle class="sel" cx="'+x+'" cy="'+y+'" r="'+(r+4)+'"/>'); }
  return g.join(''); }

/* ⑧ 각진 금속 — 모서리를 깎은 판 + 회로 선 */
function cellPlate(x,y,r,s){
  const g=[], c=s.eq?GD[s.eq[1]].c:'#8b95a5', k=r*.34;
  const plate=rr=>{ const a=rr*.92;
    return [[-a+k,-a],[a-k,-a],[a,-a+k],[a,a-k],[a-k,a],[-a+k,a],[-a,a-k],[-a,-a+k]]
      .map(p=>(x+p[0]).toFixed(1)+','+(y+p[1]).toFixed(1)).join(' '); };
  if(!s.open) return '<polygon class="lk" points="'+plate(r)+'"/>'
    +'<text class="lkT" x="'+x+'" y="'+(y+2.5)+'">R'+s.at+'</text>';
  if(s.eq) g.push('<polygon points="'+plate(r*1.3)+'" fill="'+c+'" opacity=".07"/>');
  g.push('<polygon points="'+plate(r)+'" fill="rgba(8,11,16,.95)" stroke="'+
    (s.eq?c:'rgba(200,220,240,.26)')+'" stroke-width="'+(s.eq?1.6:1)+'"/>');
  if(s.eq){ g.push('<line x1="'+(x-r*.55)+'" y1="'+(y-r*.55)+'" x2="'+(x+r*.55)+'" y2="'+(y-r*.55)+
      '" stroke="'+c+'" stroke-opacity=".38" stroke-width="1"/>');
    g.push('<text class="nm" x="'+x+'" y="'+(y+3)+'">'+s.eq[0]+'</text>');
    g.push('<text class="tag" x="'+x+'" y="'+(y+r+3)+'" fill="'+c+'">'+VAL[s.eq[1]]+'</text>'); }
  else g.push('<text class="tag" x="'+x+'" y="'+(y-4)+'" style="font-size:12px;fill:rgba(180,205,235,.30)">+</text>');
  if(s.sel) g.push('<polygon class="sel" points="'+plate(r+4)+'"/>');
  return g.join(''); }

const CONS_COL = ['#ffcf6b','#5cd6ff','#c98bff'];
const ANS = [
  ['트리의 빛을 육각에', '육각은 그대로 두고 <b>트리의 어휘</b>만 가져왔다 — 낀 칸은 후광 + 십자 반짝임, 등급은 안쪽 겹, 값은 칸 <b>밖 아래</b>. 지금 판에서 가장 적게 바꾸는 안.', ()=>board(cell1,{})],
  ['원으로 통일', '칸을 트리와 <b>완전히 같은 원</b>으로. 유니크만 육각으로 남겨 격을 가른다. 두 화면이 한 벌로 읽히지만 룬의 「끼우는 자리」 느낌은 옅어진다.', ()=>board(cell2,{uniq:cell2})],
  ['궤도', '성좌마다 <b>얇은 점선 궤도</b>가 돌고 칸이 그 위에 놓인다. 부챗살을 지워 판이 조용해지고, 「이 고리를 다 채우면 가운데가 열린다」가 선명해진다.', ()=>board(cell1,{orbit:true,noSpoke:true})],
  ['중심 보석', '유니크를 트리 가운데처럼 <b>각진 보석</b>으로. 육각 무리 속에서 형태가 달라 유니크가 즉시 읽힌다.', ()=>board(cell1,{uniq:uniqGem})],
  ['별자리 선', '중심에서 뻗는 살 대신 <b>이웃끼리 잇는다</b> — 진짜 별자리처럼 고리가 그려진다. 열린 칸까지만 선이 이어져 진행도가 그림이 된다.', ()=>board(cell1,{chain:true})],
  ['성좌마다 색', '세 성좌에 <b>각기 다른 색</b>(트리의 갈래색 문법). 지금 어느 성좌를 보는지 색으로 안다. 다만 등급색과 색이 둘 다 돌아 판이 알록달록해질 위험.', ()=>board(cell1,{consCol:CONS_COL,consNm:true,nebula:true})],
  ['빛만', '테두리를 지우고 <b>빛과 이름만</b> 남겼다. 잠긴 칸은 작은 점. 가장 조용하고 밤하늘에 가깝지만, 빈 칸이 어디인지 약하게 보인다.', ()=>board(cellGlow,{uniq:uniqGem,noSpoke:true,orbit:true})],
  ['각진 금속판', '모서리를 깎은 <b>금속 슬롯</b> + 회로 선. DESIGN 의 각진 SF 와 가장 가깝고 「끼우는 자리」가 분명하다. 대신 별자리 느낌은 가장 옅다.', ()=>board(cellPlate,{uniq:cellPlate})],
];
document.getElementById('wrap').innerHTML = ANS.map(([t,d,fn],i)=>
  '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'+
  '<div class="pane"><div class="hd">최대 도달 라운드 <b>230</b> / 500</div>'+
  '<svg viewBox="0 0 '+W+' '+H+'">'+fn()+'</svg></div></div>').join('');
</script></body></html>
