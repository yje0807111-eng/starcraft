<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 L1 변주 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Rajdhani:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ko:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;
  --font-num:'Rajdhani','IBM Plex Sans KR',sans-serif;
  --font-ti:'Jua','Apple SD Gothic Neo',sans-serif;
  --r-bar:3px; --r-md:6px; --r-lg:9px;
  --metal-edge:#3c3e46;
  --neon:#ff3b3b; --neon-d2:#380e0e; --neon-glow:rgba(255,59,59,.45);
  --ac:rgb(255,59,59); --acRGB:255,59,59;
  --fs-xs:9.5px; --fs-sm:10px; --fs-md:11px; --fs-lg:12px;
  --art:url('../../assets/backgrounds/title/boot.webp');
  --txt-mute:#9aa0a8;
}
*{box-sizing:border-box}
button{margin:0;padding:0;font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
body{margin:0;padding:22px 16px 60px;background:#08090c;color:#ececec;font-family:var(--font-ko)}
h1{margin:0 0 4px;font-size:19px}
.lead{margin:0 0 20px;font-size:12.5px;color:var(--txt-mute);line-height:1.65;max-width:900px}
.lead b{color:#ececec}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1320px}
.cell{min-width:0}
.cap{display:flex;align-items:baseline;gap:6px;margin:0 0 7px;font-size:12.5px;font-weight:700}
.cap i{font-style:normal;font-family:var(--font-num);font-size:11px;color:#fff;background:#2a2c33;
  border:1px solid var(--metal-edge);border-radius:var(--r-bar);padding:1px 5px}
.cap.now i{background:#1b1d22;color:#8a9099}
.note{margin:7px 2px 0;font-size:11px;color:var(--txt-mute);line-height:1.62}
.note b{color:#cfd5dd;font-weight:700}
/* ── 폰 틀 ── */
.ph{position:relative;width:290px;height:600px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--metal-edge);background:#04050b;display:flex;flex-direction:column}
.art{position:absolute;inset:0;background:var(--art) center center / cover no-repeat #05070c}
/* 딤 = 로딩 화면 것 그대로(아래만 덮는다) */
.dim{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(4,6,11,.06) 0%,rgba(4,6,11,.10) 40%,rgba(5,6,10,.62) 74%,rgba(5,6,10,.96) 100%)}
.gear{position:absolute;right:12px;top:12px;z-index:3;width:26px;height:26px;opacity:.7}
.gear svg{width:100%;height:100%;fill:#cfd5dd;filter:drop-shadow(0 1px 4px #000)}
.wrap{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
/* ── 로딩 화면에서 그대로 가져온 조각들 ── */
.opLogo{width:44px;height:44px;margin:0 auto;color:#dbe4ef}
.opLogo svg{width:100%;height:100%;filter:drop-shadow(0 2px 8px #000)}
.opTitle{font-family:var(--font-ti);font-weight:400;font-size:31px;letter-spacing:.02em;color:#fff;white-space:nowrap;
  text-align:center;text-shadow:0 3px 20px #000,0 1px 3px #000;line-height:1.1}
.opSub{font-family:var(--font-num);font-size:var(--fs-sm);color:#96a1af;letter-spacing:.42em;white-space:nowrap;
  text-align:center;text-shadow:0 1px 4px #000}
.opMid{display:flex;flex-direction:column;align-items:center;gap:11px;padding:0 22px 18px}
.opDock{padding:0 20px 26px}
.opCnt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.opCnt i{font-style:normal;font-size:var(--fs-md);letter-spacing:.2em;color:#8a929c}
.opBarWrap{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.opBar{height:100%;width:78%;border-radius:var(--r-bar);
  background:linear-gradient(90deg,var(--neon-d2),var(--neon));box-shadow:0 0 10px var(--neon-glow)}
/* ── 공통: 번호도 주 표시도 없다. 셋은 같은 무게다 ── */
.hub{display:flex;flex-direction:column}
.way{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:48px;padding:0 2px;
  font-size:var(--fs-lg);font-weight:700;color:#dfe7f0}
.ar{margin-left:auto;font-style:normal;font-family:var(--font-num);font-size:14px;color:#5c6068}
.way.lock{color:#7b838e}
.tag{margin-left:auto;font-style:normal;font-size:var(--fs-xs);font-weight:700;color:#6f7a88;
  padding:2px 6px;border:1px solid rgba(255,255,255,.1);border-radius:var(--r-bar)}
.guest{display:block;width:100%;margin-top:13px;text-align:center;font-size:var(--fs-md);color:#8b97a6}
.guest u{color:#dfe7f0;text-underline-offset:3px}
.gl{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:#8b97a6}
.gl svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* M1 · 헤어라인 행 — 지금 뼈대에서 번호와 광선만 뺀 것 */
.m1 .hub{border-top:1px solid rgba(255,255,255,.08)}
.m1 .way{border-bottom:1px solid rgba(255,255,255,.08)}
/* M2 · 번호 자리에 아이콘 */
.m2 .hub{border-top:1px solid rgba(255,255,255,.08)}
.m2 .way{border-bottom:1px solid rgba(255,255,255,.08)}
/* M3 · 가운데 정렬 · 화살표 없음 */
.m3 .hub{border-top:1px solid rgba(255,255,255,.08)}
.m3 .way{justify-content:center;border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:.02em}
.m3 .tag{margin-left:8px}
/* M4 · 선을 빼고 여백으로만 나눈다 */
.m4 .hub{gap:2px}
.m4 .way{min-height:44px;justify-content:center}
.m4 .tag{margin-left:8px}
/* M5 · 고스트 버튼 — 셋이 완전히 같은 상자 */
.m5 .hub{gap:7px}
.m5 .way{justify-content:center;min-height:44px;border:1px solid rgba(255,255,255,.13);border-radius:var(--r-bar);
  background:rgba(6,8,13,.42)}
.m5 .way.lock{border-color:rgba(255,255,255,.07);background:rgba(6,8,13,.28)}
.m5 .tag{margin-left:8px}
/* M6 · 이름 왼쪽 · 오른쪽에 꼬리표 */
.m6 .hub{border-top:1px solid rgba(255,255,255,.08)}
.m6 .way{border-bottom:1px solid rgba(255,255,255,.08)}
.m6 .rt{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-md);font-weight:600;
  letter-spacing:.08em;color:#6f7a88}
/* M7 · 2+1 — 쓸 수 있는 둘은 나란히, 준비 중인 것만 아래 */
.m7 .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.m7 .two .way{justify-content:center;min-height:46px;border:1px solid rgba(255,255,255,.13);
  border-radius:var(--r-bar);background:rgba(6,8,13,.42)}
.m7 .one{margin-top:7px}
.m7 .one .way{justify-content:center;min-height:40px;color:#7b838e}
/* M8 · 행 사이를 짧은 가운데 선으로 */
.m8 .way{justify-content:center;min-height:46px}
.m8 .way+.way::before{content:'';position:absolute;left:50%;top:0;width:56px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.m8 .tag{margin-left:8px}
</style>

<h1>로그인 — L1 변주 8안 (번호·기본 표시 없음)</h1>
<p class="lead">L1(로딩 로고 블록 + 하단 도크)로 확정. 거기서 <b>인덱스 번호 01/02/03</b>과 <b>주 방식 붉은 광선</b>을 뺐다 —
셋은 같은 무게다. 그러면 행 왼쪽이 비므로, <b>그 빈자리를 무엇으로 채우느냐</b>가 여덟 안의 차이다.
로고 블록·딤·도크 여백은 여덟 안 모두 로딩 화면 것 그대로다.</p>
<div class="grid" id="grid"></div>

<script>
const HEX='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">'
 +'<path d="M32 5 55 18.5v27L32 59 9 45.5v-27z"/><path d="M32 19 43 25.5v13L32 45 21 38.5v-13z" opacity=".55"/>'
 +'<path d="M32 25.5v13M26 29v6M38 29v6" stroke-width="1.2" opacity=".8"/></svg>';
const GEAR='<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.49.49 0 00.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg>';
const ICO={
  id:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>',
  mail:'<svg viewBox="0 0 24 24"><rect x="3.2" y="5.6" width="17.6" height="12.8" rx="1.6"/><path d="m3.8 6.8 8.2 6 8.2-6"/></svg>',
  g:'<svg viewBox="0 0 24 24"><path d="M20.5 12.2c0-.7-.06-1.2-.18-1.8H12v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.6-3.9 2.6-6.5z"/><path d="M12 21c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H3.9v2.3A9 9 0 0 0 12 21z"/><path d="M6.9 13.7a5.4 5.4 0 0 1 0-3.4V8H3.9a9 9 0 0 0 0 8l3-2.3z"/><path d="M12 6.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6A9 9 0 0 0 3.9 8l3 2.3C7.6 8.2 9.6 6.6 12 6.6z"/></svg>'
};
const LOGO='<div class="opMid"><div class="opLogo">'+HEX+'</div>'
 +'<div class="opTitle">STAR WAR</div><div class="opSub">BATTLE ARENA</div></div>';
const GUEST='<button class="guest">계정 없이 <u>게스트로 시작</u></button>';
function phone(cls, dock){
  return '<div class="ph '+cls+'"><div class="art"></div><div class="dim"></div>'
    +'<span class="gear">'+GEAR+'</span><div class="wrap">'+LOGO
    +'<div class="opDock">'+dock+'</div></div></div>';
}
const rows=(fn)=>'<div class="hub">'+[['아이디로 로그인',0],['이메일로 로그인',0],['Google로 로그인',1]]
  .map((r,i)=>fn(r[0],r[1],i)).join('')+'</div>';
const V=[
 {tag:'M1', t:'헤어라인 행 — 번호만 뺀 것',
  d:'지금 뼈대에서 <b>번호와 붉은 광선만 지웠다</b>. 셋이 같은 글자 · 같은 높이 · 같은 선. 바꾸는 양이 제일 적고, 왼쪽이 비어 글자가 화면 끝에서 시작한다.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+(l?'<i class="tag">준비 중</i>':'<i class="ar">›</i>')+'</button>')+GUEST},
 {tag:'M2', t:'번호 자리에 아이콘',
  d:'빈 왼쪽을 <b>라인 아이콘</b>으로 채웠다(사람 · 메일 · G). 정렬 기준이 생겨 목록이 단단해지고, 글자를 안 읽어도 무엇인지 보인다. 아이콘 셋의 무게를 맞추는 게 관건.',
  dock:rows((n,l,i)=>'<button class="way'+(l?' lock':'')+'"><span class="gl">'+[ICO.id,ICO.mail,ICO.g][i]+'</span>'+n
    +(l?'<i class="tag">준비 중</i>':'<i class="ar">›</i>')+'</button>')+GUEST},
 {tag:'M3', t:'가운데 정렬 · 화살표 없음',
  d:'글자를 <b>가운데로</b> 모으고 화살표도 뺐다. 로고가 가운데라 축이 하나로 맞는다 — 포스터에 가깝다. 대신 "누르는 것"이라는 신호가 약해진다.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+(l?'<i class="tag">준비 중</i>':'')+'</button>')+GUEST},
 {tag:'M4', t:'선을 빼고 여백으로만',
  d:'헤어라인을 전부 지우고 <b>간격만으로</b> 나눈다. 여덟 중 그림을 제일 안 가리고 제일 조용하다. 대신 목록이라는 인상이 약해 세 줄이 흩어져 보일 수 있다.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+(l?'<i class="tag">준비 중</i>':'')+'</button>')+GUEST},
 {tag:'M5', t:'고스트 버튼 — 완전히 같은 상자 셋',
  d:'각 방식을 <b>1px 중립 테두리 상자</b>로. "셋이 동등하다"를 형태로 못 박는 안 — 크기·면·선이 전부 같다. 누를 것이라는 신호도 제일 강하다. 대신 도크가 무거워진다.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+(l?'<i class="tag">준비 중</i>':'')+'</button>')+GUEST},
 {tag:'M6', t:'오른쪽에 꼬리표',
  d:'화살표 대신 <b>오른쪽에 상태 글자</b>를 둔다(LOGIN / LOGIN / SOON). 왼쪽은 이름, 오른쪽은 상태 — 한 줄이 두 정보를 갖는다. 로딩의 「LOADING ─ 89%」 줄과 같은 문법이다.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+'<span class="rt">'+(l?'SOON':'LOGIN')+'</span></button>')+GUEST},
 {tag:'M7', t:'2 + 1 — 쓸 수 있는 둘은 나란히',
  d:'지금 <b>쓸 수 있는 둘을 가로로 나란히</b> 두고, 준비 중인 Google만 아래 한 줄로 내렸다. 동등함은 지키면서 "지금 되는 것"이 먼저 보인다. 도크 높이도 줄어든다.',
  dock:'<div class="two">'
    +'<button class="way">아이디</button><button class="way">이메일</button></div>'
    +'<div class="one"><button class="way lock">Google로 로그인<i class="tag">준비 중</i></button></div>'+GUEST},
 {tag:'M8', t:'짧은 가운데 선으로 나눈다',
  d:'전폭 헤어라인 대신 <b>행 사이에 짧은 가운데 선</b>을 둔다. 로고·제목과 같은 중앙 축을 쓰고, 선이 짧아 그림을 가로지르지 않는다. M3과 M4의 중간.',
  dock:rows((n,l)=>'<button class="way'+(l?' lock':'')+'">'+n+(l?'<i class="tag">준비 중</i>':'')+'</button>')+GUEST},
];
document.getElementById('grid').innerHTML=V.map((v,i)=>
  '<div class="cell"><div class="cap"><i>'+v.tag+'</i>'+v.t+'</div>'
  +phone('m'+(i+1), v.dock)+'<div class="note">'+v.d+'</div></div>').join('');
</script>
