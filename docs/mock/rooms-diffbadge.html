<!-- 방 찾기 난이도 배지 8안 (2026-08-25)
     목표: 앞 글자만 따서 **상자 안에** 두고 **폭을 고정** → 난이도가 뭐든 제목 줄이 딱 맞는다.
     ⚠ 마크업은 살아 있는 화면에서 그대로 떠온 것이고, 각 안은 .riDiff 의 **글자와 클래스만** 바꾼다.
     ⚠ EASY/NORMAL/HARD/HELL/FINAL — H 가 둘이다. 첫 글자 안은 색이 그 둘을 가른다(주황/빨강). -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>방 찾기 난이도 배지 8안</title>
<link rel="stylesheet" href="../../css/00-base.css">
<link rel="stylesheet" href="../../css/20-lobby.css">
<link rel="stylesheet" href="../../css/30-home.css">
<link rel="stylesheet" href="../../css/40-social.css">
<style>
  html,body{display:block;height:auto;overflow:visible;background:#08090b}
  body{font-family:var(--font-ko);color:var(--txt);padding:18px;width:1660px}
  h2{font-family:var(--font-ti);font-size:18px;color:#fff;margin:14px 0 2px}
  h2 small{font-family:var(--font-ko);font-size:11px;color:var(--txt-mute);margin-left:8px}
  .sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 26px}
  .p{background:#0d0e11;border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:10px}
  .tag{font-family:var(--font-ti);font-size:13px;color:#fff}
  .note{font-size:10px;line-height:1.55;color:var(--txt-mute);min-height:44px;margin:3px 0 8px}
  .ph{position:relative;width:100%;aspect-ratio:390/620;border-radius:9px;overflow:hidden;background:#04050b}
  .ph #rooms{position:absolute;inset:0}

  /* ══ 공통 — 폭 고정 상자. 이 값 하나가 「제목 줄이 맞는다」의 전부다 ══ */
  .ph .riDiff{display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;box-sizing:border-box;flex:none;
    font-family:var(--font-num);font-size:10.5px;font-weight:800;letter-spacing:0;
    border-radius:var(--r-bar);align-self:center}
  .ph .b2{width:26px}          /* 두 글자 */
  .ph .riName{align-items:center}

  /* B1 테두리 상자 */
  .v1 .riDiff{border:1px solid color-mix(in srgb,var(--dc) 52%,transparent);color:color-mix(in srgb,var(--dc) 78%,#8d949d)}
  /* B2 채운 상자 */
  .v2 .riDiff{background:color-mix(in srgb,var(--dc) 72%,#0a0b0d);color:#0b0c0f}
  /* B3 은은한 면 */
  .v3 .riDiff{background:color-mix(in srgb,var(--dc) 14%,transparent);color:color-mix(in srgb,var(--dc) 80%,#8d949d)}
  /* B4 두 글자 · 은은한 면 */
  .v4 .riDiff{background:color-mix(in srgb,var(--dc) 14%,transparent);color:color-mix(in srgb,var(--dc) 80%,#8d949d)}
  /* B5 숫자 · 테두리 */
  .v5 .riDiff{border:1px solid color-mix(in srgb,var(--dc) 52%,transparent);color:color-mix(in srgb,var(--dc) 78%,#8d949d)}
  /* B6 숫자 · 채운 상자 */
  .v6 .riDiff{background:color-mix(in srgb,var(--dc) 72%,#0a0b0d);color:#0b0c0f}
  /* B7 로마숫자 · 은은한 면 */
  .v7 .riDiff{background:color-mix(in srgb,var(--dc) 14%,transparent);color:color-mix(in srgb,var(--dc) 80%,#8d949d)}
  /* B8 각진 코너컷 — DESIGN 의 각진 SF. 라운드 대신 모서리를 자른다 */
  .v8 .riDiff{border-radius:0;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px));
    background:color-mix(in srgb,var(--dc) 18%,transparent);color:color-mix(in srgb,var(--dc) 82%,#8d949d)}
</style>
<script>
const RM="<div class=\"rmCard\">\n        <div class=\"rmHead\">\n          <span class=\"rmTitle\">방 찾기</span>\n          <span class=\"rmHeadR\">\n            <span class=\"rmOnline\">방 <b id=\"roomCount\">7</b>개</span>\n            <button class=\"rmIco\" id=\"rmNumBtn\" onclick=\"toggleRoomNum()\" title=\"방 번호로 입장\" aria-label=\"방 번호로 입장\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"></circle><path d=\"M16 16l4 4\"></path></svg></button>\n          </span>\n        </div>\n        <!-- 가장 잦은 동작이 맨 위 = 빠른 입장(화면의 유일한 주 액션) -->\n        <button class=\"actBtn pri rmQuickTop\" onclick=\"quickJoin()\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 3 5 14h6l-1 7 8-11h-6z\"></path></svg>빠른 입장<em id=\"rmQuickSub\">대기 중 5방</em></button>\n        <!-- 방 번호 입장 = 친구 방 전용이라 평소엔 접어 둔다(우상단 🔍로 편다) -->\n        <div class=\"rmNum hide\" id=\"rmNumRow\">\n          <input id=\"roomNumField\" type=\"text\" inputmode=\"numeric\" placeholder=\"방 번호로 입장 (친구 방)\" maxlength=\"5\" onkeydown=\"if(event.key==='Enter')joinByNumber()\">\n          <button onclick=\"joinByNumber()\">입장</button>\n        </div>\n        <div class=\"rmFilter\" id=\"rmFilter\"><div class=\"pdSeg\" style=\"--n:5\"><i class=\"pdSegInd\" style=\"left:calc(var(--pad) + 0*(100% - 2*var(--pad))/5)\"></i><button class=\"pdSegBtn on\" onclick=\"pickRmDiff('all')\">전체</button><button class=\"pdSegBtn\" onclick=\"pickRmDiff('easy')\">EASY</button><button class=\"pdSegBtn\" onclick=\"pickRmDiff('normal')\">NORMAL</button><button class=\"pdSegBtn\" onclick=\"pickRmDiff('hard')\">HARD</button><button class=\"pdSegBtn\" onclick=\"pickRmDiff('hell')\">HELL</button></div></div>   <!-- 난이도 있는 유즈맵에서만 (segNavHTML) -->\n        <div class=\"rmList\" id=\"roomList\"><div class=\"roomItem\" style=\"--dc: #5dff8f; --dcGlow: #5dff8f;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#5dff8f\">EASY</span><span class=\"riTx\">막판러시 ㄱ</span><span class=\"riNum\">#9657</span></div><div class=\"riSub\">방장 - 보이드킹</div></div><div class=\"riRight\"><div class=\"riCnt\">4/8</div><div class=\"riStat wait\">대기중</div></div></div><div class=\"roomItem locked\" style=\"--dc: #ffb14d;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#ffb14d\">HARD</span><span class=\"riTx\">영웅 키우기</span><span class=\"riNum\">#2937</span></div><div class=\"riSub\">방장 - 막눈</div></div><div class=\"riRight\"><div class=\"riCnt\">6/8</div><div class=\"riStat play\">게임중 6R</div></div></div><div class=\"roomItem locked\" style=\"--dc: #4aa8ff;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#4aa8ff\">NORMAL</span><span class=\"riTx\">협동 클리어</span><span class=\"riNum\">#1124</span></div><div class=\"riSub\">방장 - GG준비됨</div></div><div class=\"riRight\"><div class=\"riCnt\">2/8</div><div class=\"riStat play\">게임중 13R</div></div></div><div class=\"roomItem\" style=\"--dc: #5dff8f; --dcGlow: #5dff8f;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#5dff8f\">EASY</span><span class=\"riTx\">초보만 ㄱㄱ</span><span class=\"riNum\">#9934</span></div><div class=\"riSub\">방장 - 노바777</div></div><div class=\"riRight\"><div class=\"riCnt\">1/8</div><div class=\"riStat wait\">대기중</div></div></div><div class=\"roomItem\" style=\"--dc: #4aa8ff; --dcGlow: #4aa8ff;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#4aa8ff\">NORMAL</span><span class=\"riTx\">풀방 가즈아</span><span class=\"riLock\"><img class=\"stIco\" src=\"assets/icons/state/st_lock.webp\" alt=\"\" draggable=\"false\" data-fb=\"🔒\" onerror=\"this.outerHTML=this.getAttribute('data-fb')||''\"></span><span class=\"riNum\">#3040</span></div><div class=\"riSub\">방장 - Striker</div></div><div class=\"riRight\"><div class=\"riCnt\">6/8</div><div class=\"riStat wait\">대기중</div></div></div><div class=\"roomItem\" style=\"--dc: #5dff8f; --dcGlow: #5dff8f;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#5dff8f\">EASY</span><span class=\"riTx\">무한 고수방</span><span class=\"riLock\"><img class=\"stIco\" src=\"assets/icons/state/st_lock.webp\" alt=\"\" draggable=\"false\" data-fb=\"🔒\" onerror=\"this.outerHTML=this.getAttribute('data-fb')||''\"></span><span class=\"riNum\">#8381</span></div><div class=\"riSub\">방장 - 리퍼장인</div></div><div class=\"riRight\"><div class=\"riCnt\">2/8</div><div class=\"riStat wait\">대기중</div></div></div><div class=\"roomItem\" style=\"--dc: #4aa8ff; --dcGlow: #4aa8ff;\"><div class=\"riMain\"><div class=\"riName\"><span class=\"riDiff\" style=\"--dc:#4aa8ff\">NORMAL</span><span class=\"riTx\">고인물 전용</span><span class=\"riLock\"><img class=\"stIco\" src=\"assets/icons/state/st_lock.webp\" alt=\"\" draggable=\"false\" data-fb=\"🔒\" onerror=\"this.outerHTML=this.getAttribute('data-fb')||''\"></span><span class=\"riNum\">#6126</span></div><div class=\"riSub\">방장 - Crystalize</div></div><div class=\"riRight\"><div class=\"riCnt\">2/8</div><div class=\"riStat wait\">대기중</div></div></div></div>\n        <div class=\"rmBtns\">\n          <button class=\"actBtn sq\" onclick=\"backToTitle()\" title=\"로비로 돌아가기\" aria-label=\"로비로\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"></path></svg></button>\n          <button class=\"actBtn\" data-sfx=\"ui_open\" onclick=\"createRoom()\">방 만들기</button>\n          <button class=\"actBtn sq\" onclick=\"refreshRooms()\" title=\"새로고침\" aria-label=\"새로고침\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.6 12a8.4 8.4 0 0 1 14.5-5.8M20.4 12a8.4 8.4 0 0 1-14.5 5.8\"></path><path d=\"M18.4 2.9v3.6h-3.6M5.6 21.1v-3.6h3.6\"></path></svg></button>\n        </div>\n      </div>";
const G1={EASY:'E',NORMAL:'N',HARD:'H',HELL:'H',FINAL:'F'};
const G2={EASY:'EA',NORMAL:'NO',HARD:'HA',HELL:'HE',FINAL:'FI'};
const GN={EASY:'1',NORMAL:'2',HARD:'3',HELL:'4',FINAL:'5'};
const GR={EASY:'\u2160',NORMAL:'\u2161',HARD:'\u2162',HELL:'\u2163',FINAL:'\u2164'};
const MAP={v1:G1,v2:G1,v3:G1,v4:G2,v5:GN,v6:GN,v7:GR,v8:G1};
function apply(root, key){
  root.querySelectorAll('.riDiff').forEach(b=>{
    const t=(b.textContent||'').trim(); const g=MAP[key][t];
    if(g) b.textContent=g;
    if(key==='v4') b.classList.add('b2');
  });
}
const V=[
 ['B1 · 첫 글자 · 테두리','E N H H F. 테두리만 있는 빈 상자 — 지금 배지에서 가장 적게 바뀐다. H 둘은 <b>색이 가른다</b>(주황 HARD / 빨강 HELL).','v1'],
 ['B2 · 첫 글자 · 채운 상자','난이도 색으로 <b>면을 채우고</b> 글자를 어둡게. 가장 눈에 띈다 — 훑기는 제일 빠르지만 목록이 알록달록해진다.','v2'],
 ['B3 · 첫 글자 · 은은한 면','색을 14%만 깐 면 + 색 글자. <b>테두리 없음</b> — 판 없는 목록의 결에 가장 가깝다.','v3'],
 ['B4 · 두 글자','EA NO HA HE FI. <b>H 충돌이 없다</b> — 색을 못 봐도 글자만으로 갈린다. 폭은 26px 고정.','v4'],
 ['B5 · 숫자 · 테두리','1~5. 난이도가 <b>몇 번째 단계인지</b>가 그대로 보인다. 이름을 몰라도 순서를 안다.','v5'],
 ['B6 · 숫자 · 채운 상자','같은 숫자를 <b>채운 상자</b>로. 게임에서 흔한 「난이도 3」 표기.','v6'],
 ['B7 · 로마 숫자','\u2160~\u2164. 숫자보다 조용하고 단계라는 뜻은 그대로. SF 결에 어울린다.','v7'],
 ['B8 · 첫 글자 · 각진 컷','모서리를 자른 상자(DESIGN 의 각진 SF). 라운드 상자보다 이 앱의 결에 맞는다.','v8'],
];
window.addEventListener('DOMContentLoaded',()=>{
  const host=document.getElementById('s');
  V.forEach(o=>{ const el=document.createElement('div'); el.className='p';
    el.innerHTML='<div class="tag">'+o[0]+'</div><div class="note">'+o[1]+'</div>'
      +'<div class="ph"><div id="rooms" class="'+o[2]+'">'+RM+'</div></div>';
    host.appendChild(el); apply(el, o[2]); });
});
</script>

<h2>방 찾기 — 난이도 배지 8안 <small>앞 글자 + 폭 고정 상자 · 제목 줄이 딱 맞는다</small></h2>
<div class="sheet" id="s"></div>
