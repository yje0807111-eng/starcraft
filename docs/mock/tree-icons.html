<!doctype html><meta charset="utf-8">
<style>
 *{box-sizing:border-box;margin:0}
 body{background:#0d0f13;font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#e8ecf2;padding:26px 22px}
 h1{font-size:21px;letter-spacing:-.4px;margin-bottom:4px}
 .sub{font-size:12.5px;color:#8b93a1;margin-bottom:20px}
 .br{margin-bottom:20px}
 .brh{display:flex;align-items:center;gap:9px;margin:0 0 10px 2px}
 .dot{width:11px;height:11px;transform:rotate(45deg)}
 .brn{font-size:14px;font-weight:700;letter-spacing:-.2px}
 .brc{font-size:11.5px;color:#78808e}
 .g{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
 .c{background:#151920;border:1px solid #232936;border-bottom-width:2px;padding:11px 6px 9px;text-align:center}
 .c img{width:62px;height:62px;display:block;margin:0 auto 7px}
 .nm{font-size:12px;font-weight:700;line-height:1.25;letter-spacing:-.3px}
 .kk{font-size:10px;color:#6d7583;margin-top:3px;font-family:Consolas,monospace}
 .mo{font-size:10.5px;color:#98a1b0;margin-top:5px;line-height:1.3}
</style>
<h1>환생 트리 아이콘 33 — 계열 대조</h1>
<div class="sub">그림 · 계열 이름 · 코드 키 · 무엇을 그린 것인지</div>
<div id="root"></div>
<script>
const BR={
 start:{n:'① 시작 도움',c:'#5dff8f'},
 econ :{n:'② 재화 획득',c:'#ffd24a'},
 army :{n:'③ 아군 강화',c:'#4aa8ff'},
 enemy:{n:'④ 적 약화',  c:'#ff3b3b'}};
const L=[
['start','tap','Show Me The Money','쪼개지는 결정 + 번개'],
['start','startMin',"What's Mine Is Mine",'파우치에서 쏟아지는 결정'],
['start','startWk','Operation CWAL','곡괭이 든 인부'],
['start','skipRd','There Is No Cow Level','결정 더미에 꽂힌 깃발'],
['econ','gather','일꾼 채취량','광석 실은 광차'],
['econ','gas','가스 생산량','세워 둔 가스통 둘'],
['econ','fever','피버 타임','세로로 솟는 불꽃'],
['econ','fevPct','피버 확률','삼거리 화살 — 가운데 갈래만 켜짐'],
['econ','fevMul','피버 배수','작은 블록 → 큰 발광 블록'],
['econ','fevSec','피버 시간','길게 남은 심지 + 끝의 불꽃'],
['econ','wkCap','일꾼 상한','줄지어 선 헬멧 셋'],
['econ','mine','광산 등급','갱도 입구 아치'],
['econ','idle','방치 수급','초승달 + 별'],
['econ','dgRw','던전 보상','열린 보물상자'],
['econ','tapMul','탭 배수','겹쳐 쌓인 판 셋'],
['econ','holdMs','채굴 속도','초시계 — 유일한 원형'],
['econ','gasEx','가스 교환비','각진 순환 화살 고리'],
['army','atk','유닛 공격력','판을 뚫는 화살촉'],
['army','hp','유닛 체력','방패'],
['army','prod','생산 속도','블록이 실린 컨베이어'],
['army','sup','인구 상한','막사'],
['army','upCost','업그레이드 비용','값표 + 아래 화살'],
['army','endure','버팀','금 간 육각 + 리벳 클램프 셋(번개 없음)'],
['army','bldg','건물 강화','포탑'],
['army','skCd','스킬 쿨다운','번개 + 게이지 막대'],
['enemy','foeHp','적 체력','갈라진 심장'],
['enemy','foeN','적 마리 수','벌레형 적 셋 — 오른쪽 하나가 조각남'],
['enemy','foeAtk','적 공격력','부러진 발톱'],
['enemy','foeRes','적 부활 시간','사슬로 묶인 묘비'],
['enemy','foeSpd','적 이동 속도','발목 족쇄'],
['enemy','bossHp','보스 체력','금 간 왕관'],
['enemy','foeRng','적 사거리','조준선 + 짧아진 화살'],
['enemy','foeDelay','적 등장 지연','반쯤 내려온 창살문']];
let h='';
for(const b in BR){ const rows=L.filter(x=>x[0]===b);
 h+='<div class="br"><div class="brh"><div class="dot" style="background:'+BR[b].c+'"></div>'+
    '<div class="brn" style="color:'+BR[b].c+'">'+BR[b].n+'</div>'+
    '<div class="brc">'+rows.length+'계열 · '+BR[b].c+'</div></div><div class="g">';
 for(const r of rows) h+='<div class="c" style="border-bottom-color:'+BR[b].c+'55">'+
   '<img src="../../assets/icons/tree/'+r[1]+'.webp">'+
   '<div class="nm">'+r[2].replace(/'/g,"&#39;")+'</div><div class="kk">'+r[1]+'</div>'+
   '<div class="mo">'+r[3]+'</div></div>';
 h+='</div></div>'; }
document.getElementById('root').innerHTML=h;
</script>
