<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>무장 칸 트레이 — 글리프 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ko:'IBM Plex Sans KR',sans-serif; --font-num:'Rajdhani',sans-serif;
  --neon:#ff3b3b;              /* 캠프 하단 구역의 액센트 — 칸 테두리가 이 색이다 */
  --ink:#e8edf5;               /* 머리줄 글자 */
  --dim:#8a94a6;               /* 설명 글자 */
  --cut:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:352px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:#ffd24a;margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 9px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:48px}
/* 실제 맥락 — 어두운 캠프 맵 위에 시트, 그 안에 카드(판 없음·투명) */
.stage{position:relative;padding:30px 10px 10px;
  background:linear-gradient(180deg,#2a2b2d 0%,#1b1c1f 46%,#141517 100%)}
.tray{position:absolute;right:10px;top:2px;display:flex;align-items:center;gap:6px;z-index:3}
.kick{font-size:9px;letter-spacing:2.16px;color:var(--ink);margin:0 0 7px 2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{height:58px;border:1px solid rgba(255,59,59,.30);border-radius:3px;
  background:rgba(0,0,0,.34);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:9px;color:var(--dim)}
.slot b{font-family:var(--font-num);font-size:10px;color:#c3ccd8;font-weight:700}
/* ── 공통 글리프 버튼 ────────────────────────────────────────────── */
.b{flex:none;height:26px;min-width:26px;padding:0 7px;cursor:pointer;background:none;border:0;
  display:flex;align-items:center;justify-content:center;color:#cfd6e0;
  font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;
  letter-spacing:.02em;position:relative}
.b.sq{min-width:26px;padding:0}
.b svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round}
/* ① 1px 사각 외곽선 */
.v1{border:1px solid rgba(255,255,255,.16);border-radius:3px}
/* ② 모서리 컷 외곽선 — 칸과 같은 문법 */
.v2{border:1px solid rgba(255,59,59,.34);border-radius:3px;clip-path:var(--cut)}
/* ③ 밑변 광원만 */
.v3::after{content:'';position:absolute;left:2px;right:2px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,59,59,.62),transparent)}
/* ④ 아주 옅은 면 · 테두리 없음 */
.v4{background:rgba(255,255,255,.055);border-radius:3px}
/* ⑤ 글자 아래 짧은 밑줄 */
.v5::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:3px;
  width:14px;height:1px;background:rgba(232,237,245,.42)}
/* ⑥ 점선 외곽 */
.v6{border:1px dashed rgba(200,220,240,.24);border-radius:3px}
/* ⑦ 왼쪽 광원 띠 — 캠프 던전 칩의 어휘 */
.v7{padding-left:9px}
.v7::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;
  background:var(--neon);box-shadow:0 0 6px -1px rgba(255,59,59,.7)}
/* ⑧ 글리프만 + 그림자로 띄우기 */
.v8{filter:drop-shadow(0 1px 2px rgba(0,0,0,.95))}
/* 눌린 느낌 공통 */
.b:active{transform:translateY(1px)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const BK = '<svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>';
const CARD = '<p class="kick">보병</p><div class="grid">'
  + [['공격력','Lv.3'],['공격속도','Lv.1'],['체력','Lv.2'],['방어력','Lv.0']]
      .map(([n,l])=>'<div class="slot"><b>'+l+'</b>'+n+'</div>').join('') + '</div>';
const tray = (v, extra) => '<div class="tray">'
  + '<button class="b ' + v + (extra||'') + '">×5</button>'
  + '<button class="b sq ' + v + (extra||'') + '">' + BK + '</button></div>';

const ANS = [
  ['1px 사각 외곽선', '가장 단순한 신호 — <b>흰 알파 1px</b>. 색을 안 쓰니 카드의 붉은 칸과 안 다툰다. 「누를 수 있다」만 조용히 말한다.', tray('v1')],
  ['모서리 컷 외곽선', '칸과 <b>같은 문법</b>(모서리를 깎은 3px)에 붉은 알파 1px. 카드와 한 벌로 읽히지만 붉은 요소가 하나 더 는다.', tray('v2')],
  ['밑변 광원만', '테두리를 없애고 <b>아래 1px</b>만 붉게. 이 프로젝트의 버튼 서명(.actBtn·탭 띠)을 가장 얇게 옮긴 것.', tray('v3')],
  ['아주 옅은 면', '선을 없애고 <b>흰 5.5% 면</b>만. 모서리가 부드러워 글자가 떠 보이고, 어느 배경에서도 같은 무게로 읽힌다.', tray('v4')],
  ['짧은 밑줄', '글자 아래 <b>14px 짧은 선</b>. 상자가 아니라 「글자에 붙은 표시」라 트레이가 가장 가볍다.', tray('v5')],
  ['점선 외곽', '<b>1px 점선</b> — 「임시로 고르는 값」이라는 인상. 배수처럼 자주 바뀌는 것과 어울리지만 다른 화면에 점선이 없다.', tray('v6')],
  ['왼쪽 광원 띠', '왼쪽에 <b>2px 붉은 띠</b>(캠프 던전 칩과 같은 어휘). 판 없이도 캠프 것이라는 게 색으로 먼저 읽힌다.', tray('v7')],
  ['글리프만 + 그림자', '아무 장치 없이 <b>그림자로만</b> 띄운다. 가장 조용하고 전장을 안 가린다 — 대신 누를 수 있다는 신호가 가장 약하다.', tray('v8')],
];
document.getElementById('wrap').innerHTML = ANS.map(([t,d,tr],i)=>
  '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'+
  '<div class="stage">'+tr+CARD+'</div></div>').join('');
</script></body></html>
