<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>던전 드롭다운 — 하단 시트와 어울리게 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ⚠ 지난 8안은 「청록 → 붉은색」 색만 바꾼 것이었다. 이번엔 **재질 자체**를 하단 시트(MY BASE)와
     같은 어휘로 맞춘다 — 화면을 함께 두고 판단하려고 **시트를 실제 그대로** 함께 그렸다(시트는 안 바꿈).
     하단 시트/칸(.cgSlot)의 진짜 재질:
       면      = linear-gradient(#0a0a0a,#000)  (--bpFace)
       테두리  = 1px rgba(255,255,255,.07~.1)   (--metal-edge 계열, 얇고 무채)
       라벨    = Rajdhani 9px · 자간 2.16px · #e8edf5 (.cgKick)
       버튼    = **.actBtn** — 옅은 흰 면(.05) + 1px 테두리(.1), 주 동작은 .14/.32(흰색, 빨강 아님)
     ⛔ 지금 드롭다운의 [이동] 버튼은 **이 공용 버튼을 안 쓰고 제 것을 새로 만들었다** — 그래서 서명이
        하단 카드들과 다르게 읽힌다. 아래 8안은 전부 .actBtn 재질로 바꿔 본다.
     ⛔ 글로우(box-shadow 발광)를 크게 쓰지 않는다 — 하단 시트·칸 어디에도 발광 테두리가 없다.
        「지금 여기」 표시는 얇은 선/면 정도로, **캠프 3D 하단 링과 같은 절제**를 따른다. */
:root{
  --font-ko:'IBM Plex Sans KR',sans-serif; --font-num:'Rajdhani',sans-serif;
  --neon:#ff3b3b; --neon-glow:rgba(255,59,59,.45); --cost:#ff7676;
  --ink:#e6eefc; --dim:#8a94a6; --edge:rgba(255,255,255,.07);
  --face:linear-gradient(#0a0a0a,#000);
}
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:406px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:#ffd24a;margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 10px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:60px}
.sub b{color:#c3ccd8;font-weight:700}

/* ── 무대: 재화 바 + 칩 + 드롭다운(변주) + 아래 실제 하단 시트(고정) ── */
.phone{width:390px;height:420px;position:relative;overflow:hidden;background:#8f8672}
.map{position:absolute;inset:0;background:
    radial-gradient(120% 60% at 30% 0%,rgba(0,0,0,.20),transparent 55%),
    repeating-linear-gradient(0deg,#948b76 0 68px,#8a8168 68px 70px),
    repeating-linear-gradient(90deg,#948b76 0 68px,#8a8168 68px 70px)}
.bar{position:absolute;left:0;top:0;right:0;height:34px;display:flex;align-items:center;
  gap:8px;padding:0 10px;z-index:3;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent)}
.chip{display:flex;align-items:baseline;gap:0;font-size:11.5px;font-weight:800;color:#e6eefc}
.chip i{font-style:normal;color:rgba(214,226,240,.35);margin:0 4px}
.chip b{font-family:var(--font-num);font-size:13px}
.chip .dim{font-family:var(--font-num);font-size:11px;color:rgba(214,226,240,.5)}
.res{margin-left:auto;font-family:var(--font-num);font-weight:700;color:#cfd8e6;font-size:11px}

/* 실제 하단 시트(MY BASE) — 오늘 것 그대로. 비교 기준으로 고정해 둔다. */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:9px 8px 12px;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%,0 7px);
  background:
    linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent) top/100% 1px no-repeat,
    linear-gradient(180deg,rgba(20,20,22,.55) 0%,rgba(10,10,11,.86) 55%,rgba(6,6,7,.94) 100%),
    linear-gradient(180deg,rgba(26,28,32,.38),rgba(16,18,21,.26));
  box-shadow:0 -8px 24px rgba(0,0,0,.55)}
.kick{font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:2.16px;color:#e8edf5;padding:0 2px 7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat span{font-size:9px;letter-spacing:.06em;color:var(--dim)}
.stat b{font-family:var(--font-num);font-size:13px;color:var(--ink);font-weight:700}

/* 드롭다운 공통 골격 */
.drop{position:absolute;left:30px;top:44px;width:250px;padding:8px 0 9px;font-size:11px;color:#d6e2f0;z-index:4}
.sec{padding:0 9px}
.sec+.sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.09)}
.sl{font-family:var(--font-num);font-size:9px;font-weight:800;letter-spacing:2.16px;color:#e8edf5;margin-bottom:6px}
.two{display:flex}
.L{flex:1;min-width:0;padding-right:8px}
.R{width:84px;flex:none;padding-left:9px;border-left:1px solid rgba(255,255,255,.09)}
.list{max-height:104px;overflow-y:auto}
.row{position:relative;display:flex;align-items:baseline;gap:7px;width:100%;
  padding:5.5px 3px 5.5px 8px;font-size:11.5px;font-weight:700;color:#b9c4d2}
.row .ix{font-family:var(--font-num);font-size:11px;color:#6f7a88;min-width:11px;text-align:right}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mul{font-family:var(--font-num);font-size:10.5px;color:#6f7a88}
.row.home{border-bottom:1px solid rgba(255,255,255,.09);padding-bottom:6px;margin-bottom:3px}
.pickwrap{position:relative;height:104px}
.pick{position:relative;height:104px}
.rn{position:absolute;left:0;right:0;height:26px;text-align:center;
  font-family:var(--font-num);font-size:13px;font-weight:700;color:#5f6874;line-height:26px}
.rn.on{font-size:18px}
/* .actBtn 공용 재질 그대로 — 옅은 흰 면 + 1px 테두리, 주 동작은 더 밝다(색은 없다) */
.go{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:32px;
  cursor:pointer;font-family:var(--font-ko);font-size:12px;font-weight:800;letter-spacing:.02em;
  color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(255,255,255,.14)}
.mm{margin:8px 0 0;color:#6f7887;font-size:10.5px;font-family:var(--font-num);letter-spacing:.04em}

/* ① 시트와 같은 판 — 껍데기(loadDim 곡선+모서리 컷 7px)를 통째로 재사용 */
.v1{clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%,0 7px);
  background:
    linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent) top/100% 1px no-repeat,
    linear-gradient(180deg,rgba(20,20,22,.72) 0%,rgba(10,10,11,.93) 55%,rgba(6,6,7,.97) 100%),
    linear-gradient(180deg,rgba(26,28,32,.38),rgba(16,18,21,.26));
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.v1 .row.here{color:#fff}
.v1 .row.here .ix{color:var(--cost)}
.v1 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.v1 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12)}
.v1 .rn.on{color:var(--cost)}

/* ② 칸 재질 그대로 — .cgSlot 의 검정 면 + 얇은 흰 테두리 + 윗변 하이라이트 */
.v2{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.5)}
.v2::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.v2 .row.here{color:#fff}
.v2 .row.here .ix{color:var(--cost)}
.v2 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.v2 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.v2 .rn.on{color:var(--cost)}

/* ③ 던전 줄도 칸처럼 — 목록을 낱개 .cgSlot 미니카드로(커맨드 카드 문법을 그대로 확장) */
.v3{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.v3 .list{max-height:none;display:flex;flex-direction:column;gap:3px}
.v3 .row{border:1px solid var(--edge);border-radius:2px;background:rgba(255,255,255,.015);padding:5px 6px;margin:0}
.v3 .row.home{border-bottom:1px solid var(--edge);margin-bottom:0;padding-bottom:5px}
.v3 .row.here{border-color:rgba(255,118,118,.35);background:rgba(255,59,59,.06);color:#fff}
.v3 .row.here .ix{color:var(--cost)}
.v3 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border:1px solid var(--edge);border-radius:2px}
.v3 .rn.on{color:var(--cost)}

/* ④ kick 라벨을 진짜로 — DUNGEON/ROUND 를 MY BASE 와 정확히 같은 서명으로(자간·색 동일) 위에 헤어라인 */
.v4{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.v4 .sl{padding-bottom:5px;border-bottom:1px solid var(--edge);margin-bottom:6px}
.v4 .row.here{color:#fff}
.v4 .row.here .ix{color:var(--cost)}
.v4 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.v4 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.v4 .rn.on{color:var(--cost)}

/* ⑤ 한 덩어리 — L/R 세로선을 지우고 여백만으로 가른다(더 조용하게, 판 자체는 시트처럼 이어 보인다) */
.v5{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.v5 .R{border-left:0;padding-left:14px}
.v5 .row.here{color:#fff}
.v5 .row.here .ix{color:var(--cost)}
.v5 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.v5 .mid{position:absolute;left:0;right:0;top:39px;height:26px;background:rgba(255,255,255,.035);border-radius:2px}
.v5 .rn.on{color:var(--cost)}

/* ⑥ 조용한 무채 — 강조색을 아예 안 쓴다(흰색 굵기·크기만으로 위계). 가장 절제된 안 */
.v6{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.v6 .row.here{color:#fff;font-weight:800}
.v6 .row.here .ix{color:#c3ccd8}
.v6 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:rgba(255,255,255,.4)}
.v6 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.v6 .rn.on{color:#fff}
.v6 .go{color:#fff}

/* ⑦ 밀도를 시트만큼 조밀하게 — 행 높이를 줄이고 라벨을 12px 로, 더 많은 정보가 한눈에 */
.v7{background:var(--face);border:1px solid var(--edge);border-radius:0 3px 3px 3px;box-shadow:0 8px 20px rgba(0,0,0,.5);font-size:10.5px}
.v7 .row{padding:4px 3px 4px 8px;font-size:11px}
.v7 .row.home{padding-bottom:4px;margin-bottom:2px}
.v7 .row.here{color:#fff}
.v7 .row.here .ix{color:var(--cost)}
.v7 .row.here::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--cost)}
.v7 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.v7 .rn.on{color:var(--cost)}
.v7 .go{height:28px;font-size:11px}

/* ⑧ 시트와 물리적으로 이어 붙인다 — 칩 바로 아래, 시트와 같은 짙기로 자연스레 흘러내리게 */
.v8{background:
    linear-gradient(180deg,rgba(16,17,19,.94) 0%,rgba(8,8,9,.98) 100%);
  border:1px solid var(--edge);border-top:2px solid rgba(255,118,118,.55);border-radius:0 0 3px 3px;
  box-shadow:0 10px 24px rgba(0,0,0,.55)}
.v8 .row.here{color:#fff}
.v8 .row.here .ix{color:var(--cost)}
.v8 .row.here::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--cost)}
.v8 .mid{position:absolute;left:0;right:0;top:39px;height:26px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.v8 .rn.on{color:var(--cost)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const DG=[['0','캠프','안전','home'],['1','감염된 둥지','×1.0',''],['2','버려진 전초기지','×3.0',''],
  ['3','잊혀진 회랑','×10.0','here'],['4','산란장','×30.0','']];
const RN=[[31,''],[30,'on'],[29,'']];
const STATS=[['터치 획득','16'],['자동 수급','측정 중'],['일꾼','0기'],['인구','0 / 10'],
  ['던전 배수','×10.0'],['채취 배수','×15.8'],['터치 강화','Lv.0'],['채취 강화','Lv.0']];

const DROP=(cls)=>'<div class="drop '+cls+'">'
  +'<div class="sec"><div class="two">'
    +'<div class="L"><div class="sl">DUNGEON</div><div class="list">'
      + DG.map(([i,n,m,c])=>'<button class="row'+(c?' '+c:'')+'"><i class="ix">'+i+'</i><span class="nm">'+n+'</span><span class="mul">'+m+'</span></button>').join('')
    +'</div></div>'
    +'<div class="R"><div class="sl">ROUND</div><div class="pickwrap"><i class="mid"></i>'
      +'<div class="pick">'
        + RN.map(([v,c],i)=>'<div class="rn'+(c?' on':'')+'" style="top:'+(i*26)+'px">'+v+'</div>').join('')
      +'</div></div></div>'
  +'</div></div>'
  +'<div class="sec"><button class="go">이동</button></div>'
  +'</div>';

const CHIP='<div class="bar"><div class="chip">잊혀진 회랑<i>·</i><b>30</b><span class="dim">/50</span></div>'
  +'<div class="res">1.6M&nbsp;&nbsp;755&nbsp;&nbsp;0&nbsp;&nbsp;0/10</div></div>';

const SHEET='<div class="sheet"><div class="kick">MY BASE</div><div class="stats">'
  + STATS.map(([n,v])=>'<div class="stat"><span>'+n+'</span><b>'+v+'</b></div>').join('') + '</div></div>';

const ANS=[
 ['시트와 같은 판','드롭다운 껍데기를 <b>시트와 완전히 같은 재질</b>(loadDim 곡선 + 모서리 컷 7px)로 통째로 재사용. 위아래가 한 벌처럼 읽히는 것이 가장 확실한 안.'],
 ['칸(.cgSlot) 재질','시트 안 칸들과 <b>똑같은 검정 면 + 얇은 흰 테두리 + 윗변 하이라이트</b>. 판 자체가 「시트 안의 카드 하나」처럼 보인다.'],
 ['목록도 미니카드로','던전 한 줄 한 줄을 <b>낱개 .cgSlot 카드</b>로 만든다. 커맨드 카드 문법을 목록까지 확장한 것 — 시트의 그리드 느낌이 그대로 이어진다.'],
 ['진짜 kick 라벨','DUNGEON/ROUND 를 MY BASE 와 <b>정확히 같은 서명</b>(Rajdhani 9px·자간 2.16·#e8edf5)으로, 위에 헤어라인 하나. 타이포가 완전히 통일된다.'],
 ['한 덩어리','던전/라운드를 가르던 세로선을 지우고 <b>여백만으로</b> 나눈다. 판이 안 쪼개져 보여 시트와 더 이어진 느낌.'],
 ['조용한 무채','강조색을 <b>아예 안 쓴다</b> — 흰 굵기·크기로만 「지금 여기」를 말한다. 가장 절제됐고, 시트도 원래 색이 거의 없다.'],
 ['시트만큼 조밀하게','행 높이를 줄이고 라벨을 <b>12px 로</b> — MY BASE 의 촘촘한 스탯 그리드와 밀도가 맞는다.'],
 ['시트에 이어 붙인다','칩 바로 아래, 시트와 <b>같은 짙기로 흘러내리듯</b> — 위에 붉은 2px 선만 얹어 그 자체가 표식이자 시트로 가는 다리처럼 읽힌다.'],
];
document.getElementById('wrap').innerHTML=ANS.map(([t,d],i)=>
 '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'
 +'<div class="phone"><div class="map"></div>'+CHIP+DROP('v'+(i+1))+SHEET+'</div></div>').join('');
</script></body></html>
