<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>캠프 좌상단 — 하단 구역 어휘 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ⚠ 어휘는 **하단 구역에서 실측해 가져왔다**(2026-09-03 · 커맨드 카드).
     칸    : linear-gradient(#0a0a0a,#000) · 테두리 rgba(255,255,255,.07) 1px · 라운드 3px
             · inset 0 1px 0 rgba(255,255,255,.05)
     kick  : Rajdhani 9px · 자간 2.16px · #e8edf5
     이름  : 10px / 800 / #e6eefc / 자간 -.2px
     숫자  : Rajdhani 800 · 비용색 #ff7676 · 레벨 칩 #c8b6ff (면 rgba(10,12,20,.72))
   ⛔ 청록(--hud #00e5ff)은 한 곳도 쓰지 않는다 — 좌상단이 하단과 다른 색을 쓰던 것이 어긋남의 원인이었다.
   ⚠ 자리 제약: 재화 바 390×34 · 재화 구역 248.6px → **칩에 남는 폭은 95px 안팎**. */
:root{
  --font-ko:'IBM Plex Sans KR',sans-serif; --font-num:'Rajdhani',sans-serif;
  --neon:#ff3b3b; --neon-glow:rgba(255,59,59,.45); --cost:#ff7676; --lvl:#c8b6ff;
  --ink:#e6eefc; --kick:#e8edf5; --dim:rgba(214,226,240,.5);
  --face:linear-gradient(#0a0a0a,#000);
  --edge:rgba(255,255,255,.07);
  --lip:inset 0 1px 0 rgba(255,255,255,.05);
  --cut:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:406px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:#ffd24a;margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 10px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:62px}
.sub b{color:#c3ccd8;font-weight:700}

/* ── 무대 — 위는 재화 바, 아래는 **진짜 하단 구역**(어울리는지 한눈에 보려고) ── */
.phone{width:390px;position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 30% 0%,#232a34 0%,#161a20 45%,#0d1014 100%)}
.map{height:96px;position:relative}
.map::after{content:'';position:absolute;inset:0;
  background:
    radial-gradient(38px 22px at 78px 44px,rgba(120,130,150,.20),transparent 70%),
    radial-gradient(30px 18px at 300px 70px,rgba(170,110,90,.18),transparent 70%),
    repeating-linear-gradient(56deg,rgba(255,255,255,.016) 0 2px,transparent 2px 9px)}
.bar{position:absolute;left:0;top:0;right:0;height:34px;display:flex;align-items:center;
  gap:8px;padding:0 10px;z-index:2}
.res{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-family:var(--font-num);font-weight:700;font-size:12px;color:#cfd8e6}
.res span{display:flex;align-items:center;gap:3px}
.res u{width:12px;height:12px;border-radius:2px;text-decoration:none;display:block}
.res .m u{background:linear-gradient(180deg,#7fd8ff,#2b7fae)}
.res .g u{background:linear-gradient(180deg,#7ff0b0,#25865a)}
.res .p u{background:linear-gradient(180deg,#c9b6ff,#6a4fd0)}
.set{width:22px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.14);
  display:grid;place-items:center;color:#aab6c6}
.set svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.slot{max-width:112px;min-width:0;flex:0 1 auto}
/* 하단 구역 — 실제 커맨드 카드를 그대로 옮겼다 */
.sheet{padding:9px 10px 11px;background:linear-gradient(180deg,#16181c,#0b0c0f);
  box-shadow:0 -8px 24px rgba(0,0,0,.55)}
.kick{font-family:var(--font-num);font-size:9px;letter-spacing:2.16px;color:var(--kick);margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell4{height:62px;border:1px solid var(--edge);border-radius:3px;background:var(--face);
  box-shadow:var(--lip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cell4 em{font-style:normal;font-family:var(--font-num);font-size:8.5px;font-weight:800;color:var(--lvl);
  border:1px solid rgba(200,182,255,.3);border-radius:4px;padding:1px 3px;background:rgba(10,12,20,.72)}
.cell4 s{text-decoration:none;font-size:10px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.cell4 u{text-decoration:none;font-family:var(--font-num);font-size:10px;font-weight:800;color:var(--cost)}
.mm{margin:8px 0 0;color:#6f7887;font-size:10.5px;font-family:var(--font-num);letter-spacing:.04em}

/* ══ 공통 ═══════════════════════════════════════════════════════════ */
.chip{position:relative;display:inline-flex;min-width:0;max-width:100%;cursor:pointer;
  letter-spacing:-.2px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.nm{font-weight:800;color:var(--ink);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k{font-family:var(--font-num);font-size:9px;letter-spacing:2.16px;color:var(--kick);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-family:var(--font-num);font-weight:800;color:var(--ink)}
.dim{font-style:normal;font-family:var(--font-num);color:var(--dim)}
.cv{width:10px;height:10px;color:rgba(214,226,240,.55);flex:none}
.cv svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
.pane{background:var(--face);border:1px solid var(--edge);border-radius:3px;box-shadow:var(--lip)}

/* ① kick + 이름 — 판 없이, 하단 머리줄 어휘를 그대로 */
.v1{flex-direction:column;justify-content:center;padding:0 13px 3px 0;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.95))}
.v1 .k{line-height:1.2}
.v1 .row{display:flex;align-items:baseline;gap:4px;line-height:1.05}
.v1 .n{font-size:12px}.v1 .dim{font-size:10px}
.v1 .line{position:absolute;left:0;right:12px;bottom:0;height:1px;background:rgba(255,255,255,.09)}
.v1 .line i{display:block;height:100%;background:var(--cost)}
.v1 .cv{position:absolute;right:0;top:50%;margin-top:-5px}

/* ② 칸 껍데기 축소판 — 하단 칸을 그대로 작게 */
.v2{align-items:center;gap:6px;height:26px;padding:0 6px}
.v2 .nm{font-size:10px}
.v2 .n{font-size:11px}.v2 .dim{font-size:9.5px}
.v2 .line{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.v2 .line i{display:block;height:100%;background:var(--cost)}

/* ③ 레벨 칩 어휘 — 라운드를 cgMeta 처럼 작은 칩으로 */
.v3{align-items:center;gap:5px;padding:0 12px 0 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v3 .tag{font-family:var(--font-num);font-size:9px;font-weight:800;color:var(--lvl);flex:none;
  border:1px solid rgba(200,182,255,.3);border-radius:4px;padding:1px 4px;background:rgba(10,12,20,.72)}
.v3 .body{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
.v3 .dim{font-size:9px;letter-spacing:.6px}
.v3 .cv{position:absolute;right:0;top:50%;margin-top:-5px}

/* ④ 계기판 — 숫자가 주인공, 이름은 kick 로 위에 */
.v4{align-items:center;gap:7px;padding:0 12px 0 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v4 .big{font-family:var(--font-num);font-size:20px;font-weight:700;line-height:.95;color:var(--ink);flex:none}
.v4 .body{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px}
.v4 .dim{font-size:9px;letter-spacing:.5px}
.v4 .line{position:absolute;left:0;right:11px;bottom:1px;height:1.5px;background:rgba(255,255,255,.08)}
.v4 .line i{display:block;height:100%;background:var(--cost)}
.v4 .cv{position:absolute;right:0;top:50%;margin-top:-5px}

/* ⑤ 한 줄 · 가운뎃점 — 이름 · 30/50, 아래 붉은 실선 */
.v5{align-items:baseline;gap:5px;padding:0 12px 3px 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v5 .sep{color:rgba(214,226,240,.35);font-size:10px}
.v5 .n{font-size:11px}.v5 .dim{font-size:9.5px}
.v5 .line{position:absolute;left:0;right:11px;bottom:0;height:1.5px;background:rgba(255,255,255,.08)}
.v5 .line i{display:block;height:100%;background:var(--cost);box-shadow:0 0 6px -1px var(--neon-glow)}
.v5 .cv{position:absolute;right:0;bottom:4px}

/* ⑥ 눈금 — 진행을 막대가 아니라 **다섯 칸**으로(대기열 선 어휘) */
.v6{flex-direction:column;justify-content:center;gap:2px;padding:0 12px 0 0;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v6 .k{line-height:1.15}
.v6 .row{display:flex;align-items:center;gap:5px}
.v6 .n{font-size:11px}.v6 .dim{font-size:9px}
.v6 .ticks{display:flex;gap:2px}
.v6 .ticks i{width:6px;height:3px;background:rgba(255,255,255,.10);border-radius:1px}
.v6 .ticks i.on{background:var(--cost)}
.v6 .cv{position:absolute;right:0;top:50%;margin-top:-5px}

/* ⑦ 모서리 컷 판 — 트레이 칸과 같은 각진 문법 */
.v7{align-items:stretch;padding:0 13px 0 7px;clip-path:var(--cut);
  background:var(--face);border:1px solid var(--edge)}
.v7 .body{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:3px 0 4px;gap:1px}
.v7 .k{line-height:1.1;font-size:8.5px;letter-spacing:1.8px}
.v7 .row{display:flex;align-items:baseline;gap:3px;line-height:1}
.v7 .n{font-size:11px}.v7 .dim{font-size:9.5px}
.v7 .line{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.v7 .line i{display:block;height:100%;background:var(--cost)}
.v7 .cv{position:absolute;right:3px;top:50%;margin-top:-5px}

/* ⑧ 왼쪽 굵은 획 — 색은 붉은색, 판은 없다 */
.v8{align-items:stretch;gap:6px;padding:0 12px 0 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v8 .stroke{width:3px;flex:none;background:var(--cost);border-radius:1px;
  box-shadow:0 0 7px -2px var(--neon-glow)}
.v8 .body{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
.v8 .row{display:flex;align-items:baseline;gap:4px;line-height:1}
.v8 .n{font-size:11px}.v8 .dim{font-size:9.5px}
.v8 .cv{position:absolute;right:0;top:50%;margin-top:-5px}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const CV='<i class="cv"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></i>';
const NAME='잊혀진 회랑', CUR=30, MAX=50, PCT=(CUR/MAX*100).toFixed(1);

const RES='<div class="res">'
  +'<span class="m"><u></u>248,310</span><span class="g"><u></u>1,842</span>'
  +'<span class="p"><u></u>36</span><span class="m"><u></u>12/40</span>'
  +'<i class="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/>'
  +'<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></i></div>';

/* 하단 구역 — 실제 무장 칸 네 개 */
const SHEET='<div class="sheet"><div class="kick">보병</div><div class="grid">'
  +[['Lv.3','공격력','1'],['Lv.1','공격속도','2'],['Lv.2','체력','2'],['Lv.0','방어력','3']]
    .map(([l,n,c])=>'<div class="cell4"><em>'+l+'</em><s>'+n+'</s><u>'+c+'</u></div>').join('')
  +'</div></div>';

const ticks=(k)=>{let s='<span class="ticks">';
  for(let i=0;i<5;i++) s+='<i class="'+(i<Math.round(k*5)?'on':'')+'"></i>'; return s+'</span>';};

const V={
 1:'<div class="chip v1"><span class="k">'+NAME+'</span>'
   +'<span class="row"><b class="n">'+CUR+'</b><i class="dim">/'+MAX+'</i></span>'
   +'<span class="line"><i style="width:'+PCT+'%"></i></span>'+CV+'</div>',
 2:'<div class="chip v2 pane"><span class="nm">'+NAME+'</span><b class="n">'+CUR+'</b>'
   +'<i class="dim">/'+MAX+'</i>'+CV+'<span class="line"><i style="width:'+PCT+'%"></i></span></div>',
 3:'<div class="chip v3"><b class="tag">R'+CUR+'</b><span class="body">'
   +'<span class="nm">'+NAME+'</span><i class="dim">/ '+MAX+' 라운드</i></span>'+CV+'</div>',
 4:'<div class="chip v4"><b class="big">'+CUR+'</b><span class="body">'
   +'<span class="k">'+NAME+'</span><i class="dim">/ '+MAX+'</i></span>'
   +'<span class="line"><i style="width:'+PCT+'%"></i></span>'+CV+'</div>',
 5:'<div class="chip v5"><span class="nm">'+NAME+'</span><i class="sep">·</i>'
   +'<b class="n">'+CUR+'</b><i class="dim">/'+MAX+'</i>'
   +'<span class="line"><i style="width:'+PCT+'%"></i></span>'+CV+'</div>',
 6:'<div class="chip v6"><span class="k">'+NAME+'</span>'
   +'<span class="row"><b class="n">'+CUR+'</b><i class="dim">/'+MAX+'</i>'+ticks(CUR/MAX)+'</span>'+CV+'</div>',
 7:'<div class="chip v7"><span class="body"><span class="k">'+NAME+'</span>'
   +'<span class="row"><b class="n">'+CUR+'</b><i class="dim">/'+MAX+'</i></span></span>'
   +'<span class="line"><i style="width:'+PCT+'%"></i></span>'+CV+'</div>',
 8:'<div class="chip v8"><i class="stroke"></i><span class="body">'
   +'<span class="nm">'+NAME+'</span>'
   +'<span class="row"><b class="n">'+CUR+'</b><i class="dim">/'+MAX+'</i></span></span>'+CV+'</div>',
};

const ANS=[
 ['kick + 이름 · 판 없음','던전 이름을 <b>하단 머리줄과 같은 글자</b>(Rajdhani 9px · 자간 2.16)로 두고 그 아래 라운드. 판이 없어 전장을 안 가리고, 하단 카드의 머리줄이 위로 한 번 더 나온 것처럼 읽힌다.'],
 ['칸 껍데기 축소판','하단 <b>칸을 그대로 작게</b> 옮긴 것 — 검은 면 · 흰 7% 테두리 · 윗변 광택. 위아래가 같은 재질이라 가장 확실하게 한 벌로 보인다. 대신 폭을 다 쓴다.'],
 ['레벨 칩','라운드를 칸 왼쪽 위의 <b>Lv 칩과 같은 어휘</b>로. 「R30」이 한 덩어리라 폭을 아끼고, 보라는 하단에서 이미 「레벨」의 색이다.'],
 ['계기판','<b>큰 숫자가 주인공</b>이고 던전 이름은 kick 로 얹힌다. 지금 몇 라운드인지가 가장 먼저 읽힌다. 진행은 아래 붉은 실선.'],
 ['한 줄 · 가운뎃점','<b>이름 · 30/50</b> 을 한 줄로. 가장 조용하고 높이를 안 쓴다. 이름이 길면 잘리는 것이 단점.'],
 ['눈금 다섯','진행을 막대가 아니라 <b>다섯 칸 눈금</b>으로 — 하단 대기열 선과 같은 어휘. 「절반쯤 왔다」가 숫자를 안 읽어도 보인다.'],
 ['모서리 컷 판','판은 두되 <b>모서리를 깎는다</b> — 트레이 칸과 같은 각진 문법. 판이 있어 밝은 배경에서도 읽히고, 각짐이 하단과 이어진다.'],
 ['왼쪽 굵은 획','판을 지우고 왼쪽에 <b>붉은 3px 획</b>만. 「지금 여기」를 색으로 말한다 — 지금 청록 띠가 하던 일을 하단의 붉은색으로 바꾼 것.'],
];

document.getElementById('wrap').innerHTML=ANS.map(([t,d],i)=>
 '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'
 +'<div class="phone"><div class="map"><div class="bar"><div class="slot">'+V[i+1]+'</div>'+RES+'</div></div>'
 +SHEET+'</div><p class="mm"></p></div>').join('');

const measure=()=>{ document.querySelectorAll('.cell').forEach(c=>{
  const r=c.querySelector('.chip').getBoundingClientRect();
  c.querySelector('.mm').textContent='폭 '+r.width.toFixed(1)+'px · 높이 '+r.height.toFixed(1)+'px'
    +(r.width>=112?'   ⚠ 자리를 다 써서 이름이 잘린다':''); }); };
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure); else setTimeout(measure,300);
</script></body></html>
