<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>좌상단 칩 — 크기 ↑ · 배경과 가르기 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ⚠ 지금(기준선): 이름 11.5px · 숫자 13px · 판 없음 · 글자 그림자만.
     바꾸려는 것 둘 — ① 조금 더 크게 ② **배경과 살짝 갈라 보이게**.
     ⚠ 자리 제약은 그대로다: 재화 바 390×34 · 칩 폭 예산 **110px**(스모크가 못 박는다) · 높이는 바 안.
        그래서 여덟 안 전부 이름 12.5px · 숫자 14px 로 **같은 크기**를 쓰고, **가르는 방법만** 다르다.
     ⛔ 청록·발광 없음. 붉은색은 진행 밑선에만(칩의 서명). */
:root{--ko:'IBM Plex Sans KR',sans-serif;--num:'Rajdhani',sans-serif;--red:#ff7676;--ink:#e6eefc;--dim:rgba(214,226,240,.5);--mute:rgba(214,226,240,.35)}
*{box-sizing:border-box}
body{margin:0;background:#101317;color:#dfe5ee;font-family:var(--ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:406px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}.cap i{font-style:normal;color:#ffd24a;margin-right:7px;font-family:var(--num)}
.sub{margin:0 0 9px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:52px}.sub b{color:#c3ccd8;font-weight:700}
/* 무대 — 밝은 돌바닥(지금 캠프)과 어두운 바닥 둘 다에서 본다 */
.pair{display:flex;flex-direction:column;gap:6px}
.phone{width:390px;height:78px;position:relative;overflow:hidden}
.light{background:radial-gradient(120% 90% at 30% 0%,#9a9179,#867d68)}
.light::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 34px,transparent 34px 36px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 60px,transparent 60px 62px)}
.dark{background:radial-gradient(120% 90% at 30% 0%,#2a3038,#14171b)}
.bar{position:absolute;left:0;top:0;right:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:2}
.res{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--num);font-weight:800;font-size:12.5px;color:#f2f6fb;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.res u{width:13px;height:13px;border-radius:2px;text-decoration:none;display:block}
.res .m u{background:linear-gradient(180deg,#7fd8ff,#2b7fae)}.res .g u{background:linear-gradient(180deg,#7ff0b0,#25865a)}
.res .p u{background:linear-gradient(180deg,#c9b6ff,#6a4fd0)}.res .c u{background:linear-gradient(180deg,#cfd8e6,#7d8794)}
.set{width:22px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;color:#aab6c6;margin-left:1px}
.set svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.mm{margin:7px 0 0;color:#6f7887;font-size:10.5px;font-family:var(--num);letter-spacing:.04em}
/* 칩 공통 — 크기는 여덟 안이 같다(이름 12.5 · 숫자 14) */
.chip{position:relative;display:inline-flex;align-items:baseline;gap:0;min-width:0;
  padding:0 13px 0 0;letter-spacing:-.2px;line-height:1;cursor:pointer}
/* ⚠ 실제 자리와 **같은 상한**(110px)을 건다 — 이 크기에서는 던전 이름이 조금 잘린다는 것을 그대로 보여 준다.
   (지금 11.5/13px 에서는 106.9px 로 안 잘렸다. 12.5/14px 로 키우면 「잊혀진 회랑」이 「잊혀진 회…」가 된다.) */
.chip{max-width:110px}
.chip .nm{font-size:12.5px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .sep{font-style:normal;font-size:11.5px;color:var(--mute);margin:0 4px}
.chip .n{font-family:var(--num);font-size:14px;font-weight:800;color:var(--ink);flex:none}
.chip .d{font-style:normal;font-family:var(--num);font-size:11.5px;color:var(--dim);flex:none}
.chip .cv{position:absolute;right:0;bottom:0;width:11px;height:11px;color:var(--dim)}
.chip .cv svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chip .ul{position:absolute;left:0;right:12px;bottom:-4px;height:2px;background:rgba(255,255,255,.14)}
.chip .ul i{display:block;height:100%;width:60%;background:var(--red)}

/* ① 그림자만 (지금 방식 · 크기만 키움) */
.v1{text-shadow:0 1px 3px rgba(0,0,0,.9);filter:drop-shadow(0 1px 3px rgba(0,0,0,.92))}
/* ② 그늘 한 겹 — 글자 뒤에 아주 옅은 검정(판이 아니라 그늘) */
.v2{text-shadow:0 1px 3px rgba(0,0,0,.9);padding:4px 13px 4px 8px;margin-left:-8px;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.16) 78%,transparent)}
/* ③ 왼쪽 붉은 획 — 「지금 여기」를 색으로. 판은 없다 */
.v3{text-shadow:0 1px 3px rgba(0,0,0,.9);padding-left:8px}
.v3::before{content:'';position:absolute;left:0;top:1px;bottom:1px;width:2px;background:var(--red)}
/* ④ 옅은 면 + 1px — 공용 .actBtn 재질(가장 「버튼」답다) */
.v4{padding:4px 13px 4px 7px;border:1px solid rgba(255,255,255,.10);border-radius:3px;background:rgba(255,255,255,.05)}
.v4 .ul{left:6px;right:17px;bottom:3px}
/* ⑤ 검정 반투명 판 — 밝은 바닥에서 가장 확실하게 읽힌다 */
.v5{padding:4px 13px 4px 8px;border-radius:3px;background:rgba(6,8,12,.55)}
.v5 .ul{left:7px;right:17px;bottom:3px}
/* ⑥ 모서리 컷 판 — 트레이·칸과 같은 각진 문법 */
.v6{padding:4px 13px 4px 8px;background:rgba(6,8,12,.58);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.v6 .ul{left:7px;right:17px;bottom:3px}
/* ⑦ 글자만 더 굵고 밝게 — 판 없이 대비로만 가른다 */
.v7{text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.55)}
.v7 .nm{color:#fff}.v7 .n{color:#fff}
/* ⑧ 밑줄 강조 — 진행선을 3px 로 키워 칩 전체를 떠받친다 */
.v8{text-shadow:0 1px 3px rgba(0,0,0,.9);filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.v8 .ul{height:3px;bottom:-5px;background:rgba(255,255,255,.18)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const CV='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const CHIP=(v)=>'<div class="chip '+v+'"><span class="nm">잊혀진 회랑</span><i class="sep">·</i><b class="n">30</b><i class="d">/50</i>'
  +'<i class="cv">'+CV+'</i><span class="ul"><i></i></span></div>';
const RES='<div class="res"><span class="m"><u></u>1.6M</span><span class="g"><u></u>755</span><span class="p"><u></u>0</span><span class="c"><u></u>0/10</span>'
  +'<i class="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></i></div>';
const STAGE=(v)=>'<div class="pair">'
  +'<div class="phone light"><div class="bar">'+CHIP(v)+RES+'</div></div>'
  +'<div class="phone dark"><div class="bar">'+CHIP(v)+RES+'</div></div></div>';
const ANS=[
 ['그림자만 (지금 방식 · 크기만 ↑)','판 없이 <b>글자 그림자</b>만. 지금 것에서 크기만 키운 것 — 가장 가볍지만 밝은 돌바닥에서 대비가 가장 약하다.'],
 ['그늘 한 겹','글자 뒤에 <b>왼쪽만 짙은 그늘</b>을 깐다(오른쪽으로 사라진다). 판처럼 보이지 않으면서 밝은 바닥에서도 글자가 뜬다.'],
 ['왼쪽 붉은 획','판 대신 <b>왼쪽 2px 붉은 획</b>. 「지금 여기」를 색으로 말하고, 아래 진행선과 같은 색이라 한 벌로 읽힌다.'],
 ['옅은 면 + 1px','공용 버튼(.actBtn)과 <b>같은 재질</b> — 옅은 흰 면 + 1px 테두리. 「누를 수 있다」가 가장 분명하다.'],
 ['검정 반투명 판','<b>검정 55%</b> 판. 어떤 바닥에서도 확실히 읽힌다 — 대신 판이 하나 더 생긴다.'],
 ['모서리 컷 판','같은 검정 판이되 <b>모서리를 깎는다</b> — 트레이·칸과 같은 각진 문법이라 캠프 것처럼 보인다.'],
 ['글자만 굵고 밝게','판 없이 <b>흰 글자 + 넓은 그림자</b>로만 가른다. 가장 조용하면서 ①보다 확실히 뜬다.'],
 ['밑줄 강조','진행선을 <b>3px</b>로 키워 칩 전체를 떠받친다. 밑줄이 칩의 경계 노릇을 해 판 없이도 덩어리로 읽힌다.'],
];
document.getElementById('wrap').innerHTML=ANS.map(([t,d],i)=>
 '<div class="cell"><p class="cap"><i>'+(i+1)+'</i>'+t+'</p><p class="sub">'+d+'</p>'+STAGE('v'+(i+1))+'<p class="mm"></p></div>').join('');
const measure=()=>{document.querySelectorAll('.cell').forEach(c=>{const r=c.querySelector('.chip').getBoundingClientRect();
  const nm=c.querySelector('.nm'); const cut=nm.scrollWidth>nm.clientWidth+1;
  c.querySelector('.mm').textContent='폭 '+r.width.toFixed(1)+'px · 높이 '+r.height.toFixed(1)+'px'
    +(cut?'   ⚠ 이름이 잘린다(「잊혀진 회…」)':'   이름 안 잘림');});};
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure); else setTimeout(measure,300);
</script></body></html>
