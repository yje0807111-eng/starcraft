<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>토벌 허브 — 행 버튼 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 토큰 — css/00-base.css 그대로 */
:root{
  --font-ko:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --font-ti:'Jua','Apple SD Gothic Neo',sans-serif;
  --font-num:'Rajdhani','Noto Sans KR',sans-serif;
  --neon:#ff3b3b; --metal-edge:#3c3e46; --glass-edge:rgba(255,255,255,.12);
  --txt:#e0dcdc; --txt-mute:#9aa0a8; --gold:#ffd24a; --ok:#5dff8f; --info:#4aa8ff; --warn:#ffb14d;
  --acc-sel:#5cd6ff; --r-bar:3px; --r-md:6px; --r-lg:9px;
  --fs-xs:9.5px; --fs-sm:10px; --fs-md:11px; --fs-lg:12px; --fs-xl:13px;
}
*{box-sizing:border-box}
body{margin:0;background:#07080b;color:var(--txt);font-family:var(--font-ko);font-size:var(--fs-md)}
button{font-family:inherit;background:none;border:none;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:22px}
h1{font-family:var(--font-ti);font-size:19px;margin:0 0 4px;color:#fff}
.lead{color:var(--txt-mute);font-size:var(--fs-lg);margin:0 0 20px;line-height:1.7}
.lead b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.cap{font-family:var(--font-ti);font-size:var(--fs-xl);color:#fff;margin:0 0 3px}
.cap i{font-style:normal;color:var(--neon)}
.note{color:var(--txt-mute);font-size:var(--fs-sm);line-height:1.6;margin:0 0 9px;min-height:46px}
.phone{width:320px;background:#0a0b0e;border:1px solid #23252b;border-radius:var(--r-bar);overflow:hidden}

/* ═══ 공용 컴포넌트 (앱 그대로) ═══ */
.hbmCard{display:flex;flex-direction:column;padding-bottom:12px;
  background:linear-gradient(180deg,#191919,#0e0e0e);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-bar)}
.hbmHead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;
  font-family:var(--font-ti);font-size:15px;letter-spacing:.6px;color:#ececec}
.hbmX{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#9a9a9a}
.hbmX svg{width:15px;height:15px}
.body{padding:0 12px}
.hint{font-size:var(--fs-sm);color:var(--txt-mute);line-height:1.6;padding:0 0 10px}
.hint b{color:var(--gold);font-family:var(--font-num)}
.actBtn{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;
  height:44px;padding:0 12px;cursor:pointer;overflow:hidden;
  font-family:var(--font-ti);font-size:var(--fs-xl);letter-spacing:.3px;color:#c6cdd6;
  border:1px solid var(--metal-edge);border-radius:var(--r-bar);
  background:linear-gradient(180deg,#24262b 0%,#15161a 46%,#0c0d10 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -6px 9px -6px #000,0 2px 4px -2px rgba(0,0,0,.7)}
.actBtn::after{content:'';position:absolute;left:8%;right:8%;bottom:1px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.actBtn.pri{color:#fff;border-color:rgba(255,59,59,.34)}
.actBtn.pri::after{background:linear-gradient(90deg,transparent,var(--neon),transparent);box-shadow:0 0 9px var(--neon)}
.actBtn:disabled{cursor:default;color:#5f6772;border-color:#2b2d33;
  background:linear-gradient(180deg,#131316,#0a0a0c);box-shadow:inset 0 3px 6px -4px #000}
.actBtn:disabled::after{background:linear-gradient(90deg,transparent,#33363c,transparent);box-shadow:none}
.actBtn.sm{height:34px;font-size:var(--fs-md);padding:0 10px}
.actBtn.xs{height:30px;font-size:var(--fs-md);padding:0 9px}

.rmList{display:flex;flex-direction:column;gap:7px}
.roomItem{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:9px 11px;cursor:pointer;
  border-radius:var(--r-bar);border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,#16171b,#0b0c0e);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.roomItem::after{content:'';position:absolute;left:8%;right:8%;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--dc,rgba(255,255,255,.3)),transparent);box-shadow:0 0 7px var(--dcGlow,transparent)}
.roomItem.locked{cursor:default;opacity:.5;box-shadow:inset 0 3px 6px -4px #000;
  background:linear-gradient(180deg,#131316,#0a0a0c);border-color:#2b2d33}
.roomItem.locked::after{background:linear-gradient(90deg,transparent,#33363c,transparent);box-shadow:none}
.riMain{min-width:0;flex:1}
.riName{font-size:var(--fs-xl);font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riSub{font-size:var(--fs-xs);color:var(--txt-mute);margin-top:2px;display:flex;align-items:center;gap:4px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}

/* 재화·티켓 아이콘 — 앱은 resIco() webp. 목업은 같은 크기의 대역 */
.ri{width:15px;height:15px;flex:none;display:inline-block;vertical-align:middle;border-radius:2px}
.ri.big{width:19px;height:19px}
.ri.min{background:linear-gradient(160deg,#8fdcff,#2f8fd0)}
.ri.gas{background:linear-gradient(160deg,#9dfba8,#2f9d4a)}
.ri.tg{background:linear-gradient(160deg,#ffd98a,#c08a1e)}
.ri.tp{background:linear-gradient(160deg,#8ff0e0,#1f9d8a)}
.ri.ta{background:linear-gradient(160deg,#d5a8ff,#7a3fc0)}
.ri.tr{background:linear-gradient(160deg,#b7a8ff,#5a3fc0)}

/* 🔑 열쇠 — 기존 에셋에 없다. 인라인 SVG 로 두고 나중에 ui_key.webp 로 교체(uiIco 폴백 규칙) */
.kIco{width:13px;height:13px;flex:none;display:block;fill:none;stroke:var(--gold);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.keyN{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-weight:700;font-size:var(--fs-lg);color:var(--gold)}
.keyN.dim{color:#5f6772}.keyN.dim .kIco{stroke:#5f6772}
.keyN s{text-decoration:none;color:#61666e;font-size:var(--fs-sm)}

/* 보상 아이콘 칸 — 왼쪽. 1개(뽑기권) / 2개(미네랄·가스) 둘 다 받는다 */
.rwSlot{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;
  border-radius:var(--r-bar);border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035)}
.rwSlot.lk{opacity:.45}
.rwSlot.plain{border:none;background:none;width:auto;height:auto}
.rwSlot.tall{width:34px;height:44px;flex-direction:column;gap:3px}
.rwSlot.lgc{width:44px;height:44px}

/* 단계 표기 */
.stg{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;color:#cfe0ec;line-height:1}
.stgBadge{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:var(--r-bar);
  border:1px solid rgba(255,255,255,.14);font-family:var(--font-num);font-weight:700;font-size:var(--fs-sm);color:#cfe0ec}
.stgBar{height:3px;border-radius:var(--r-bar);background:rgba(255,255,255,.07);overflow:hidden;margin:4px 0 3px}
.stgBar i{display:block;height:100%}
.sec{font-size:var(--fs-xs);font-weight:700;letter-spacing:.4px;color:#61666e;padding:9px 0 5px}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
</style></head><body><div class="wrap">
<h1>토벌 허브 — 행마다 액션 버튼, 8안</h1>
<p class="lead">
셋을 고정했다: <b>왼쪽 = 획득 재화 아이콘</b>(일반은 미네랄·가스 둘) · <b>던전마다 단계 표시</b> · <b>열쇠 아이콘 + 2/2 숫자</b>.<br>
바뀌는 것은 <b>배치</b>뿐 — 단계를 어디에 둘지, 열쇠를 어디에 둘지, 재화 칸을 얼마나 크게 볼지.<br>
버튼·행·팝업은 전부 공용(<code>.actBtn</code> · <code>.roomItem</code> · <code>.hbmCard</code>). 열쇠 아이콘만 아직 에셋이 없어 인라인 SVG다.
</p>
<div class="grid" id="g"></div>
</div>
<script>
const KEY='<svg class="kIco" viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="4.2"/><path d="M11.6 11.6 20 20M17 17l-2 2M20 20l1.4-1.4"/></svg>';
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"/></svg>';
const D=[
 {nm:'일반 토벌', rw:['min','gas'], sub:'미네랄·가스 대량', fl:12, key:2, kmax:2, dc:'rgba(255,255,255,.30)', amt:'1,956'},
 {nm:'장비 토벌', rw:['tg'],        sub:'장비 뽑기권',     fl:3,  key:1, kmax:2, dc:'rgba(255,210,74,.55)', amt:'1'},
 {nm:'펫 토벌',   rw:['tp'],        sub:'펫 뽑기권',       fl:0,  key:2, kmax:2, dc:'rgba(93,255,143,.5)',  amt:'1'},
 {nm:'동료 토벌', rw:['ta'],        sub:'동료 뽑기권',     fl:0,  lock:50, kmax:2, dc:'rgba(213,168,255,.5)',amt:'1'},
 {nm:'룬 토벌',   rw:['tr'],        sub:'룬 뽑기권',       fl:0,  lock:100,kmax:2, dc:'rgba(183,168,255,.5)',amt:'1'}
];
const ic=(d,cls)=>d.rw.map(k=>'<span class="ri '+(cls||'')+' '+k+'"></span>').join('');
const key=(d)=> d.lock? '' : '<span class="keyN'+(d.key?'':' dim')+'">'+KEY+'<span>'+d.key+'<s>/'+d.kmax+'</s></span></span>';
const stg=(d)=> d.lock? 'Lv.'+d.lock : (d.fl? d.fl+'단계' : '미개척');
const CAP=20;
const shell=i=>'<div class="phone"><div class="hbmCard"><div class="hbmHead"><b>토벌</b><span class="hbmX">'+X+'</span></div>'+i+'</div></div>';
const V=[];

/* A — 기본형: [재화칸] 이름/보상 · 단계 · 열쇠 · [버튼] */
V.push({t:'기본형 — 한 줄에 넷',
 n:'왼쪽 재화 칸 → 이름·보상 → 단계+열쇠 → 버튼. 가장 곧은 배치다. 오른쪽 블록이 2줄(단계 위, 열쇠 아래)이라 행이 68px.',
 h:'<div class="body"><div class="hint">열쇠는 <b>매일 09:00</b> 보충 · 완료할 때만 소모</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:68px">'
  +'<span class="rwSlot'+(d.lock?' lk':'')+'">'+ic(d)+'</span>'
  +'<div class="riMain"><div class="riName">'+d.nm+'</div><div class="riSub">'+d.sub+'</div></div>'
  +'<div class="rr"><span class="stg" style="font-size:15px">'+stg(d)+'</span>'+key(d)+'</div>'
  +'<button class="actBtn xs'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="flex:0 0 52px">'+(d.lock?'잠김':'입장')+'</button>'
  +'</div>').join('')+'</div></div>'});

/* B — 단계를 이름 옆 배지로, 오른쪽은 열쇠만 */
V.push({t:'단계는 이름 옆 배지',
 n:'단계를 이름 오른쪽 배지로 붙여 "무엇을 어디까지" 가 한 줄에 온다. 오른쪽에는 열쇠만 남아 행이 58px 로 낮아진다.',
 h:'<div class="body"><div class="hint">열쇠는 <b>매일 09:00</b> 보충 · 완료할 때만 소모</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:58px">'
  +'<span class="rwSlot'+(d.lock?' lk':'')+'">'+ic(d)+'</span>'
  +'<div class="riMain"><div class="riName">'+d.nm+' <span class="stgBadge">'+stg(d)+'</span></div>'
  +'<div class="riSub">'+d.sub+'</div></div>'
  +(d.lock?'':'<span class="keyN">'+KEY+'<span>'+d.key+'<s>/'+d.kmax+'</s></span></span>')
  +'<button class="actBtn xs'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="flex:0 0 52px">'+(d.lock?'잠김':'입장')+'</button>'
  +'</div>').join('')+'</div></div>'});

/* C — 재화 칸을 크게 + 이번에 받는 수량까지 */
V.push({t:'재화 칸 크게 + 수량',
 n:'재화 칸을 44px 로 키우고 그 아래 "이번에 받는 양"을 적는다. 고르는 이유가 보상이니 그걸 왼쪽 주역으로 세운다. 단계·열쇠는 오른쪽.',
 h:'<div class="body"><div class="hint">보상은 <b>단계가 깊을수록</b> 커진다</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:70px">'
  +'<div style="flex:none;text-align:center"><span class="rwSlot lgc'+(d.lock?' lk':'')+'">'+ic(d,'big')+'</span>'
  +'<div class="num" style="font-size:var(--fs-sm);color:'+(d.lock?'#5f6772':'#cfe0ec')+';margin-top:3px">'+(d.lock?'—':d.amt)+'</div></div>'
  +'<div class="riMain"><div class="riName">'+d.nm+'</div><div class="riSub">'+d.sub+'</div>'
  +'<div class="riSub" style="margin-top:4px">'+(d.lock?'':key(d))+'</div></div>'
  +'<div class="rr"><span class="stg" style="font-size:17px">'+(d.lock?'Lv.'+d.lock:(d.fl||'—'))+'</span>'
  +'<span style="font-size:var(--fs-xs);color:var(--txt-mute)">'+(d.lock?'잠김':'단계')+'</span>'
  +'<button class="actBtn xs'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="width:52px;margin-top:2px">'+(d.lock?'잠김':'입장')+'</button></div>'
  +'</div>').join('')+'</div></div>'});

/* D — 단계 진행 막대(상한 대비) */
V.push({t:'단계 + 진행 막대',
 n:'단계 숫자 아래 얇은 막대(3px)로 "레벨이 열어 준 상한 20 대비 어디까지" 를 보여 준다. 5종의 진도 차이가 숫자보다 빨리 읽힌다.',
 h:'<div class="body"><div class="hint">개방 <b>20</b>단계 · 열쇠 매일 09:00 보충</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:66px">'
  +'<span class="rwSlot'+(d.lock?' lk':'')+'">'+ic(d)+'</span>'
  +'<div class="riMain"><div class="riName">'+d.nm+'</div>'
  +'<div class="stgBar"><i style="width:'+(d.lock?0:Math.min(100,d.fl/CAP*100))+'%;background:'+d.dc.replace(/[\d.]+\)$/,'.9)')+'"></i></div>'
  +'<div class="riSub"><span class="num" style="color:#cfe0ec">'+stg(d)+'</span> · '+d.sub+'</div></div>'
  +(d.lock?'':'<span class="keyN">'+KEY+'<span>'+d.key+'<s>/'+d.kmax+'</s></span></span>')
  +'<button class="actBtn xs'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="flex:0 0 52px">'+(d.lock?'잠김':'입장')+'</button>'
  +'</div>').join('')+'</div></div>'});

/* E — 재화 칸 안에 열쇠까지 세로로 묶기 */
V.push({t:'왼쪽에 재화·열쇠 한 덩어리',
 n:'왼쪽 칸을 세로로 늘려 재화 위·열쇠 아래로 묶는다. "이 토벌의 조건과 대가" 가 한 덩어리로 읽히고 오른쪽은 단계와 버튼만 남는다.',
 h:'<div class="body"><div class="hint">열쇠는 <b>매일 09:00</b> 보충 · 완료할 때만 소모</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:64px">'
  +'<div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:4px">'
   +'<span class="rwSlot'+(d.lock?' lk':'')+'" style="width:36px;height:26px">'+ic(d)+'</span>'
   +(d.lock?'<span style="font-size:var(--fs-xs);color:#5f6772">잠김</span>'
           :'<span class="keyN" style="font-size:var(--fs-md)">'+KEY+'<span>'+d.key+'<s>/'+d.kmax+'</s></span></span>')+'</div>'
  +'<div class="riMain"><div class="riName">'+d.nm+'</div><div class="riSub">'+d.sub+'</div></div>'
  +'<span class="stg" style="font-size:16px">'+stg(d)+'</span>'
  +'<button class="actBtn xs'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="flex:0 0 52px">'+(d.lock?'잠김':'입장')+'</button>'
  +'</div>').join('')+'</div></div>'});

/* F — 자동/직접 두 버튼을 행에 */
V.push({t:'행에 자동·직접 두 버튼',
 n:'시트를 아예 없앤다 — 행에서 바로 자동/직접을 고른다. 탭이 가장 적다(1번). 대신 행이 76px 로 높고 버튼이 작아진다.',
 h:'<div class="body"><div class="hint">직접은 이동·카이팅으로 <b>클리어 확률</b>이 오른다</div><div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:76px">'
  +'<span class="rwSlot'+(d.lock?' lk':'')+'">'+ic(d)+'</span>'
  +'<div class="riMain"><div class="riName">'+d.nm+'</div>'
  +'<div class="riSub"><span class="num" style="color:#cfe0ec">'+stg(d)+'</span> · '+d.sub+'</div>'
  +'<div class="riSub" style="margin-top:4px">'+(d.lock?'':key(d))+'</div></div>'
  +'<div style="flex:none;display:flex;flex-direction:column;gap:5px">'
   +'<button class="actBtn"'+(d.lock?' disabled':'')+' style="height:28px;width:56px;font-size:var(--fs-md)">자동</button>'
   +'<button class="actBtn'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="height:28px;width:56px;font-size:var(--fs-md)">직접</button></div>'
  +'</div>').join('')+'</div></div>'});

/* G — 열림/잠김 두 구역 + 기본 행 */
V.push({t:'열림 / 잠김 두 구역',
 n:'잠긴 둘을 아래로 내리고 라벨로 가른다. 지금 갈 수 있는 셋이 위에 모여 훑기가 빠르다. 행 구조는 기본형(A)과 같다.',
 h:'<div class="body"><div class="hint">열쇠는 <b>매일 09:00</b> 보충 · 완료할 때만 소모</div>'
 +'<div class="sec">지금 갈 수 있는 곳</div><div class="rmList">'
 +D.filter(d=>!d.lock).map(d=>'<div class="roomItem" style="--dc:'+d.dc+';height:62px">'
  +'<span class="rwSlot">'+ic(d)+'</span>'
