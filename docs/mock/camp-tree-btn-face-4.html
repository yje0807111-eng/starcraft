<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>환생 트리 — ⑥ 왼쪽 색 띠, 안쪽 면 4안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'IBM Plex Sans KR',sans-serif;--font-num:'Rajdhani',sans-serif;
  --gold:#ffd24a;--r-bar:3px}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
h1{margin:20px 22px 2px;font-size:15px}
.note{margin:0 22px 8px;color:#8d97a6;font-size:11.5px;line-height:1.7;max-width:1300px}
.note b{color:#dfe5ee}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:14px 22px 40px;align-items:flex-start}
.cell{width:410px}
.cap{margin:0 0 5px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:#8d97a6;font-size:11px;line-height:1.65;min-height:62px}
.sub b{color:#cfd7e2}
.st{margin:9px 0 5px;font-size:10.5px;letter-spacing:.1em;color:#5f6a77}
.sheet{width:390px;padding:14px 14px 16px;border-top:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(9,12,18,.86),rgba(6,8,12,.985) 26%,#06080c)}
.ctRow{display:flex;align-items:center;gap:12px}
.ctIco{position:relative;flex:0 0 44px;width:44px;height:44px}
.ctIco svg{position:absolute;inset:0;width:44px;height:44px;display:block}
.ctIco img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:21px;height:21px;object-fit:contain}
.ctHt{flex:1;min-width:0;display:flex;flex-direction:row;align-items:baseline;gap:8px}
.ctNm{font-size:16px;font-weight:700;color:#fff;line-height:1.25}
.ctRom{font-family:var(--font-num);font-size:13px;font-weight:600;letter-spacing:.06em;color:#8b96a4}
.ctDesc{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);
  font-size:13px;line-height:1.7;color:#a7b2c0}
.ctDesc b{color:#f0f4f9;font-weight:700}
.was{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:#7b8593}
.to{margin:0 6px;color:#5b6674}

/* ══ ⑥ 왼쪽 색 띠 — 뼈대는 넷 다 같다. **안쪽 면만** 다르다 ══════════
   ⭐ 띠(4px)·테두리(.20)·글자·값 색은 어느 안에서도 안 바꾼다 — 비교할 것이 면 하나뿐이도록. */
.b{position:relative;width:100%;margin-top:14px;height:46px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px 0 22px;cursor:pointer;overflow:hidden;
  font-family:var(--font-ko);font-size:14px;font-weight:800;letter-spacing:.02em;color:#fff;
  border:1px solid rgba(255,255,255,.20);border-radius:var(--r-bar)}
.b::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.b .r{display:flex;align-items:baseline;gap:6px}
.b .n{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;
  color:var(--gold)}
.b .u{font-size:10.5px;letter-spacing:.12em;color:#8b96a4}
.b.off{color:#5f6772;border-color:rgba(255,255,255,.07)}
.b.off::before{background:rgba(255,255,255,.12)}
.b.off .n{color:#8a7a48} .b.off .u{color:#5f6772}
.b.off{background:rgba(255,255,255,.03)!important}

/* ⓪ 지금 정한 것 — 무채 면 6% */
.f0{background:rgba(255,255,255,.06)}
/* ① 옅은 금빛 한 겹 — 색만 아주 조금 */
.f1{background:rgba(255,210,74,.055)}
/* ② 띠에서 번진다 — 왼쪽만 금빛, 오른쪽으로 사라진다 */
.f2{background:linear-gradient(90deg,rgba(255,210,74,.13) 0%,rgba(255,210,74,.02) 38%,
  rgba(255,255,255,.05) 100%)}
/* ③ 위가 밝다 — 색은 안 넣고 **물성만**(세로 그라디언트) */
.f3{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.025))}
/* ④ ①+② — 옅은 금빛 바탕 + 띠에서 번짐 */
.f4{background:linear-gradient(90deg,rgba(255,210,74,.12) 0%,rgba(255,210,74,.05) 42%,
  rgba(255,210,74,.05) 100%)}
</style></head><body>
<h1>환생 트리 — ⑥ 왼쪽 색 띠, <span style="color:#8d97a6">안쪽 면만 4안</span></h1>
<p class="note">⑥ 의 뼈대는 그대로다 — <b>왼쪽 4px 금색 띠 · 테두리 .20 · 값은 오른쪽 끝</b>. 넷 다 <b>안쪽 면 하나만</b> 다르다(비교할 것이 하나뿐이도록).
지금 정한 것(⓪)은 면이 무채 6% 라 판 배경과 잘 안 갈린다는 지적이라, <b>아주 조금씩만</b> 올린 넷이다.
<br>⚠ 못 사는 상태에서는 넷 다 <b>같은 면</b>(무채 3%)으로 떨어진다 — 못 누르는 버튼이 색을 갖고 있으면 눌리는 것처럼 보인다.</p>
<div class="wrap" id="wrap"></div>
<script>
const ICO = '../../assets/icons/tree/';
const NAME = '광산 등급', KEY = 'mine', COST = '6,144', ROM = 'Ⅱ', COL = '#ffd24a';
const DESC = '미네랄을 얻는 모든 곳에서 <span class="was">1.5배</span><span class="to">→</span><b>2.5배</b> 늘어납니다.';
function hexPts(cx, cy, r){ const q = [];
  for(let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 90);
    q.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
  return q.join(' '); }
function icoBox(){
  const z = 44, c = z / 2, r = c - 1.5;
  return '<span class="ctIco"><svg viewBox="0 0 ' + z + ' ' + z + '">' +
    '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>' +
      '<stop offset=".42" stop-color="' + COL + '"/>' +
      '<stop offset="1" stop-color="' + COL + '" stop-opacity=".34"/></linearGradient>' +
    '<linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#1b2634"/><stop offset="1" stop-color="#06090e"/></linearGradient>' +
    '<radialGradient id="sb"><stop offset="0" stop-color="' + COL + '" stop-opacity=".22"/>' +
      '<stop offset="1" stop-color="' + COL + '" stop-opacity="0"/></radialGradient></defs>' +
    '<polygon points="' + hexPts(c, c, r) + '" fill="url(#sf)" stroke="url(#sg)" stroke-width="1.3" ' +
      'style="filter:drop-shadow(0 0 3px ' + COL + ')"/>' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + (r * .52).toFixed(1) + '" fill="url(#sb)"/>' +
    '<polygon points="' + hexPts(c, c, r - 1.2) + '" fill="none" stroke="#fff" stroke-width=".6" ' +
      'opacity=".16"/></svg><img src="' + ICO + KEY + '.webp" alt=""></span>'; }
function sheet(k, off){
  return '<div class="sheet"><div class="ctRow">' + icoBox() +
    '<div class="ctHt"><span class="ctNm">' + NAME + '</span><span class="ctRom">' + ROM + '</span></div></div>' +
    '<div class="ctDesc">' + DESC + '</div>' +
    '<div class="b ' + k + (off ? ' off' : '') + '"><span>' + (off ? '포인트 부족' : '해 금') + '</span>' +
    '<span class="r"><span class="n">' + COST + '</span><span class="u">point</span></span></div></div>'; }

const CASES = [
{ k:'f0', t:'지금 정한 것 (기준) — 무채 6%',
  d:'면이 <b>흰색 6%</b> 뿐이라 판 배경(거의 검정)과 잘 안 갈린다. 테두리와 띠만으로 버튼을 알아봐야 한다.' },
{ k:'f1', t:'① 옅은 금빛 한 겹 — 색만 아주 조금',
  d:'면을 <b>금색 5.5%</b> 로 바꾼다. 밝기는 지금과 거의 같은데 <b>색기가 생겨</b> 배경과 갈린다. 가장 작은 변화.' },
{ k:'f2', t:'② 띠에서 번진다 — 왼쪽만 금빛',
  d:'띠가 <b>안쪽으로 번지는</b> 가로 그라디언트(왼쪽 13% → 38% 지점에서 거의 사라짐). 띠와 면이 한 덩어리로 읽히고, 오른쪽 값 쪽은 무채라 값이 안 묻힌다.' },
{ k:'f3', t:'③ 위가 밝다 — 색은 안 넣고 물성만',
  d:'무채 그대로 두고 <b>세로 그라디언트</b>(위 11% → 아래 2.5%)만. 색을 하나도 안 더하면서 버튼이 「면을 가진 것」으로 보인다. 공용 버튼 규칙을 가장 덜 깬다.' },
{ k:'f4', t:'④ ①+② — 옅은 금빛 바탕 + 띠에서 번짐',
  d:'바탕은 금색 5% 로 깔고, 띠 쪽만 <b>12% 로 한 번 더</b> 밝힌다. 넷 중 가장 또렷하지만 여전히 채운 버튼(④안)보다 훨씬 조용하다.' },
];
document.getElementById('wrap').innerHTML = CASES.map(function(c, i){
  return '<div class="cell"><p class="cap"><i>' + i + '</i>' + c.t + '</p>' +
    '<p class="sub">' + c.d + '</p>' +
    '<p class="st">살 수 있을 때</p>' + sheet(c.k, 0) +
    '<p class="st">포인트가 모자랄 때</p>' + sheet(c.k, 1) + '</div>';
}).join('');
</script></body></html>
