<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>하단 시트 — 채도 × 무채틴트 3×3</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   문제: 판(.bp::before)이 --loadDim 뿐이라 위쪽이 거의 투명 → 바깥 화면(전장)과
         구분이 안 되고 「섹션」으로 안 읽힌다.
   ⛔ 해법을 「그냥 어둡게」로 가지 않는다(속이 탁해진다).
      경계 = **윗변 · 그림자 · 형태 · 색조**가 맡는다. 여덟 가지를 비교한다.
   ⚠ 속(칸)은 여덟 안 전부 그대로다.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --metal-edge:#3c3e46;
  --bpFace:linear-gradient(180deg,#0a0a0a,#000);
  --bpTile:radial-gradient(circle at 50% 34%,rgba(96,96,104,.32),#050505 82%);
  --r-bar:3px;
  --ca:var(--gold,#ffd24a); --caS:rgba(255,210,74,.5); --caL:#ffe9a8;
  --cgDim:#8a94a6; --cgMuted:#657085;
  --font-num:'DIN Alternate','Bahnschrift',system-ui,sans-serif;
  --loadDim:linear-gradient(180deg,rgba(4,6,11,.06) 0%,rgba(4,6,11,.10) 40%,
    rgba(5,6,10,.62) 74%,rgba(5,6,10,.96) 100%);
  --ch:7px;
}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#141416;color:#e6eefc;
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  display:grid;grid-template-columns:repeat(3,390px);gap:14px;justify-content:start}
.col{width:390px}
.hd{font-size:12.5px;font-weight:800;color:#fff;margin:0 0 3px}
.hd em{font-style:normal;color:#ffd08a}
.hd.base{color:#c9cfd8}
.sub{font-size:10.5px;line-height:1.5;color:#98a0ad;margin:0 0 8px;min-height:28px}
.sub b{color:#dfe6f0}


/* ══════════════════════════════════════════════════════════════════
   두 축을 같이 쓴 조합 3×3.
     가로 = backdrop-filter 의 **채도**(뒤 배경에서 색을 얼마나 뺄까)
     세로 = 판에 얹는 **무채 틴트**(배경과 무관하게 얼마나 앉힐까)
   ⚠ 채도만 쓰면 **이미 채도가 낮은 배경**(우주)에서는 할 일이 없어 안 갈린다.
      무채 틴트는 배경과 무관하게 먹는다 — 그래서 둘을 같이 쓴다.
   ⚠ 무대를 반으로 갈랐다: **왼쪽 = 캠프 초록 지형 / 오른쪽 = 유즈맵 우주**.
   ══════════════════════════════════════════════════════════════════ */
.stage{position:relative;padding:112px 0 0;border-radius:5px;overflow:hidden;background:#0a0c12}
.half{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
.half.l{left:0;background:
  radial-gradient(ellipse at 40% 26%,rgba(190,205,130,.55),transparent 52%),
  repeating-linear-gradient(58deg,rgba(0,0,0,.05) 0 6px,transparent 6px 22px),
  linear-gradient(180deg,#6f7f45 0%,#5d6f3c 34%,#4c5c33 62%,#3d4b2b 100%)}
.half.r{right:0;background:
  radial-gradient(circle at 22% 30%,rgba(120,150,220,.22),transparent 46%),
  radial-gradient(circle at 74% 62%,rgba(180,120,220,.18),transparent 42%),
  radial-gradient(1.6px 1.6px at 18% 22%,#fff,transparent 100%),
  radial-gradient(1.4px 1.4px at 62% 14%,#dfe8ff,transparent 100%),
  radial-gradient(1.8px 1.8px at 38% 58%,#fff,transparent 100%),
  radial-gradient(1.3px 1.3px at 84% 34%,#cfe0ff,transparent 100%),
  linear-gradient(180deg,#0d1424 0%,#0a1020 50%,#070b16 100%)}
.half.l::after{content:'초록 지형';position:absolute;left:7px;top:5px;font:800 9px/1 sans-serif;
  color:rgba(255,255,255,.66);text-shadow:0 1px 3px #000}
.half.r::after{content:'우주';position:absolute;right:7px;top:5px;font:800 9px/1 sans-serif;
  color:rgba(255,255,255,.66);text-shadow:0 1px 3px #000}
.bot{position:relative;z-index:2;padding:10px 12px 0}
.bot::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent) top/100% 1px no-repeat,
             var(--loadDim), var(--tint);
  backdrop-filter:saturate(var(--sat)) brightness(.92);
  clip-path:polygon(var(--ch) 0,calc(100% - var(--ch)) 0,100% var(--ch),100% 100%,0 100%,0 var(--ch))}
.sA{--sat:.60} .sB{--sat:.45} .sC{--sat:.30}
.n1{--tint:linear-gradient(180deg,rgba(26,28,32,.22),rgba(16,18,21,.14))}
.n2{--tint:linear-gradient(180deg,rgba(26,28,32,.38),rgba(16,18,21,.26))}
.n3{--tint:linear-gradient(180deg,rgba(26,28,32,.54),rgba(16,18,21,.38))}
.axis{font-size:11.5px;font-weight:800;color:#ffd08a;margin:0 0 4px}
/* ══ 프로필(캠프 건물 프로필과 같은 구성) ══ */
.cmdG{position:relative;height:150px;display:grid;grid-template-columns:1fr auto;
  grid-template-rows:auto minmax(0,1fr);column-gap:9px}
.cgHead{grid-area:1/1;align-self:center;display:flex;align-items:center;gap:9px;padding:2px 2px 7px;position:relative}
.cgHead::after{content:'';position:absolute;left:2px;right:6px;bottom:0;height:1px;
  background:linear-gradient(90deg,var(--caS),transparent 72%)}
.cgN{font-size:15px;font-weight:800;color:#fff;line-height:1.1}
.cgHpsh{font-family:var(--font-num);font-weight:800;font-size:12.5px;color:#7ee081}
.cgHpsh .stAb{font-style:normal;font-size:8.5px;opacity:.7;margin-right:2px;vertical-align:1px}
.cgTray{grid-area:1/2;align-self:center;display:flex;gap:3px}
.cgBtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  color:#ececec;font:800 13px/1 var(--font-num);border:1px solid rgba(255,59,59,.30);
  background:var(--bpFace);border-radius:var(--r-bar);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.cgBtn.wide{width:61px}
.cgBody{grid-area:2/1/3/3;display:flex;gap:8px;align-items:stretch;min-height:0}
.cgInfo{flex:0 0 31%;max-width:158px;display:flex;flex-direction:column;gap:3px;padding:6px 8px;
  background:var(--bpFace);border:1px solid var(--metal-edge);border-radius:var(--r-bar)}
.cgEb{font:800 8px/1 sans-serif;letter-spacing:1px;color:var(--cgMuted)}
.cgDd{font-size:9.5px;color:var(--cgDim)}
.cgGrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cgSlot{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px 5px;border:1px solid var(--metal-edge);border-radius:var(--r-bar);background:var(--bpFace);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cgSlot.empty{border-style:dashed;border-color:rgba(255,255,255,.10)}
.cgSlot.dim .cgPro,.cgSlot.dim .cgName,.cgSlot.dim .cgSub{opacity:.42}
.cgPro{width:100%;aspect-ratio:1;flex:0 1 auto;min-height:0;border:1px solid var(--caS);border-radius:2px;
  background:var(--bpTile);display:flex;align-items:center;justify-content:center;font-size:18px}
.cgName{font:800 10px/1.3 sans-serif;color:#e6eefc;text-align:center}
.cgSub{font:800 7px/1 var(--font-num);color:var(--caL);text-align:center}

/* ══ 하단 네비바 ══ */
.navBar{position:relative;height:42px;margin:6px -12px 0;padding:0 6px;display:flex;align-items:center}
.navIt{position:relative;flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:5px;height:44px;
  font-size:10px;font-weight:700;color:#8b939f;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.navIt .ic{width:16px;height:16px}
.navIt.on{color:#fff}
.navIt.on::after{content:'';position:absolute;left:11%;right:11%;bottom:1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.62) 50%,transparent 92%),
    linear-gradient(90deg,transparent,rgba(255,59,59,.92),transparent);
  box-shadow:0 0 2px rgba(255,59,59,.6),0 0 5px rgba(255,59,59,.24)}


</style></head><body>

<template id="prof">
  <div class="cmdG">
    <div class="cgHead"><span class="cgN">본부</span>
      <span class="cgHpsh"><i class="stAb">H</i>1500</span></div>
    <div class="cgTray"><div class="cgBtn wide">− 1 +</div><div class="cgBtn">▶</div><div class="cgBtn">⬆</div></div>
    <div class="cgBody">
      <div class="cgInfo"><div class="cgEb">생산</div><div class="cgDd">생산 대기</div></div>
      <div class="cgGrid">
        <div class="cgSlot"><div class="cgPro">🔧</div><div class="cgName">정비공</div><div class="cgSub">50</div></div>
        <div class="cgSlot empty"></div>
        <div class="cgSlot dim"><div class="cgPro">📡</div><div class="cgName">통신소</div><div class="cgSub">50</div></div>
        <div class="cgSlot dim"><div class="cgPro">☢</div><div class="cgName">핵 격납고</div><div class="cgSub">50</div></div>
      </div>
    </div>
  </div>
  <div class="navBar">
    <div class="navIt on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg>캐릭터</div>
    <div class="navIt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 8h16v11H4zM9 8V6a3 3 0 0 1 6 0v2"/></svg>정비</div>
    <div class="navIt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/></svg>유즈맵</div>
    <div class="navIt"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9h16v11H4zM8 9V7a4 4 0 0 1 8 0v2"/></svg>상점</div>
  </div>
</template>

<div class="col n1 sA"><p class="axis">틴트 <b>약</b> .22 · 채도 <b>.60</b></p>
  <p class="sub">가장 가볍다 — 초록에선 갈리지만 <b>우주에선 거의 안 보인다</b>.</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n1 sB"><p class="axis">틴트 <b>약</b> .22 · 채도 <b>.45</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n1 sC"><p class="axis">틴트 <b>약</b> .22 · 채도 <b>.30</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n2 sA"><p class="axis">틴트 <b>중</b> .38 · 채도 <b>.60</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n2 sB"><p class="axis">틴트 <b>중</b> .38 · 채도 <b>.45</b></p>
  <p class="sub"><b>V4 가 여기다.</b> 두 배경 모두에서 무난하게 갈린다.</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n2 sC"><p class="axis">틴트 <b>중</b> .38 · 채도 <b>.30</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n3 sA"><p class="axis">틴트 <b>강</b> .54 · 채도 <b>.60</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n3 sB"><p class="axis">틴트 <b>강</b> .54 · 채도 <b>.45</b></p>
  <p class="sub">&nbsp;</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<div class="col n3 sC"><p class="axis">틴트 <b>강</b> .54 · 채도 <b>.30</b></p>
  <p class="sub">가장 세다 — 우주에서도 확실하지만 속이 그만큼 어두워진다.</p>
  <div class="stage"><i class="half l"></i><i class="half r"></i><div class="bot" data-fill></div></div></div>

<script>
const t=document.getElementById('prof');
document.querySelectorAll('[data-fill]').forEach(h=>h.appendChild(t.content.cloneNode(true)));
</script>
</body></html>
