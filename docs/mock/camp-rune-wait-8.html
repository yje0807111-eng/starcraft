<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>룬 판 — 교체 대기 모션 8안 (움직입니다)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{ --font-ti:'IBM Plex Sans KR',sans-serif; --font-ko:'IBM Plex Sans KR',sans-serif;
  --font-num:'Rajdhani',sans-serif; --r-bar:3px; --r-md:6px; --r-lg:9px;
  --gold:#ffd24a; --metal-edge:rgba(150,170,200,.22);
  --txt:#e6ecf4; --txt-dim:#c3ccd8; --txt-mute:#8d97a6; --txt-off:#69737f; }
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:var(--txt);font-family:var(--font-ko);font-size:12px}
h1{font-size:15px;margin:20px 22px 4px;font-family:var(--font-ti);font-weight:700}
h1 + p{margin:0 22px 10px;color:var(--txt-mute);font-size:11.5px;line-height:1.7;max-width:1240px}
h1 + p b{color:var(--txt-dim)}
.wrap{display:flex;flex-wrap:wrap;gap:18px;padding:12px 22px 30px;align-items:flex-start}
.cell{width:290px}
.cap{margin:0 0 4px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:var(--txt-mute);font-size:11px;line-height:1.6;min-height:74px}
.sub em{font-style:normal;color:#8fe6b0}
.sub s{text-decoration:none;color:#ffb0b0}
.pane{position:relative;width:290px;height:250px;overflow:hidden;border:1px solid var(--metal-edge);
  border-radius:var(--r-md);background:#080b10}
.pane::before{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 30%,#141d27,#080b10 72%)}
.pane svg{position:relative;display:block;width:100%;height:100%}
.tag{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:var(--txt-off);font-family:var(--font-num)}

/* ── 공통 ── */
.cellG{transform-box:view-box}
.dim{opacity:.30}

/* ① 흔들림(지금) */
@keyframes wig{ 0%,100%{transform:rotate(-2.4deg)} 50%{transform:rotate(2.4deg)} }
.m1 .cand{animation:wig .44s ease-in-out infinite}
/* ② 숨쉬기 */
@keyframes breathe{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.075)} }
.m2 .cand{animation:breathe 1.15s ease-in-out infinite}
/* ③ 파도 바운스 */
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4.5px)} }
.m3 .cand{animation:bob .9s ease-in-out infinite}
/* ④ 테두리 맥동 — 크기는 그대로, 테두리만 밝아진다 */
@keyframes edge{ 0%,100%{stroke-opacity:.34} 50%{stroke-opacity:1} }
.m4 .cand .hx{animation:edge 1.05s ease-in-out infinite}
/* ⑤ 흐르는 점선 — 「고를 수 있음」의 오래된 관용구 */
@keyframes ants{ to{stroke-dashoffset:-24} }
.m5 .cand .ants{animation:ants 1.1s linear infinite}
/* ⑥ 고리가 주기적으로 퍼진다 */
@keyframes pulseRing{ 0%{transform:scale(1);opacity:.7} 70%{opacity:0} 100%{transform:scale(1.7);opacity:0} }
.m6 .cand .ring{transform-box:view-box;animation:pulseRing 1.5s cubic-bezier(.2,.7,.3,1) infinite}
/* ⑦ 떠오름 — 한 번 뜬 뒤 아주 느리게 숨쉰다 */
@keyframes lift{ 0%{transform:translateY(0) scale(1)} 100%{transform:translateY(-3px) scale(1.04)} }
@keyframes liftB{ 0%,100%{transform:translateY(-3px) scale(1.04)} 50%{transform:translateY(-3px) scale(1.065)} }
.m7 .cand{animation:lift .22s ease-out forwards, liftB 1.6s ease-in-out .22s infinite}
/* ⑧ 빛 훑기 — 칸 위로 광택이 지나간다 */
@keyframes sweep{ 0%{transform:translateX(-46px)} 55%,100%{transform:translateX(46px)} }
.m8 .cand .shine{animation:sweep 1.6s ease-in-out infinite}
</style></head><body>

<h1>룬 판 — <b>교체 대기</b> 모션 8안 <span style="color:#8fe6b0;font-size:12px">· 이 파일을 열면 실제로 움직입니다</span></h1>
<p>지금은 <b>흔들림</b>(①)이다. 「바꿀 수 있는 칸」을 말하는 다른 방법 일곱을 나란히 놓았다.
⚠ 이 판의 제약 셋: <b>칸이 여덟</b>(한꺼번에 움직인다) · <b>배경이 어두운 사진</b>(작은 밝기 변화는 묻힌다) ·
<b>blur 필터 금지</b>(트리에서 팬·줌 38→23 프레임 실측). 그래서 <em>변형(transform)</em>은 싸고
<s>filter·그림자</s>는 비싸다 — 여덟 안 모두 transform 과 stroke 만 쓴다.
각 판의 <b>가운데</b>는 못 고르는 칸(물림), <b>둘레 여섯</b>이 후보다.</p>
<div class="wrap" id="wrap"></div>

<script>
var R = 26, CX = 145, CY = 118, RING = 74;
function hexPts(x,y,r){ var q=[]; for(var i=0;i<6;i++){ var a=Math.PI/180*(60*i-90);
  q.push((x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1)); } return q.join(' '); }
function pos(j){ var a=-Math.PI/2+j/6*Math.PI*2; return [CX+Math.cos(a)*RING, CY+Math.sin(a)*RING]; }
var GLY = ['tap','gas','mine','reb','atk','hp'];
var GD  = ['high','mid','low','high','mid','low'];
var COL = { low:'#9aa4b0', mid:'#5cd6ff', high:'#ffcf6b' };

var DEFS = '<defs>'
 + '<linearGradient id="face" x1="0" y1="0" x2="0" y2="1">'
 + '<stop offset="0" stop-color="#1b2634"/><stop offset="1" stop-color="#06090e"/></linearGradient>';
['low','mid','high'].forEach(function(g){ var c = COL[g];
  DEFS += '<linearGradient id="e' + g + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#fff" stop-opacity=".92"/>'
    + '<stop offset=".42" stop-color="' + c + '"/>'
    + '<stop offset="1" stop-color="' + c + '" stop-opacity=".34"/></linearGradient>'
    + '<radialGradient id="b' + g + '"><stop offset="0" stop-color="' + c + '" stop-opacity=".22"/>'
    + '<stop offset=".62" stop-color="' + c + '" stop-opacity=".07"/>'
    + '<stop offset="1" stop-color="' + c + '" stop-opacity="0"/></radialGradient>'; });
DEFS += '<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">'
  + '<stop offset="0" stop-color="#fff" stop-opacity="0"/>'
  + '<stop offset=".5" stop-color="#fff" stop-opacity=".30"/>'
  + '<stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'
  + '<clipPath id="clipHex"><polygon points="' + hexPts(0,0,R) + '"/></clipPath>'
  + '</defs>';

/* 칸 하나 — 지금 화면과 같은 켜(면·테두리·뒷광·안쪽 실선·문양) */
function cell(x, y, gd, gly, extra){
  var c = COL[gd];
  return '<polygon points="' + hexPts(x,y,R) + '" fill="#000" opacity=".55"/>'
   + '<polygon class="hx" points="' + hexPts(x,y,R*0.93) + '" fill="url(#face)"'
   + ' stroke="url(#e' + gd + ')" stroke-width="1.3"/>'
   + '<circle cx="' + x + '" cy="' + y + '" r="' + (R*0.72).toFixed(1) + '" fill="url(#b' + gd + ')"/>'
   + '<polygon points="' + hexPts(x,y,R-1.9) + '" fill="none" stroke="#fff" stroke-width=".6" opacity=".16"/>'
   + '<image href="../../assets/icons/rune/glyph/' + gly + '.webp" x="' + (x-R*0.5).toFixed(1)
   + '" y="' + (y-R*0.5).toFixed(1) + '" width="' + R + '" height="' + R + '"/>'
   + (extra || ''); }

/* 안마다 칸에 얹는 여분 조각 */
var EXTRA = {
  5: function(x,y,gd){ return '<polygon class="ants" points="' + hexPts(x,y,R+3.2) + '" fill="none"'
      + ' stroke="' + COL[gd] + '" stroke-width="1.1" stroke-opacity=".75" stroke-dasharray="5 3"/>'; },
  6: function(x,y,gd){ return '<polygon class="ring" points="' + hexPts(x,y,R) + '" fill="none"'
      + ' stroke="' + COL[gd] + '" stroke-width="1.3"'
      + ' style="transform-origin:' + x + 'px ' + y + 'px"/>'; },
  8: function(x,y){ return '<g clip-path="url(#clipHex)" transform="translate(' + x + ',' + y + ')">'
      + '<rect class="shine" x="-9" y="' + (-R-4) + '" width="18" height="' + (R*2+8)
      + '" fill="url(#shine)" transform="rotate(14)"/></g>'; }
};

function board(n){
  var s = DEFS;
  /* 가운데 = 못 고르는 칸 */
  s += '<g class="cellG dim">' + cell(CX, CY, 'high', 'speed') + '</g>';
  for(var j = 0; j < 6; j++){
    var p = pos(j), gd = GD[j];
    var ex = EXTRA[n] ? EXTRA[n](p[0], p[1], gd) : '';
    /* 위상을 조금씩 어긋내면 한 몸처럼 굳지 않는다 */
    s += '<g class="cellG cand" style="transform-origin:' + p[0].toFixed(1) + 'px ' + p[1].toFixed(1)
      + 'px;animation-delay:' + (j * 62) + 'ms,' + (j * 62 + 220) + 'ms">'
      + cell(p[0], p[1], gd, GLY[j], ex) + '</g>'; }
  return s; }

var CASES = [
{ t:'흔들림 (지금)', d:'좌우로 ±2.4° 회전. <b>눈에 잘 띄지만</b> 여덟이 동시에 떨면 판이 어수선하고, 「고르라」보다 <b>「잘못됐다」</b>에 가까운 몸짓이다.' },
{ t:'숨쉬기', d:'크기만 1 ↔ 1.075 로 느리게. 모바일 게임에서 <b>가장 흔한 대기 모션</b>이다 — 조용하고, 칸이 많아도 안 시끄럽다. <em>싸다</em>(transform 하나).' },
{ t:'파도 바운스', d:'위아래로 4.5px, 칸마다 지연을 줘 <b>파도처럼</b> 흐른다. 활기차고 「만질 수 있다」가 잘 읽힌다. 다만 칸 사이 간격이 좁으면 겹쳐 보인다.' },
{ t:'테두리 맥동', d:'크기는 그대로 두고 <b>테두리 밝기만</b> 오르내린다. 가장 조용하다. ⚠ 배경이 어두운 사진이라 <b>멀리서는 약하게</b> 보일 수 있다.' },
{ t:'흐르는 점선', d:'칸 둘레의 점선이 <b>돈다</b>(marching ants). 「고를 수 있음」의 오래된 관용구라 뜻이 바로 읽힌다. 움직임이 칸 <b>바깥</b>이라 문양을 안 건드린다.' },
{ t:'퍼지는 고리', d:'칸에서 고리가 <b>주기적으로</b> 퍼진다. 도착 연출(.rnRipple)과 같은 어휘라 판이 한 문법이 된다. ⚠ 옆 칸까지 번지므로 여덟이면 다소 붐빈다.' },
{ t:'떠오름 + 숨', d:'교체에 들어가면 후보가 <b>한 번 떠오르고</b>(0.22초) 그 자리에서 아주 느리게 숨쉰다. <b>「집어 든 상태」</b>가 분명해 카드 게임에서 많이 쓴다.' },
{ t:'빛 훑기', d:'칸 위로 <b>광택이 지나간다</b>. 화려하고 「반응한다」가 강하다. ⚠ 여덟이 각자 훑으면 번쩍임이 잦다 — 주기를 길게(1.6초) 뒀다.' },
];

document.getElementById('wrap').innerHTML = CASES.map(function(c, i){
  return '<div class="cell"><p class="cap"><i>' + (i+1) + '</i>' + c.t + '</p>'
   + '<p class="sub">' + c.d + '</p>'
   + '<div class="pane m' + (i+1) + '"><svg viewBox="0 0 290 250">' + board(i+1) + '</svg>'
   + '<span class="tag">둘레 6 = 후보 · 가운데 = 물림</span></div></div>'; }).join('');
</script></body></html>
