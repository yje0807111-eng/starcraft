<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>토벌 허브 — C안 4변형</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;--font-ti:'Jua','Apple SD Gothic Neo',sans-serif;
 --font-num:'Rajdhani','Noto Sans KR',sans-serif;--neon:#ff3b3b;--metal-edge:#3c3e46;
 --txt:#e0dcdc;--txt-mute:#9aa0a8;--gold:#ffd24a;--r-bar:3px;
 --fs-xs:9.5px;--fs-sm:10px;--fs-md:11px;--fs-lg:12px;--fs-xl:13px}
*{box-sizing:border-box}
body{margin:0;background:#07080b;color:var(--txt);font-family:var(--font-ko);font-size:var(--fs-md)}
button{font-family:inherit;background:none;border:none;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:22px}
h1{font-family:var(--font-ti);font-size:19px;margin:0 0 4px;color:#fff}
.lead{color:var(--txt-mute);font-size:var(--fs-lg);margin:0 0 20px;line-height:1.7}
.lead b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.cap{font-family:var(--font-ti);font-size:var(--fs-xl);color:#fff;margin:0 0 3px}
.cap i{font-style:normal;color:var(--neon)}
.note{color:var(--txt-mute);font-size:var(--fs-sm);line-height:1.6;margin:0 0 9px;min-height:60px}
.phone{width:320px;background:#0a0b0e;border:1px solid #23252b;border-radius:var(--r-bar);overflow:hidden}
.hbmCard{display:flex;flex-direction:column;padding-bottom:12px;background:linear-gradient(180deg,#191919,#0e0e0e);
 border:1px solid rgba(255,255,255,.07);border-radius:var(--r-bar)}
.hbmHead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;
 font-family:var(--font-ti);font-size:15px;letter-spacing:.6px;color:#ececec}
.hbmX{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#9a9a9a}
.hbmX svg{width:15px;height:15px}
.body{padding:0 12px}
.hint{font-size:var(--fs-sm);color:var(--txt-mute);line-height:1.6;padding:0 0 10px}
.hint b{color:var(--gold);font-family:var(--font-num)}
.actBtn{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;height:44px;padding:0 10px;
 cursor:pointer;overflow:hidden;font-family:var(--font-ti);font-size:var(--fs-xl);letter-spacing:.3px;color:#c6cdd6;
 border:1px solid var(--metal-edge);border-radius:var(--r-bar);
 background:linear-gradient(180deg,#24262b 0%,#15161a 46%,#0c0d10 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 -6px 9px -6px #000,0 2px 4px -2px rgba(0,0,0,.7)}
.actBtn::after{content:'';position:absolute;left:8%;right:8%;bottom:1px;height:2px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
.actBtn.pri{color:#fff;border-color:rgba(255,59,59,.34)}
.actBtn.pri::after{background:linear-gradient(90deg,transparent,var(--neon),transparent);box-shadow:0 0 9px var(--neon)}
.actBtn:disabled{cursor:default;color:#5f6772;border-color:#2b2d33;
 background:linear-gradient(180deg,#131316,#0a0a0c);box-shadow:inset 0 3px 6px -4px #000}
.actBtn:disabled::after{background:linear-gradient(90deg,transparent,#33363c,transparent);box-shadow:none}
.actBtn.tiny{height:24px;font-size:var(--fs-sm);padding:0 7px}
.actBtn.two{height:38px;flex-direction:column;gap:1px;padding:0 3px;justify-content:center}
.actBtn.two b{font-size:var(--fs-md);line-height:1}
.actBtn.two em{font-style:normal;font-family:var(--font-num);font-variant-numeric:tabular-nums;
 font-size:8px;font-weight:700;opacity:.8;display:flex;align-items:center;gap:2px;line-height:1}
.rmList{display:flex;flex-direction:column;gap:7px}
.roomItem{position:relative;overflow:hidden;display:flex;align-items:center;gap:7px;padding:8px 8px;cursor:pointer;
 border-radius:var(--r-bar);border:1px solid rgba(255,255,255,.07);
 background:linear-gradient(180deg,#16171b,#0b0c0e);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.roomItem::after{content:'';position:absolute;left:8%;right:8%;bottom:0;height:2px;
 background:linear-gradient(90deg,transparent,var(--dc,rgba(255,255,255,.3)),transparent);box-shadow:0 0 7px var(--dcGlow,transparent)}
.roomItem.locked{cursor:default;opacity:.5;box-shadow:inset 0 3px 6px -4px #000;
 background:linear-gradient(180deg,#131316,#0a0a0c);border-color:#2b2d33}
.roomItem.locked::after{background:linear-gradient(90deg,transparent,#33363c,transparent);box-shadow:none}
.riMain{min-width:0;flex:1}
.riName{font-size:var(--fs-xl);font-weight:700;color:var(--txt);display:flex;align-items:center;gap:5px;min-width:0}
.riName>u{text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700}
/* 재화 아이콘 — 앱은 resIco() webp */
.ri{width:11px;height:11px;flex:none;display:inline-block;vertical-align:middle;border-radius:2px}
.ri.min{background:linear-gradient(160deg,#8fdcff,#2f8fd0)}
.ri.gas{background:linear-gradient(160deg,#9dfba8,#2f9d4a)}
.ri.tg{background:linear-gradient(160deg,#ffd98a,#c08a1e)}
.ri.tp{background:linear-gradient(160deg,#8ff0e0,#1f9d8a)}
.ri.ta{background:linear-gradient(160deg,#d5a8ff,#7a3fc0)}
.ri.tr{background:linear-gradient(160deg,#b7a8ff,#5a3fc0)}
/* 🗡 던전 아이콘 — 앱에선 assets/icons/dungeons/ 를 먼저 찾아 쓴다(없으면 이 자리로 폴백) */
.dgIco{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;
 border-radius:var(--r-bar);border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035)}
.dgIco.lk{opacity:.45}
.kIco{width:12px;height:12px;flex:none;display:block;fill:none;stroke:var(--gold);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.keyN{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-num);font-variant-numeric:tabular-nums;
 font-weight:700;font-size:var(--fs-lg);color:var(--gold);flex:none}
.keyN s{text-decoration:none;color:#61666e;font-size:var(--fs-sm)}
.stgBadge{display:inline-flex;align-items:center;padding:1px 5px;border-radius:var(--r-bar);
 border:1px solid rgba(255,255,255,.14);font-family:var(--font-num);font-weight:700;font-size:var(--fs-sm);color:#cfe0ec;flex:none}
/* 버튼 밑 보상 줄 */
.bl{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:3px}
.bl span{display:flex;align-items:center;gap:3px;font-family:var(--font-num);font-variant-numeric:tabular-nums;
 font-size:8.5px;font-weight:700;color:#96a0ab;line-height:1.1}
.bl.row{flex-direction:row;gap:5px}
.blDim span{color:#4e535a}
.btnW{flex:none;display:flex;flex-direction:column;align-items:center}
.sideVal{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.sideVal span{display:flex;align-items:center;gap:3px;font-family:var(--font-num);font-variant-numeric:tabular-nums;
 font-size:8.5px;font-weight:700;color:#96a0ab;line-height:1.1}
.sideVal.row{flex-direction:row;align-items:center;gap:4px;min-width:0}
.sideVal.row b{font-family:var(--font-ko);font-size:8px;font-weight:700;color:#61666e;flex:none}
.btnCol2{flex:none;display:flex;flex-direction:column;gap:4px}
</style></head><body><div class="wrap">
<h1>토벌 허브 — C안 4변형</h1>
<p class="lead">
왼쪽은 <b>던전 아이콘</b>(앱에선 <code>assets/icons/dungeons/</code> 를 먼저 찾아 쓴다 — 지금은 자리만).<br>
<b>재화 아이콘은 소탕·입장 버튼 아래 수치 앞</b>에 각각 붙였다.
갈리는 것은 <b>일반 토벌의 미네랄·가스 두 값을 어떻게 앉히느냐</b> — 나머지 넷은 값이 하나뿐이라 어느 안에서도 같다.<br>
수치는 실제 공식 그대로: 소탕은 이미 깬 최고 단계, 입장은 다음 단계라 한 칸 낮다. 펫은 깬 단계가 없어 소탕이 잠긴다.
</p>
<div class="grid" id="g"></div></div>
<script>
const KEY='<svg class="kIco" viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="4.2"/><path d="M11.6 11.6 20 20M17 17l-2 2M20 20l1.4-1.4"/></svg>';
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"/></svg>';
const D=[
 {nm:'일반 토벌',ic:'⚔️',fl:12,key:2,dc:'rgba(255,255,255,.30)',canSwp:1,
  swp:[['min','1,824'],['gas','638']], ent:[['min','1,956'],['gas','685']]},
 {nm:'장비 토벌',ic:'🛡️',fl:3,key:1,dc:'rgba(255,210,74,.55)',canSwp:1,
  swp:[['min','106'],['tg','1']], ent:[['min','128'],['tg','1']]},
 {nm:'펫 토벌',ic:'🐾',fl:0,key:2,dc:'rgba(93,255,143,.5)',canSwp:0,
  swp:[], ent:[['min','62'],['tp','1']]},
 {nm:'동료 토벌',ic:'🤝',fl:0,lock:50,dc:'rgba(213,168,255,.5)',canSwp:0,swp:[],ent:[]},
 {nm:'룬 토벌',ic:'🔮',fl:0,lock:100,dc:'rgba(183,168,255,.5)',canSwp:0,swp:[],ent:[]}
];
const NM=n=>'<u>'+n+'</u>';
const stg=d=>d.lock?'Lv.'+d.lock:(d.fl?d.fl+'단계':'미개척');
const key=d=>d.lock?'':'<span class="keyN">'+KEY+'<span>'+d.key+'<s>/2</s></span></span>';
const vals=(a,cls)=>a.length? a.map(v=>'<span><i class="ri '+v[0]+'"></i>'+v[1]+'</span>').join('')
                            : '<span>—</span>';
const shell=i=>'<div class="phone"><div class="hbmCard"><div class="hbmHead"><b>토벌</b><span class="hbmX">'+X+'</span></div>'+i+'</div></div>';
const HINT='<div class="hint">열쇠는 <b>매일 09:00</b> 보충 · 완료할 때만 소모</div>';
const V=[];

/* C1 — 버튼 아래 세로 2줄 */
V.push({t:'C1 · 버튼 아래 세로 2줄',
 n:'재화 값을 버튼 밑에 한 줄씩 쌓는다. 일반 토벌만 2줄이 되고 나머지는 1줄이라 행 높이는 가장 큰 쪽(2줄)에 맞춘다. 값이 세로로 정렬돼 소탕↔입장 비교가 자리로 맞아떨어진다.',
 h:'<div class="body">'+HINT+'<div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:76px">'
  +'<span class="dgIco'+(d.lock?' lk':'')+'">'+d.ic+'</span>'
  +'<div class="riMain"><div class="riName">'+NM(d.nm)+'<span class="stgBadge">'+stg(d)+'</span></div>'
  +'<div style="margin-top:5px">'+key(d)+'</div></div>'
  +'<div class="btnW"><button class="actBtn tiny" '+(d.canSwp?'':'disabled')+' style="width:54px">소탕</button>'
   +'<div class="bl'+(d.canSwp?'':' blDim')+'">'+vals(d.swp)+'</div></div>'
  +'<div class="btnW"><button class="actBtn tiny'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="width:54px">'+(d.lock?'잠김':'입장')+'</button>'
   +'<div class="bl'+(d.lock?' blDim':'')+'">'+vals(d.ent)+'</div></div>'
  +'</div>').join('')+'</div></div>'});

/* C2 — 버튼 아래 가로 한 줄 */
V.push({t:'C2 · 버튼 아래 가로 한 줄',
 n:'두 값을 한 줄에 나란히 둔다. 행이 64px 로 낮아져 다섯 종류가 넉넉히 들어간다. ⚠ 처음엔 이름이 38px 로 눌려 잘렸다 — 단계 배지를 아랫줄(열쇠 옆)로 내려 이름 줄을 비웠다. 대신 8.5px 숫자 넷이 한 줄에 몰린다.',
 h:'<div class="body">'+HINT+'<div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:64px">'
  +'<span class="dgIco'+(d.lock?' lk':'')+'">'+d.ic+'</span>'
  +'<div class="riMain"><div class="riName">'+NM(d.nm)+'</div>'
  +'<div style="margin-top:4px;display:flex;align-items:center;gap:5px"><span class="stgBadge">'+stg(d)+'</span>'+key(d)+'</div></div>'
  +'<div class="btnW"><button class="actBtn tiny" '+(d.canSwp?'':'disabled')+' style="width:58px">소탕</button>'
   +'<div class="bl row'+(d.canSwp?'':' blDim')+'">'+vals(d.swp)+'</div></div>'
  +'<div class="btnW"><button class="actBtn tiny'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="width:58px">'+(d.lock?'잠김':'입장')+'</button>'
   +'<div class="bl row'+(d.lock?' blDim':'')+'">'+vals(d.ent)+'</div></div>'
  +'</div>').join('')+'</div></div>'});

/* C3 — 값을 버튼 안으로 */
V.push({t:'C3 · 값을 버튼 안으로',
 n:'별도 줄을 만들지 않고 버튼을 2단으로 쓴다(라벨 위 · 수치 아래). 값과 버튼이 한 덩어리라 대응이 가장 분명하고 행도 낮다. ⚠ 일반 토벌은 버튼 안에 두 값이 들어가 78px 이 필요했다 — 배지를 아랫줄로 내려 자리를 만들었다.',
 h:'<div class="body">'+HINT+'<div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:62px">'
  +'<span class="dgIco'+(d.lock?' lk':'')+'">'+d.ic+'</span>'
  +'<div class="riMain"><div class="riName">'+NM(d.nm)+'</div>'
  +'<div style="margin-top:4px;display:flex;align-items:center;gap:5px"><span class="stgBadge">'+stg(d)+'</span>'+key(d)+'</div></div>'
  +'<button class="actBtn two" '+(d.canSwp?'':'disabled')+' style="flex:0 0 78px"><b>소탕</b>'
   +'<em>'+(d.canSwp? d.swp.map(v=>'<i class="ri '+v[0]+'"></i>'+v[1]).join('&nbsp;') :'—')+'</em></button>'
  +'<button class="actBtn two'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="flex:0 0 78px"><b>'+(d.lock?'잠김':'입장')+'</b>'
   +'<em>'+(d.ent.length? d.ent.map(v=>'<i class="ri '+v[0]+'"></i>'+v[1]).join('&nbsp;') :'—')+'</em></button>'
  +'</div>').join('')+'</div></div>'});

/* C4 — 값을 이름 아랫줄로, 버튼은 오른쪽 세로 */
V.push({t:'C4 · 값은 이름 아랫줄 · 버튼은 오른쪽 세로',
 n:'⚠ 원래 안(값을 버튼 왼쪽에 세로로)은 320px 에 물리적으로 안 들어갔다 — 여섯 칸을 늘어놓으면 이름 자리가 34px 밖에 안 남는다(실측). 그래서 값을 이름 아랫줄로 내리고 버튼을 오른쪽에 쌓았다. 값 네 개가 한 줄에 모여 소탕↔입장 비교가 가장 빠르다.',
 h:'<div class="body">'+HINT+'<div class="rmList">'
 +D.map(d=>'<div class="roomItem'+(d.lock?' locked':'')+'" style="--dc:'+d.dc+';height:70px">'
  +'<span class="dgIco'+(d.lock?' lk':'')+'">'+d.ic+'</span>'
  +'<div class="riMain"><div class="riName">'+NM(d.nm)+'<span class="stgBadge">'+stg(d)+'</span>'+key(d)+'</div>'
  +'<div style="margin-top:5px;display:flex;align-items:center;gap:7px">'
   +'<span class="sideVal row'+(d.canSwp?'':' blDim')+'"><b>소탕</b>'+vals(d.swp)+'</span>'
   +'<span class="sideVal row'+(d.lock?' blDim':'')+'"><b>입장</b>'+vals(d.ent)+'</span></div></div>'
  +'<div class="btnCol2"><button class="actBtn tiny'+(d.lock?'':' pri')+'"'+(d.lock?' disabled':'')+' style="width:50px">'+(d.lock?'잠김':'입장')+'</button>'
  +'<button class="actBtn tiny" '+(d.canSwp?'':'disabled')+' style="width:50px">소탕</button></div>'
  +'</div>').join('')+'</div></div>'});

document.getElementById('g').innerHTML=V.map(v=>
 '<div class="cell"><p class="cap"><i>'+v.t.split(' · ')[0]+' · </i>'+v.t.split(' · ')[1]+'</p><p class="note">'+v.n+'</p>'+shell(v.h)+'</div>').join('');
</script></body></html>
