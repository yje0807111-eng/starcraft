<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>튜토리얼 상자 — 세련되게 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ⚠ 지금(기준선): 검은 판 + 흰 1px + radius 3px + 꼬리 삼각. 붉은 링. 보상 버튼은 공용 .actBtn.pri.
   바꾸려는 것 — **환생 트리·룬 구역에서 쓰던 선과 상자의 어휘**를 가져와 세련되게.
   빌려 오는 어휘 넷:
     ① 트리 도움말 카드(.ctHelpCard) — 바깥 metal-edge + **안쪽 3px 금색 프레임**(이중 테두리) · 160deg 면
     ② 룬 칸 테두리(rnEg) — **위 흰빛 → 아래 갈래색** 세로 그라데 선
     ③ 룬 빈 칸(rnWell) — **파인 홈**(위 어둡고 아래 밝은 면) + 안쪽 얇은 흰 선
     ④ 룬 대기(rnAnts) — 둘레를 **흐르는 점선**
   ⛔ DESIGN.md 규칙은 그대로: 라운드 0(컷)/3/6/9 만 · 액센트는 역할별(금색=보상 · 시안=선택 · 붉은=지금 여기)
   ⚠ 크기는 실제와 같다: 화면 390 · 말풍선 최대 340 · 버튼 높이 36 · 글 12.5px */
:root{
  --ko:'IBM Plex Sans KR',sans-serif; --num:'Rajdhani',sans-serif;
  --gold:#ffd24a; --red:#ff7676; --cyan:#5cd6ff;
  --edge:rgba(255,255,255,.12); --metal:rgba(150,170,200,.20);
  --ink:#eef3fa; --dim:rgba(214,226,240,.72);
}
*{box-sizing:border-box}
body{margin:0;background:#0d1014;color:#dfe5ee;font-family:var(--ko);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:24px;justify-content:center;align-items:flex-start}
.cell{width:406px}
.cap{margin:0 0 5px;font-weight:700;font-size:13px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--num)}
.sub{margin:0 0 10px;color:#8d97a6;font-size:11px;line-height:1.6;min-height:62px}
.sub b{color:#c3ccd8;font-weight:700}
/* 무대 — 실제 캠프처럼 밝은 돌바닥 위에 딤이 깔린다 */
.phone{width:390px;height:300px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 0%,#9a9179,#6f6857)}
.phone::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 34px,transparent 34px 36px),
             repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 60px,transparent 60px 62px)}
.dim{position:absolute;inset:0;background:rgba(2,3,6,.72)}
/* 스포트라이트로 열린 칸(대상) — 딤을 네 판으로 두르는 것과 같은 결과를 clip 으로 흉내 */
.hole{position:absolute;left:150px;top:34px;width:90px;height:52px;
  box-shadow:0 0 0 9999px rgba(2,3,6,.72)}
.ring{position:absolute;left:150px;top:34px;width:90px;height:52px;pointer-events:none}
/* 말풍선 공통 뼈대 — 안의 구조는 여덟 안이 같고 **껍데기만** 다르다 */
.tip{position:absolute;left:26px;top:104px;width:308px;display:flex;flex-direction:column;gap:5px;
  padding:9px 11px;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.no{font-family:var(--num);font-size:11.5px;font-weight:800;color:var(--red);letter-spacing:.02em}
.pg{font-family:var(--num);font-size:11.5px;font-weight:800;color:rgba(214,226,240,.72)}
.tx{font-size:12.5px;font-weight:800;color:#fff;line-height:1.35;white-space:pre-line;word-break:keep-all}
/* 보상 버튼 — 공용 .actBtn.pri 재질이 기준선 */
.go{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;margin-top:3px;
  font-family:var(--ko);font-size:12.5px;font-weight:800;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(255,255,255,.14)}
.go .rw{display:inline-flex;align-items:center;gap:3px;font-family:var(--num);color:var(--gold)}
.go .gem{width:13px;height:13px;border-radius:2px;flex:none;
  background:linear-gradient(180deg,#c9b6ff,#6a4fd0);box-shadow:0 0 5px rgba(150,120,255,.5)}
.mm{margin:7px 0 0;color:#6f7887;font-size:10.5px;font-family:var(--num);letter-spacing:.04em}

/* ─────────────── ① 이중 테두리 카드 (트리 도움말 카드 문법) ─────────────── */
.v1 .tip{border:1px solid var(--metal);border-radius:6px;
  background:linear-gradient(160deg,rgba(19,24,35,.94),rgba(6,9,14,.96));
  box-shadow:0 6px 16px -10px #000}
.v1 .tip::before{content:'';position:absolute;inset:3px;pointer-events:none;
  border:1px solid rgba(255,210,74,.22);border-radius:3px}
.v1 .hd{padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.08)}
.v1 .ring{border:2px solid var(--red);border-radius:3px;box-shadow:0 0 0 3px rgba(255,118,118,.18)}

/* ─────────────── ② 파인 홈 + 흐르는 점선 (룬 빈 칸 문법) ─────────────── */
.v2 .tip{border-radius:6px;
  background:linear-gradient(180deg,#04070b,#0d141d 55%,#18222e);
  box-shadow:0 8px 20px -12px #000, inset 0 1px 0 rgba(255,255,255,.10)}
.v2 .tip::before{content:'';position:absolute;inset:2px;pointer-events:none;border-radius:4px;
  border:1px solid rgba(255,255,255,.07)}
.v2 .ring{border-radius:3px;border:1px solid transparent;
  background:linear-gradient(#0000,#0000) padding-box,
             linear-gradient(180deg,rgba(223,233,245,.34),rgba(255,118,118,.34) 45%,rgba(255,118,118,.12)) border-box}
.v2 .ants{position:absolute;left:-4px;top:-4px;right:-4px;bottom:-4px;border-radius:5px;
  border:1.1px dashed rgba(255,118,118,.75);animation:ants 1.1s linear infinite}
@keyframes ants{to{background-position:22px 0}}

/* ─────────────── ③ 모서리 컷 (볼륨 2 · 각진 SF) ─────────────── */
.v3 .tip{border:1px solid var(--edge);border-radius:0;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  background:linear-gradient(160deg,rgba(24,29,40,.94),rgba(7,10,15,.96))}
.v3 .tip::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.v3 .ring{border:2px solid var(--red);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.v3 .go{border-radius:0;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}

/* ─────────────── ④ 갈래 그라데 테두리 (룬 rnEg 문법) ─────────────── */
.v4 .tip{border-radius:6px;border:1px solid transparent;
  background:linear-gradient(180deg,rgba(12,15,21,.96),rgba(6,8,12,.97)) padding-box,
             linear-gradient(180deg,rgba(223,233,245,.42),rgba(255,210,74,.30) 45%,rgba(255,210,74,.10)) border-box;
  box-shadow:0 8px 20px -12px #000}
.v4 .ring{border-radius:3px;border:1px solid transparent;
  background:linear-gradient(#0000,#0000) padding-box,
             linear-gradient(180deg,rgba(223,233,245,.55),rgba(255,118,118,.55) 45%,rgba(255,118,118,.16)) border-box}
.v4 .go{border-color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.08)) padding-box,
             linear-gradient(180deg,rgba(255,210,74,.55),rgba(255,210,74,.16)) border-box}

/* ─────────────── ⑤ 왼쪽 진행 레일 (트리 마름모 표식) ─────────────── */
.v5 .tip{border:1px solid var(--metal);border-radius:6px;padding-left:26px;
  background:linear-gradient(160deg,rgba(19,24,35,.94),rgba(6,9,14,.96))}
.v5 .rail{position:absolute;left:11px;top:11px;bottom:11px;width:2px;
  background:linear-gradient(180deg,rgba(255,118,118,.75),rgba(255,118,118,.10))}
.v5 .pip{position:absolute;left:7px;top:12px;width:9px;height:9px;transform:rotate(45deg);
  background:var(--red);box-shadow:0 0 7px rgba(255,118,118,.6)}
.v5 .hd .no{display:none}
.v5 .hd{justify-content:flex-end}
.v5 .ring{border:2px solid var(--red);border-radius:3px}

/* ─────────────── ⑥ 보상 버튼을 카드 밖으로 (금색 강조) ─────────────── */
.v6 .tip{border:1px solid var(--metal);border-radius:6px;padding-bottom:22px;
  background:linear-gradient(160deg,rgba(19,24,35,.94),rgba(6,9,14,.96))}
.v6 .go{position:absolute;left:26px;right:26px;bottom:-16px;height:34px;margin:0;
  border-color:rgba(255,210,74,.45);color:#0e1116;
  background:linear-gradient(180deg,#ffe08a,#ffc93c);
  box-shadow:0 6px 16px -8px rgba(255,200,60,.55)}
.v6 .go .rw{color:#3a2a05}
.v6 .go .gem{background:linear-gradient(180deg,#7a5cff,#4a2fb0)}
.v6 .ring{border:2px solid var(--red);border-radius:3px}

/* ─────────────── ⑦ 판 없이 선만 (캠프 칩 어휘) ─────────────── */
.v7 .tip{padding:8px 2px 0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.95))}
.v7 .tip::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,var(--red),rgba(255,118,118,.10) 70%,transparent)}
.v7 .tx{font-size:13px}
.v7 .go{border:none;background:none;justify-content:flex-start;padding:0;height:30px;
  color:var(--gold);text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:rgba(255,210,74,.4)}
.v7 .ring{border:2px solid var(--red);border-radius:3px}

/* ─────────────── ⑧ 추천 — ①의 이중 테두리 + ②의 홈 + ⑥의 금색 버튼 ─────────────── */
.v8 .tip{border:1px solid var(--metal);border-radius:6px;
  background:linear-gradient(180deg,rgba(13,20,29,.96),rgba(4,7,11,.97));
  box-shadow:0 8px 22px -12px #000, inset 0 1px 0 rgba(255,255,255,.09)}
.v8 .tip::before{content:'';position:absolute;inset:3px;pointer-events:none;border-radius:3px;
  border:1px solid rgba(255,210,74,.18)}
.v8 .hd{padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.08)}
.v8 .go{margin-top:6px;border-color:rgba(255,210,74,.42);
  background:linear-gradient(180deg,rgba(255,210,74,.20),rgba(255,210,74,.08))}
.v8 .go .rw{color:#ffe08a}
.v8 .ring{border-radius:3px;border:1px solid transparent;
  background:linear-gradient(#0000,#0000) padding-box,
             linear-gradient(180deg,rgba(223,233,245,.55),rgba(255,118,118,.55) 45%,rgba(255,118,118,.16)) border-box;
  box-shadow:0 0 0 3px rgba(255,118,118,.14)}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const TIP = (v) => '<div class="tip">'
  + (v==='v5' ? '<i class="rail"></i><i class="pip"></i>' : '')
  + '<div class="hd"><b class="no">20 / 20</b><b class="pg">0 / 1</b></div>'
  + '<span class="tx">라운드가 오를수록 재화 획득 배수가 늘어납니다</span>'
  + '<button class="go"><span>확인</span><b class="rw"><i class="gem"></i>×20</b></button></div>';
const STAGE = (v) => '<div class="phone ' + v + '"><i class="hole"></i>'
  + '<i class="ring">' + (v==='v2' ? '<i class="ants"></i>' : '') + '</i>'
  + TIP(v) + '</div>';
const ANS = [
 ['이중 테두리 카드 <em>(트리 도움말)</em>','환생 트리의 도움말 카드(<b>.ctHelpCard</b>) 문법 그대로 — 바깥 금속 테두리 + <b>안쪽 3px 금색 프레임</b>, 머리줄 아래 구분선. 이 게임이 이미 쓰는 「읽는 카드」의 얼굴이라 낯설지 않다.'],
 ['파인 홈 + 흐르는 점선 <em>(룬 빈 칸)</em>','룬 빈 칸의 <b>파인 홈</b>(위가 어둡고 아래가 밝다) + 안쪽 얇은 흰 선. 링 둘레에는 룬의 <b>흐르는 점선</b>을 둘러 「여기를 보라」를 움직임으로 말한다.'],
 ['모서리 컷 <em>(볼륨 2 · 각진 SF)</em>','DESIGN 의 <b>모서리 컷 + 위 헤어라인</b>. 라운드를 0 으로 두고 각을 살린다 — 설정·상점 패널과 같은 언어라 게임 전체와 가장 잘 붙는다.'],
 ['갈래 그라데 테두리 <em>(룬 rnEg)</em>','룬 칸 테두리와 같은 <b>위 흰빛 → 아래 액센트</b> 세로 그라데 선. 테두리 하나로 「빛이 위에서 온다」를 말해 판이 얇아도 입체로 읽힌다.'],
 ['왼쪽 진행 레일','단계 번호를 지우고 왼쪽에 <b>레일 + 금색 마름모</b>(트리 비용 줄의 표식)를 세운다. 「지금 어디쯤」이 숫자가 아니라 <b>위치</b>로 읽힌다.'],
 ['보상 버튼을 카드 밖으로','버튼을 카드 <b>아래로 반쯤 걸치게</b> 하고 금색 면을 채운다. 마지막 단계에만 나오는 것이라 「여기서 끝난다」가 가장 세게 읽힌다.'],
 ['판 없이 선만 <em>(캠프 칩 어휘)</em>','좌상단 칩과 같은 문법 — 판을 걷고 <b>위쪽 붉은 선</b>과 글자만. 맵을 가장 적게 가리지만, 밝은 돌바닥에서 대비가 가장 약하다.'],
 ['추천 — ① + ② + ⑥','<b>이중 테두리</b>(①)에 <b>홈의 세로 그라데</b>(②)를 깔고, 보상 버튼만 <b>금색</b>(⑥)으로 올렸다. 링은 룬의 그라데 선. 카드는 조용하고 <b>보상만 빛난다</b>.'],
];
document.getElementById('wrap').innerHTML = ANS.map(([t,d],i) =>
 '<div class="cell"><p class="cap"><i>' + (i+1) + '</i>' + t + '</p><p class="sub">' + d + '</p>'
 + STAGE('v' + (i+1)) + '<p class="mm"></p></div>').join('');
const measure = () => { document.querySelectorAll('.cell').forEach(c => {
  const tp = c.querySelector('.tip').getBoundingClientRect();
  const go = c.querySelector('.go').getBoundingClientRect();
  c.querySelector('.mm').textContent = '말풍선 ' + tp.width.toFixed(0) + '×' + tp.height.toFixed(0)
    + 'px · 버튼 높이 ' + go.height.toFixed(0) + 'px'; }); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure); else setTimeout(measure, 300);
</script></body></html>
