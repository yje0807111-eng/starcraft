<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>환생 트리 — 안 산 별의 테두리 · 지정 효과 8안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--font-ko:'IBM Plex Sans KR',sans-serif;--font-num:'Rajdhani',sans-serif;
  --econ:#ffd24a;--army:#4aa8ff;--enemy:#ff3b3b;--root:#ff7a4a;--gold:#ffd24a}
*{box-sizing:border-box}
body{margin:0;background:#14171c;color:#dfe5ee;font-family:var(--font-ko);font-size:12px}
h1{margin:20px 22px 2px;font-size:15px}
.note{margin:0 22px 4px;color:#8d97a6;font-size:11.5px;line-height:1.7;max-width:1320px}
.note b{color:#dfe5ee}
.wrap{display:flex;flex-wrap:wrap;gap:22px;padding:18px 22px 30px;justify-content:flex-start;align-items:flex-start}
.cell{width:430px}
.cap{margin:0 0 5px;font-weight:700;font-size:13.5px}
.cap i{font-style:normal;color:var(--gold);margin-right:7px;font-family:var(--font-num)}
.sub{margin:0 0 8px;color:#8d97a6;font-size:11px;line-height:1.65;min-height:74px}
.sub b{color:#cfd7e2}
.pane{position:relative;width:430px;height:210px;
  background:radial-gradient(120% 130% at 50% 34%,#171d26 0%,#0c0f14 62%,#07090c 100%)}
svg{position:absolute;inset:0;width:100%;height:100%}
.lab{text-anchor:middle;font-size:8.5px;fill:#6d7683}
.tag{text-anchor:middle;dominant-baseline:hanging;font-family:var(--font-num);
  font-variant-numeric:tabular-nums;font-size:9px;fill:#7b8593}
/* 지정·맥동은 정지 그림으로는 안 보인다 — 목업에서는 실제로 움직이게 둔다 */
@keyframes selBreath{0%,100%{opacity:.30}50%{opacity:.85}}
@keyframes selDraw{to{stroke-dashoffset:0}}
@keyframes selPull{0%{transform:scale(1.30);opacity:0}
  55%{opacity:.9}100%{transform:scale(1);opacity:.55}}
@keyframes buyBreath{0%,100%{opacity:.16}50%{opacity:.42}}
.selB{animation:selBreath 1.5s ease-in-out infinite}
.selP{animation:selPull 1.1s cubic-bezier(.2,.8,.3,1) infinite}
.buyB{animation:buyBreath 2.6s ease-in-out infinite}
.dash{animation:selDraw 1.4s linear infinite}
</style></head><body>
<h1>환생 트리 — 안 산 별의 테두리 · 지정했을 때 8안</h1>
<p class="note">각 안마다 네 칸: <b>못 산다</b>(아직 조건이 안 됨) · <b>살 수 있다</b> · <b>살 수 있다 + 지정됨</b> · <b>샀다</b>(기준 · 어느 안에서도 안 바꾼다).
「샀다」는 지금 게임과 같은 그림이다 — 그라디언트 테두리 + 도형을 따라 번지는 빛 + 안쪽 흰 실선 + 아이콘 뒤 광.
지정 효과는 <b>움직인다</b>(정지 그림으로는 판단이 안 된다).</p>
<div class="wrap" id="wrap"></div>
<script>
/* ── 실제 게임과 같은 값 ─────────────────────────────────────────────── */
const ICO = '../../assets/icons/tree/';
const CY = 92, R = 30;
const SLOT = [
  { x: 62,  st:'next', col:'#4aa8ff', ic:'atk',    cost:96, lab:'못 산다'   },
  { x:160,  st:'buy',  col:'#ffd24a', ic:'gather', cost:24, lab:'살 수 있다' },
  { x:262,  st:'buy',  col:'#ffd24a', ic:'mine',   cost:24, lab:'지정됨', sel:1 },
  { x:366,  st:'own',  col:'#ffd24a', ic:'gas',    cost:0,  lab:'샀다'     },
];
function hexPts(x, y, r){ const q = [];
  for(let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 90);
    q.push((x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1)); }
  return q.join(' '); }
function hexPath(x, y, r){ return 'M' + hexPts(x, y, r).split(' ').join('L') + 'Z'; }
function hexLen(r){ return 6 * r; }          // 정육각 둘레
/* 🔝 육각의 **위쪽 절반** 선 — 꼭짓점 v5·v0·v1 을 지나고 양끝은 이웃 변의 절반까지.
   ⚠ stroke-dasharray 로 자르지 말 것 — 어느 변이 켜지는지 눈으로 못 좇는다(여기서 두 번 빗나갔다).
   ⭐ 점을 직접 찍으면 「위쪽 절반」이 코드에도 그림에도 그대로 보인다. */
function hexTopHalf(x, y, r){
  const P = i => { const a = Math.PI / 180 * (60 * i - 90);
    return [x + r * Math.cos(a), y + r * Math.sin(a)]; };
  const mid = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t];
  const v4 = P(4), v5 = P(5), v0 = P(0), v1 = P(1), v2 = P(2);
  const pts = [mid(v4, v5, .5), v5, v0, v1, mid(v1, v2, .5)];
  return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L'); }

/* 게임의 defs 를 그대로 옮긴다 */
function defs(){
  const cols = ['#ffd24a','#4aa8ff','#ff3b3b','#5ad07a','#ff7a4a'];
  return '<defs>' + cols.map(function(c){
    return '<linearGradient id="g' + c.slice(1) + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>' +
      '<stop offset=".42" stop-color="' + c + '"/>' +
      '<stop offset="1" stop-color="' + c + '" stop-opacity=".34"/></linearGradient>' +
    /* 안 산 별용 — 같은 형태의 그라디언트를 **아주 낮은 알파**로 */
    '<linearGradient id="d' + c.slice(1) + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>' +
      '<stop offset=".45" stop-color="' + c + '" stop-opacity=".55"/>' +
      '<stop offset="1" stop-color="' + c + '" stop-opacity=".10"/></linearGradient>' +
    '<radialGradient id="b' + c.slice(1) + '">' +
      '<stop offset="0" stop-color="' + c + '" stop-opacity=".22"/>' +
      '<stop offset=".62" stop-color="' + c + '" stop-opacity=".07"/>' +
      '<stop offset="1" stop-color="' + c + '" stop-opacity="0"/></radialGradient>'; }).join('') +
    /* 잠긴 별용 — 색을 뺀 은회색 그라디언트 */
    '<linearGradient id="lk" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#cfe0f2" stop-opacity=".52"/>' +
      '<stop offset=".45" stop-color="#8ea3ba" stop-opacity=".30"/>' +
      '<stop offset="1" stop-color="#6d7d90" stop-opacity=".08"/></linearGradient>' +
    '<linearGradient id="face" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#1b2634"/><stop offset="1" stop-color="#06090e"/></linearGradient>' +
    '<filter id="dim"><feColorMatrix type="saturate" values="0.15"/>' +
      '<feComponentTransfer><feFuncR type="linear" slope="0.42"/><feFuncG type="linear" slope="0.42"/>' +
      '<feFuncB type="linear" slope="0.46"/></feComponentTransfer></filter>' +
    '</defs>'; }

/* ── 「샀다」 — 지금 게임 그대로. 어느 안에서도 손대지 않는다 ─────────── */
function ownStar(s, r){
  const c = s.col;
  return '<polygon points="' + hexPts(s.x, CY, r + 4) + '" fill="none" stroke="' + c +
      '" stroke-width="1" opacity=".45"/>' +
    '<polygon points="' + hexPts(s.x, CY, r) + '" fill="#000" opacity=".55"/>' +
    '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="url(#face)" stroke="url(#g' +
      c.slice(1) + ')" stroke-width="1.3" style="filter:drop-shadow(0 0 3px ' + c + ')"/>' +
    '<circle cx="' + s.x + '" cy="' + CY + '" r="' + (r * .72) + '" fill="url(#b' + c.slice(1) + ')"/>' +
    '<polygon points="' + hexPts(s.x, CY, r - Math.max(1, r * .073)) + '" fill="none" stroke="#fff" ' +
      'stroke-width=".6" opacity=".16"/>' +
    img(s.x, CY, r * 1.46, s.ic, 1, 0); }

function img(x, y, w, key, op, dim){
  return '<image href="' + ICO + key + '.webp" x="' + (x - w / 2).toFixed(1) + '" y="' +
    (y - w / 2).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + w.toFixed(1) +
    '" opacity="' + op + '"' + (dim ? ' filter="url(#dim)"' : '') +
    ' preserveAspectRatio="xMidYMid meet"/>'; }

function faceOf(s, r, o){                      /* 안 산 별의 안쪽 면 — 안마다 달라진다 */
  const lift = (o.selFace && s.sel) ? o.selFace : 0;
  return '<polygon points="' + hexPts(s.x, CY, r) + '" fill="#000" opacity=".55"/>' +
    '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="url(#face)" opacity="' +
    (0.9 + lift).toFixed(2) + '"/>'; }

function iconOf(s, r, o){
  const up = (o.selIcon && s.sel) ? o.selIcon : 0;
  const base = s.st === 'buy' ? .92 : .6;
  return img(s.x, CY, r * 1.46, s.ic, Math.min(1, base + up), !(o.selIcon && s.sel && o.selUndim)); }

function costOf(s, r){
  if(s.st === 'own') return '';
  return '<text class="tag" x="' + s.x + '" y="' + (CY + r + 5) + '"' +
    (s.st === 'buy' ? ' fill="' + s.col + '"' : '') + '>' + s.cost + '</text>'; }

function labels(){ return SLOT.map(function(s){
  return '<text class="lab" x="' + s.x + '" y="' + (CY + R + 34) + '">' + s.lab + '</text>'; }).join(''); }

/* ── 테두리 여덟 갈래 ────────────────────────────────────────────────── */
const EDGE = {
  /* ⓪ 지금 — 한 가지 색 1.1px 실선 */
  flat: function(s, r){
    const c = s.st === 'buy' ? s.col : 'rgba(200,220,240,.30)';
    return '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="' + c +
      '" stroke-width="1.1"/>'; },
  /* ① 세로 그라디언트 — 산 별과 같은 문법, 알파만 낮게 */
  grad: function(s, r){
    const id = s.st === 'buy' ? ('d' + s.col.slice(1)) : 'lk';
    return '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="url(#' + id +
      ')" stroke-width="1.2"/>'; },
  /* ② 파선 — 「아직 채워지지 않은 자리」 */
  dash: function(s, r){
    const c = s.st === 'buy' ? s.col : 'rgba(200,220,240,.34)';
    return '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="' + c +
      '" stroke-width="1.2" stroke-dasharray="5 4" opacity="' + (s.st === 'buy' ? .85 : .7) + '"/>'; },
  /* ③ 꼭짓점만 — 여섯 모서리에 짧은 조각 */
  corner: function(s, r){
    const c = s.st === 'buy' ? s.col : 'rgba(200,220,240,.38)';
    const rr = r - r * .07; let d = '';
    for(let i = 0; i < 6; i++){
      const a0 = Math.PI / 180 * (60 * i - 90), a1 = Math.PI / 180 * (60 * (i + 1) - 90);
      const px = s.x + rr * Math.cos(a0), py = CY + rr * Math.sin(a0);
      const qx = s.x + rr * Math.cos(a1), qy = CY + rr * Math.sin(a1);
      d += 'M' + px.toFixed(1) + ' ' + py.toFixed(1) + 'L' + (px + (qx - px) * .3).toFixed(1) + ' ' +
             (py + (qy - py) * .3).toFixed(1) +
           'M' + qx.toFixed(1) + ' ' + qy.toFixed(1) + 'L' + (qx + (px - qx) * .3).toFixed(1) + ' ' +
             (qy + (py - qy) * .3).toFixed(1); }
    return '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-linecap="round"/>' +
      '<polygon points="' + hexPts(s.x, CY, rr) + '" fill="none" stroke="' + c +
      '" stroke-width="1" opacity=".22"/>'; },
  /* ④ 반쯤 채운 테두리 — 위는 밝고 아래는 사라진다(빛이 위에서 온다) */
  half: function(s, r){
    const c = s.st === 'buy' ? s.col : '#a8bcd2';
    const rr = r - r * .07, len = hexLen(rr);
    return '<polygon points="' + hexPts(s.x, CY, rr) + '" fill="none" stroke="' + c +
        '" stroke-width="1" opacity=".13"/>' +
      '<path d="' + hexTopHalf(s.x, CY, rr) + '" fill="none" stroke="' + c + '" stroke-width="1.4" ' +
        'stroke-linecap="round" opacity="' + (s.st === 'buy' ? .95 : .55) + '"/>'; },
  /* ⑤ 이중 테두리 — 판(DESIGN.md)의 어휘를 별에 */
  dual: function(s, r){
    const c = s.st === 'buy' ? s.col : 'rgba(200,220,240,.30)';
    return '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="' + c +
        '" stroke-width="1.1"/>' +
      '<polygon points="' + hexPts(s.x, CY, r - 3.4) + '" fill="none" stroke="' +
        (s.st === 'buy' ? s.col : '#cfe0f2') + '" stroke-width=".7" opacity=".18"/>'; },
  /* ⑥ 파낸 자리 — 테두리는 거의 없고 **안쪽 그림자**로 홈을 판다 */
  carve: function(s, r){
    const c = s.st === 'buy' ? s.col : '#9db1c6';
    const rr = r - r * .07;
    return '<polygon points="' + hexPts(s.x, CY, rr) + '" fill="none" stroke="#000" ' +
        'stroke-width="2.4" opacity=".55"/>' +
      '<polygon points="' + hexPts(s.x, CY, rr) + '" fill="none" stroke="#cfe0f2" ' +
        'stroke-width=".8" opacity=".13"/>' +
      '<path d="' + hexTopHalf(s.x, CY, rr) + '" fill="none" stroke="' + c + '" stroke-width="1.3" ' +
        'stroke-linecap="round" opacity="' + (s.st === 'buy' ? .95 : .55) + '"/>' +
      '<path d="' + hexTopHalf(s.x, CY, rr - 2.2) + '" fill="none" stroke="#fff" stroke-width=".7" ' +
        'stroke-linecap="round" opacity=".20"/>'; },
  /* ⑦ 추천 — 그라디언트 + 아주 옅은 바깥 육각(살 수 있는 것만 숨 쉰다) */
  best: function(s, r){
    const id = s.st === 'buy' ? ('d' + s.col.slice(1)) : 'lk';
    const out = s.st === 'buy'
      ? '<polygon class="buyB" points="' + hexPts(s.x, CY, r + 4) + '" fill="none" stroke="' + s.col +
        '" stroke-width="1"/>' : '';
    return out +
      '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="url(#' + id +
        ')" stroke-width="1.25"/>' +
      '<polygon points="' + hexPts(s.x, CY, r - 3.2) + '" fill="none" stroke="#cfe0f2" ' +
        'stroke-width=".6" opacity=".10"/>'; },
};

/* ── 지정 효과 여덟 갈래 ─────────────────────────────────────────────── */
const SEL = {
  none: function(){ return ''; },
  /* 바깥 육각 링이 숨 쉰다 */
  breath: function(s, r){
    return '<polygon class="selB" points="' + hexPts(s.x, CY, r + 5) + '" fill="none" stroke="' +
      s.col + '" stroke-width="1.2"/>'; },
  /* 파선이 돈다 — 「고르는 중」 */
  march: function(s, r){
    const rr = r + 5, len = hexLen(rr);
    return '<path class="dash" d="' + hexPath(s.x, CY, rr) + '" fill="none" stroke="' + s.col +
      '" stroke-width="1.2" stroke-dasharray="6 5" stroke-dashoffset="' + len.toFixed(1) +
      '" opacity=".85"/>'; },
  /* 꼭짓점 조각이 조여든다 — SF 조준선 */
  lock: function(s, r){
    const rr = r + 6; let d = '';
    for(let i = 0; i < 6; i++){
      const a0 = Math.PI / 180 * (60 * i - 90), a1 = Math.PI / 180 * (60 * (i + 1) - 90);
      const px = s.x + rr * Math.cos(a0), py = CY + rr * Math.sin(a0);
      const qx = s.x + rr * Math.cos(a1), qy = CY + rr * Math.sin(a1);
      d += 'M' + px.toFixed(1) + ' ' + py.toFixed(1) + 'L' + (px + (qx - px) * .28).toFixed(1) + ' ' +
             (py + (qy - py) * .28).toFixed(1) +
           'M' + qx.toFixed(1) + ' ' + qy.toFixed(1) + 'L' + (qx + (px - qx) * .28).toFixed(1) + ' ' +
             (qy + (py - qy) * .28).toFixed(1); }
    return '<g class="selP" style="transform-origin:' + s.x + 'px ' + CY + 'px">' +
      '<path d="' + d + '" fill="none" stroke="' + s.col + '" stroke-width="2" stroke-linecap="round"/></g>'; },
  /* 뒤에서 빛이 차오른다 — 테두리를 안 건드린다 */
  glowBack: function(s, r){
    return '<circle cx="' + s.x + '" cy="' + CY + '" r="' + (r * 1.7).toFixed(1) +
      '" fill="url(#b' + s.col.slice(1) + ')" class="selB"/>' +
      '<circle cx="' + s.x + '" cy="' + CY + '" r="' + (r * 1.0).toFixed(1) +
      '" fill="url(#b' + s.col.slice(1) + ')"/>'; },
  /* 테두리가 산 별의 것으로 바뀐다 — 「사면 이렇게 된다」 미리보기 */
  preview: function(s, r){
    return '<polygon points="' + hexPts(s.x, CY, r - r * .07) + '" fill="none" stroke="url(#g' +
      s.col.slice(1) + ')" stroke-width="1.3" style="filter:drop-shadow(0 0 3px ' + s.col + ')"/>' +
      '<polygon points="' + hexPts(s.x, CY, r - Math.max(1, r * .073)) + '" fill="none" ' +
      'stroke="#fff" stroke-width=".6" opacity=".16"/>'; },
  /* 두 겹 — 밖은 숨 쉬고 안은 산 별의 테두리 */
  both: function(s, r){
    return SEL.preview(s, r) + SEL.breath(s, r); },
  /* 조준선 + 뒤 빛 */
  lockGlow: function(s, r){ return SEL.glowBack(s, r) + SEL.lock(s, r); },
};

/* ── 한 안을 통째로 ──────────────────────────────────────────────────── */
function scene(o){
  let s = defs();
  SLOT.forEach(function(sl){
    if(sl.st === 'own'){ s += ownStar(sl, R) + costOf(sl, R); return; }
    if(sl.sel && o.selBack) s += SEL[o.selBack](sl, R);
    s += faceOf(sl, R, o);
    s += EDGE[o.edge](sl, R);
    if(sl.sel && o.sel && !o.selBack) s += SEL[o.sel](sl, R);
    else if(sl.sel && o.selBack && o.sel !== o.selBack) s += SEL[o.sel](sl, R);
    s += iconOf(sl, R, o) + costOf(sl, R); });
  return '<svg viewBox="0 0 430 210">' + s + labels() + '</svg>'; }

const CASES = [
  { t:'지금 (기준)',
    d:'테두리는 <b>한 가지 색 1.1px 실선</b> 하나뿐이다. 산 별은 그라디언트·번짐·안쪽 실선까지 갖는데 안 산 별만 평평해서 <b>같은 화면의 것으로 안 읽힌다</b>. 지정해도 아무 일이 없다.',
    o:{ edge:'flat', sel:'none' } },

  { t:'세로 그라디언트 · 지정 = 숨쉬는 링',
    d:'테두리에 <b>산 별과 같은 문법</b>(위는 밝고 아래로 흐려지는 세로 그라디언트)을 알파만 낮춰 넣는다. 색은 그대로 두고 <b>깊이만</b> 얻는다. 지정하면 바깥 육각 링이 천천히 숨 쉰다.',
    o:{ edge:'grad', sel:'breath' } },

  { t:'파선 · 지정 = 흐르는 파선',
    d:'안 산 별은 <b>끊어진 선</b>이다 — 「아직 채워지지 않은 자리」가 한눈에 읽힌다. 트리의 안 산 <b>연결선도 이미 파선</b>이라 어휘가 맞는다. 지정하면 파선이 그 별을 돌며 흐른다.',
    o:{ edge:'dash', sel:'march' } },

  { t:'꼭짓점만 · 지정 = 조여드는 조준선',
